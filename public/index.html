<script>
const $ = id => document.getElementById(id);

const dateInput = $("date");
const venueSelect = $("venue");
const raceGrid = $("raceGrid");
const racersBox = $("racers");
const predictionBox = $("prediction");
const historyBox = $("history");
const summaryBox = $("summary");
const learningBox = $("learning");
const weightsBox = $("weights");

const venueStatus = $("venueStatus");
const raceStatus = $("raceStatus");
const racerStatus = $("racerStatus");
const predictionStatus = $("predictionStatus");
const saveStatus = $("saveStatus");
const learningStatus = $("learningStatus");
const weightStatus = $("weightStatus");
const raceTitle = $("raceTitle");

let currentSnapshot = null;

/* =========================
   基本
========================= */

function todayLocal(){
  const now = new Date();

  const y = now.getFullYear();
  const m = String(now.getMonth()+1).padStart(2,"0");
  const d = String(now.getDate()).padStart(2,"0");

  return `${y}-${m}-${d}`;
}

function apiDate(){
  return dateInput.value.replaceAll("-","");
}

async function getJSON(url){
  const controller = new AbortController();

  const timer = setTimeout(
    ()=>controller.abort(),
    12000
  );

  try{
    const response = await fetch(
      url,
      {
        signal:controller.signal,
        cache:"no-store"
      }
    );

    const data = await response.json();

    if(!response.ok || !data.ok){
      throw new Error(
        data.error || `HTTP ${response.status}`
      );
    }

    return data;
  }
  finally{
    clearTimeout(timer);
  }
}

function safeNumber(v){
  if(
    v === null ||
    v === undefined ||
    v === ""
  ){
    return null;
  }

  const n = Number(v);

  return Number.isFinite(n)
    ? n
    : null;
}

function fmt(v,digits=2){
  const n = safeNumber(v);

  return n === null
    ? "-"
    : n.toFixed(digits);
}

function yen(v){
  return Number(v || 0).toLocaleString("ja-JP")+"円";
}

function clamp(value,min,max){
  return Math.max(
    min,
    Math.min(max,value)
  );
}

/* =========================
   保存
========================= */

function getHistory(){
  try{
    return JSON.parse(
      localStorage.getItem("boat_ai_predictions") || "[]"
    );
  }
  catch{
    return [];
  }
}

function saveHistory(history){
  localStorage.setItem(
    "boat_ai_predictions",
    JSON.stringify(history)
  );
}

/* =========================
   直前情報
========================= */

function mergeBefore(racers,beforeData){
  return racers.map(
    racer=>{
      const live =
        beforeData?.racers?.find(
          x => Number(x.lane) === Number(racer.lane)
        );

      return {
        ...racer,

        before:{
          course:live?.course ?? null,
          exhibitionTime:live?.exhibitionTime ?? null,
          exhibitionST:live?.exhibitionST ?? null,
          tilt:live?.tilt ?? null
        }
      };
    }
  );
}

/* =========================
   基本採点の内訳
========================= */

function scoreComponents(racer,allRacers){
  const components = {
    lane:0,
    class:0,
    national:0,
    local:0,
    st:0,
    motor:0,
    exhibition:0,
    exhibitionST:0,
    course:0
  };

  const laneScore = {
    1:25,
    2:19,
    3:16,
    4:13,
    5:8,
    6:5
  };

  components.lane =
    laneScore[racer.lane] || 0;

  const classScore = {
    A1:15,
    A2:12,
    B1:7,
    B2:3
  };

  components.class =
    classScore[racer.class] || 0;

  const national =
    safeNumber(
      racer.national?.winRate
    );

  if(national !== null){
    components.national =
      Math.min(
        18,
        national * 2.25
      );
  }

  const local =
    safeNumber(
      racer.local?.winRate
    );

  if(local !== null){
    components.local =
      Math.min(
        10,
        local * 1.25
      );
  }

  const avgST =
    safeNumber(racer.avgST);

  if(avgST !== null){
    if(avgST <= .12){
      components.st = 8;
    }
    else if(avgST <= .14){
      components.st = 7;
    }
    else if(avgST <= .16){
      components.st = 5;
    }
    else if(avgST <= .18){
      components.st = 3;
    }
    else{
      components.st = 1;
    }
  }

  const motor =
    safeNumber(
      racer.motor?.secondRate
    );

  if(motor !== null){
    components.motor =
      Math.min(
        10,
        motor / 5
      );
  }

  const times =
    allRacers
      .map(
        r =>
          safeNumber(
            r.before?.exhibitionTime
          )
      )
      .filter(
        n => n !== null
      );

  const exhibition =
    safeNumber(
      racer.before?.exhibitionTime
    );

  if(
    exhibition !== null &&
    times.length
  ){
    const fastest =
      Math.min(...times);

    const diff =
      exhibition-fastest;

    if(diff <= .01){
      components.exhibition = 8;
    }
    else if(diff <= .03){
      components.exhibition = 7;
    }
    else if(diff <= .05){
      components.exhibition = 5;
    }
    else if(diff <= .08){
      components.exhibition = 3;
    }
    else{
      components.exhibition = 1;
    }
  }

  const exhibitionST =
    safeNumber(
      racer.before?.exhibitionST
    );

  if(exhibitionST !== null){
    if(exhibitionST <= .05){
      components.exhibitionST = 4;
    }
    else if(exhibitionST <= .10){
      components.exhibitionST = 3;
    }
    else if(exhibitionST <= .15){
      components.exhibitionST = 2;
    }
    else{
      components.exhibitionST = 1;
    }
  }

  const course =
    safeNumber(
      racer.before?.course
    );

  if(course === 1){
    components.course = 2;
  }
  else if(
    course !== null &&
    course <= 3
  ){
    components.course = 1;
  }

  return components;
}

/* =========================
   V6.5 項目別学習
========================= */

const COMPONENT_NAMES = {
  lane:"枠・コース基本力",
  class:"級別",
  national:"全国勝率",
  local:"当地勝率",
  st:"平均ST",
  motor:"モーター",
  exhibition:"展示タイム",
  exhibitionST:"展示ST",
  course:"展示コース"
};

function getTrainableHistory(){
  return getHistory().filter(
    item =>
      item.result?.finished &&
      Array.isArray(item.racersDetailed) &&
      item.racersDetailed.length === 6 &&
      Array.isArray(item.result.winningLanes) &&
      item.result.winningLanes.length >= 3
  );
}

/*
  各項目について、
  1〜3着艇の平均採点が
  全6艇平均よりどの程度高かったかを見る。

  データ10R未満なら1.00。
  最大 ±15%。
*/

function calculateLearnedWeights(){
  const history =
    getTrainableHistory();

  const base = {};

  for(const key of Object.keys(COMPONENT_NAMES)){
    base[key] = 1;
  }

  if(history.length < 10){
    return {
      active:false,
      races:history.length,
      weights:base
    };
  }

  const signals = {};

  for(const key of Object.keys(COMPONENT_NAMES)){
    signals[key] = [];
  }

  for(const item of history){
    const winners =
      new Set(
        item.result.winningLanes.slice(0,3).map(Number)
      );

    for(const key of Object.keys(COMPONENT_NAMES)){
      const allValues =
        item.racersDetailed
          .map(
            r =>
              Number(
                r.components?.[key] || 0
              )
          );

      const winnerValues =
        item.racersDetailed
          .filter(
            r =>
              winners.has(
                Number(r.lane)
              )
          )
          .map(
            r =>
              Number(
                r.components?.[key] || 0
              )
          );

      if(!winnerValues.length){
        continue;
      }

      const allAvg =
        allValues.reduce(
          (a,b)=>a+b,
          0
        ) / allValues.length;

      const winnerAvg =
        winnerValues.reduce(
          (a,b)=>a+b,
          0
        ) / winnerValues.length;

      /*
        項目の最大点の違いを吸収するため
        相対差にする。
      */

      if(allAvg > 0){
        signals[key].push(
          (winnerAvg-allAvg) /
          allAvg
        );
      }
    }
  }

  const weights = {};

  for(const key of Object.keys(COMPONENT_NAMES)){
    const arr =
      signals[key];

    if(!arr.length){
      weights[key] = 1;
      continue;
    }

    const avg =
      arr.reduce(
        (a,b)=>a+b,
        0
      ) / arr.length;

    /*
      学習速度をかなり抑える。
    */

    const adjustment =
      clamp(
        avg * 0.35,
        -0.15,
        0.15
      );

    weights[key] =
      Math.round(
        (1+adjustment)*1000
      ) / 1000;
  }

  return {
    active:true,
    races:history.length,
    weights
  };
}

function scoreWithLearning(
  components,
  learned
){
  let baseScore = 0;
  let learnedScore = 0;

  for(
    const key of
    Object.keys(COMPONENT_NAMES)
  ){
    const value =
      Number(
        components[key] || 0
      );

    baseScore += value;

    learnedScore +=
      value *
      Number(
        learned.weights[key] || 1
      );
  }

  return {
    baseScore:
      Math.round(
        baseScore*10
      )/10,

    learnedScore:
      Math.round(
        learnedScore*10
      )/10
  };
}

/* =========================
   AI確率
========================= */

function strength(score){
  return Math.exp(
    score / 18
  );
}

function trifectaProbability(
  first,
  second,
  third,
  scored
){
  const racers =
    scored.map(
      r=>({
        lane:r.lane,
        strength:
          strength(r.score)
      })
    );

  const total1 =
    racers.reduce(
      (sum,r)=>sum+r.strength,
      0
    );

  const r1 =
    racers.find(
      r=>r.lane===first
    );

  const r2 =
    racers.find(
      r=>r.lane===second
    );

  const r3 =
    racers.find(
      r=>r.lane===third
    );

  if(!r1 || !r2 || !r3){
    return 0;
  }

  const p1 =
    r1.strength/total1;

  const total2 =
    total1-r1.strength;

  const p2 =
    r2.strength/total2;

  const total3 =
    total2-r2.strength;

  const p3 =
    r3.strength/total3;

  return p1*p2*p3;
}

function getMarks(sorted){
  const marks = {};

  if(sorted[0]){
    marks[sorted[0].lane]="◎";
  }

  if(sorted[1]){
    marks[sorted[1].lane]="○";
  }

  if(sorted[2]){
    marks[sorted[2].lane]="▲";
  }

  return marks;
}

function getConfidence(sorted){
  if(sorted.length < 3){
    return "B";
  }

  const top =
    sorted[0].score;

  const gap2 =
    sorted[0].score -
    sorted[1].score;

  const gap3 =
    sorted[0].score -
    sorted[2].score;

  if(
    top >= 82 &&
    gap2 >= 8 &&
    gap3 >= 14
  ){
    return "S";
  }

  if(
    top >= 68 &&
    gap2 >= 4
  ){
    return "A";
  }

  return "B";
}

function makeCandidates(scored){
  const top =
    scored
      .slice(0,4)
      .map(r=>r.lane);

  const list = [];

  for(const a of top){
    for(const b of top){
      if(a===b) continue;

      for(const c of top){
        if(
          c===a ||
          c===b
        ){
          continue;
        }

        list.push(
          `${a}-${b}-${c}`
        );
      }
    }
  }

  return list;
}

function makeOddsMap(oddsData){
  const map = {};

  for(
    const item of
    oddsData?.odds || []
  ){
    map[item.combination] =
      Number(item.odds);
  }

  return map;
}

function evaluateBets(
  scored,
  oddsData
){
  const map =
    makeOddsMap(oddsData);

  const results = [];

  for(
    const combo of
    makeCandidates(scored)
  ){
    const parts =
      combo
        .split("-")
        .map(Number);

    const probability =
      trifectaProbability(
        parts[0],
        parts[1],
        parts[2],
        scored
      );

    const odds =
      safeNumber(
        map[combo]
      );

    if(odds === null){
      continue;
    }

    results.push({
      combination:combo,
      probability,
      odds,
      ev:probability*odds
    });
  }

  return results
    .sort(
      (a,b)=>b.ev-a.ev
    )
    .slice(0,6);
}

/* =========================
   予想
========================= */

function renderPrediction(
  racers,
  oddsData,
  context
){
  const learned =
    calculateLearnedWeights();

  const detailed =
    racers.map(
      racer=>{
        const components =
          scoreComponents(
            racer,
            racers
          );

        const scores =
          scoreWithLearning(
            components,
            learned
          );

        return {
          ...racer,
          components,
          baseScore:scores.baseScore,
          score:scores.learnedScore
        };
      }
    );

  const scored =
    detailed
      .slice()
      .sort(
        (a,b)=>b.score-a.score
      );

  const marks =
    getMarks(scored);

  const confidence =
    getConfidence(scored);

  const bets =
    evaluateBets(
      scored,
      oddsData
    );

  predictionStatus.textContent =
    learned.active
      ? `勝負度 ${confidence} / 項目別学習 ON（${learned.races}R）`
      : `勝負度 ${confidence} / 項目別学習待ち ${learned.races}/10R`;

  const changed =
    Object.entries(
      learned.weights
    )
      .filter(
        ([,v]) =>
          Math.abs(v-1) >= .005
      );

  const weightText =
    learned.active
      ? (
          changed.length
            ? changed.map(
                ([key,v])=>
                  `${COMPONENT_NAMES[key]} ×${v.toFixed(3)}`
              ).join("<br>")
            : "現在の補正はほぼ標準値です"
        )
      : `あと${Math.max(0,10-learned.races)}Rで項目別学習開始`;

  predictionBox.innerHTML = `
    <div class="prediction">

      <div>
        勝負度：
        <span class="confidence">
          ${confidence}
        </span>
      </div>

      <div class="adjust">
        🧠 項目別学習
        <br>
        ${weightText}
      </div>

      ${scored.slice(0,3).map(r=>`
        <div class="rank">

          <div>
            <span class="mark">
              ${marks[r.lane] || ""}
            </span>
            ${r.lane}号艇 ${r.name}
          </div>

          <div style="text-align:right">
            <strong>
              ${r.score.toFixed(1)}点
            </strong>

            <div class="base-score">
              基本 ${r.baseScore.toFixed(1)}
            </div>
          </div>

        </div>
      `).join("")}

      <div style="
        margin-top:14px;
        font-weight:900;
      ">
        EVランキング
      </div>

      ${bets.map(b=>`
        <div class="ev-card">

          <div class="ev-top">
            <div class="combo">
              ${b.combination}
            </div>
          </div>

          <div class="ev-grid">

            <div class="ev-item">
              推定確率
              <strong>
                ${(b.probability*100).toFixed(1)}%
              </strong>
            </div>

            <div class="ev-item">
              オッズ
              <strong>
                ${b.odds.toFixed(1)}
              </strong>
            </div>

            <div class="ev-item">
              参考EV
              <strong>
                ${b.ev.toFixed(2)}
              </strong>
            </div>

          </div>
        </div>
      `).join("")}

      <div class="notice">
        V6.5では基本点と学習後点を別々に保存します。
        学習値は過去実績から計算した補正で、将来の的中を保証するものではありません。
      </div>

    </div>
  `;

  currentSnapshot = {
    id:
      `${context.date}-${context.jcd}-${context.rno}-${Date.now()}`,

    version:"6.5",

    createdAt:
      new Date().toISOString(),

    date:context.date,
    jcd:context.jcd,
    venue:context.venue,
    rno:context.rno,
    confidence,

    learnedWeights:
      learned.weights,

    learningRaces:
      learned.races,

    racersDetailed:
      detailed.map(
        r=>({
          lane:r.lane,
          name:r.name,
          class:r.class,

          components:{
            ...r.components
          },

          baseScore:r.baseScore,
          learnedScore:r.score
        })
      ),

    scored:
      scored.map(
        r=>({
          lane:r.lane,
          name:r.name,
          class:r.class,
          baseScore:r.baseScore,
          score:r.score
        })
      ),

    bets:
      bets
        .slice(0,3)
        .map(
          b=>({
            combination:b.combination,
            probability:b.probability,
            odds:b.odds,
            ev:b.ev
          })
        )
  };

  return {
    scored,
    marks
  };
}

/* =========================
   予想保存
========================= */

function saveCurrentPrediction(){
  if(!currentSnapshot){
    saveStatus.textContent =
      "先にレースを選択してください";

    return;
  }

  const unit =
    Number(
      $("betUnit").value
    );

  if(
    !Number.isFinite(unit) ||
    unit < 100
  ){
    saveStatus.textContent =
      "1点100円以上で入力してください";

    return;
  }

  const item =
    JSON.parse(
      JSON.stringify(
        currentSnapshot
      )
    );

  item.betUnit =
    unit;

  item.totalStake =
    unit *
    item.bets.length;

  item.result = null;

  const history =
    getHistory();

  history.push(item);

  saveHistory(history);

  saveStatus.textContent =
    `${item.venue} ${item.rno}Rを保存しました`;

  renderHistory();
}

/* =========================
   結果
========================= */

async function checkResult(item){
  const data =
    await getJSON(
      `/api/result?hd=${item.date}&jcd=${item.jcd}&rno=${item.rno}`
    );

  if(!data.finished){
    return {
      finished:false
    };
  }

  const hitBet =
    item.bets?.find(
      bet =>
        bet.combination ===
        data.combination
    );

  const hit =
    Boolean(hitBet);

  const unit =
    Number(
      item.betUnit || 0
    );

  const totalStake =
    Number(
      item.totalStake || 0
    );

  const returnAmount =
    hit && unit > 0
      ? Math.round(
          data.payout *
          (unit/100)
        )
      : 0;

  const profit =
    returnAmount-totalStake;

  const roi =
    totalStake > 0
      ? (
          returnAmount /
          totalStake
        )*100
      : 0;

  return {
    finished:true,

    checkedAt:
      new Date().toISOString(),

    combination:
      data.combination,

    winningLanes:
      Array.isArray(data.winningLanes)
        ? data.winningLanes.map(Number)
        : data.combination
            .split("-")
            .map(Number),

    payoutPer100:
      data.payout,

    method:
      data.method,

    hit,
    returnAmount,
    totalStake,
    profit,
    roi
  };
}

async function checkOne(id){
  const history =
    getHistory();

  const index =
    history.findIndex(
      item=>item.id===id
    );

  if(index < 0){
    return;
  }

  try{
    history[index].result =
      await checkResult(
        history[index]
      );

    saveHistory(history);
    renderHistory();
  }
  catch(error){
    alert(
      `結果取得失敗：${error.message}`
    );
  }
}

async function checkAllResults(){
  const history =
    getHistory();

  const button =
    $("checkAllResults");

  button.disabled = true;
  button.textContent =
    "結果を確認中...";

  for(
    let i=0;
    i<history.length;
    i++
  ){
    try{
      history[i].result =
        await checkResult(
          history[i]
        );
    }
    catch(error){
      console.log(error);
    }
  }

  saveHistory(history);
  renderHistory();

  button.disabled = false;
  button.textContent =
    "結果を一括チェック";
}

/* =========================
   項目別学習表示
========================= */

function renderWeights(){
  const learned =
    calculateLearnedWeights();

  if(!learned.active){
    weightStatus.textContent =
      `V6.5詳細データ ${learned.races}/10R`;

    weightsBox.innerHTML = `
      <div class="adjust">
        🧠 項目別学習はまだOFF
        <br>
        あと
        ${Math.max(0,10-learned.races)}R
        の結果データが必要です。
      </div>
    `;

    return;
  }

  weightStatus.textContent =
    `${learned.races}Rを使って項目別補正中`;

  weightsBox.innerHTML =
    Object.entries(
      learned.weights
    )
      .map(
        ([key,value])=>{

          const percent =
            (value-1)*100;

          return `
            <div class="learn-row">

              <div class="learn-head">
                <span>
                  ${COMPONENT_NAMES[key]}
                </span>

                <span>
                  ×${value.toFixed(3)}
                </span>
              </div>

              <div class="learn-detail">
                基準比：
                ${percent >= 0 ? "+" : ""}
                ${percent.toFixed(1)}%
              </div>

            </div>
          `;
        }
      )
      .join("");
}

/* =========================
   通常成績分析
========================= */

function aggregate(items,keyFn){
  const map = {};

  for(const item of items){
    const key =
      keyFn(item);

    if(!map[key]){
      map[key] = {
        key,
        races:0,
        hits:0,
        stake:0,
        returns:0
      };
    }

    const row =
      map[key];

    row.races++;

    if(item.result?.hit){
      row.hits++;
    }

    row.stake +=
      Number(
        item.result?.totalStake || 0
      );

    row.returns +=
      Number(
        item.result?.returnAmount || 0
      );
  }

  return Object.values(map)
    .map(
      row=>({
        ...row,

        hitRate:
          row.races
            ? row.hits/row.races*100
            : 0,

        profit:
          row.returns-row.stake,

        roi:
          row.stake
            ? row.returns/row.stake*100
            : 0
      })
    );
}

function renderLearningRows(
  title,
  rows
){
  if(!rows.length){
    return "";
  }

  rows.sort(
    (a,b)=>b.roi-a.roi
  );

  return `
    <div style="margin-bottom:15px">

      <div style="
        font-weight:900;
        margin-bottom:7px;
      ">
        ${title}
      </div>

      ${rows.map(row=>`
        <div class="learn-row">

          <div class="learn-head">
            <span>${row.key}</span>
            <span>
              回収率 ${row.roi.toFixed(1)}%
            </span>
          </div>

          <div class="learn-detail">
            ${row.races}R /
            的中 ${row.hits}R /
            的中率 ${row.hitRate.toFixed(1)}%
            <br>
            購入 ${yen(row.stake)}
            /
            払戻 ${yen(row.returns)}
            /
            収支
            ${row.profit >= 0 ? "+" : ""}
            ${yen(row.profit)}
          </div>

        </div>
      `).join("")}

    </div>
  `;
}

function renderLearning(){
  const finished =
    getHistory()
      .filter(
        item =>
          item.result?.finished
      );

  if(!finished.length){
    learningStatus.textContent =
      "結果照合済みデータがありません";

    learningBox.innerHTML = "";
    return;
  }

  learningStatus.textContent =
    `${finished.length}Rを集計`;

  const venueRows =
    aggregate(
      finished,
      item =>
        item.venue ||
        item.jcd
    );

  const raceRows =
    aggregate(
      finished,
      item =>
        `${item.rno}R`
    );

  const confidenceRows =
    aggregate(
      finished,
      item =>
        `勝負度 ${item.confidence || "不明"}`
    );

  learningBox.innerHTML =
    renderLearningRows(
      "会場別",
      venueRows
    ) +
    renderLearningRows(
      "レース番号別",
      raceRows
    ) +
    renderLearningRows(
      "勝負度別",
      confidenceRows
    );
}

/* =========================
   総合収支
========================= */

function renderSummary(){
  const finished =
    getHistory()
      .filter(
        item =>
          item.result?.finished
      );

  const stake =
    finished.reduce(
      (sum,item)=>
        sum +
        Number(
          item.result.totalStake || 0
        ),
      0
    );

  const returns =
    finished.reduce(
      (sum,item)=>
        sum +
        Number(
          item.result.returnAmount || 0
        ),
      0
    );

  const hits =
    finished.filter(
      item=>item.result.hit
    ).length;

  const profit =
    returns-stake;

  const roi =
    stake > 0
      ? returns/stake*100
      : 0;

  summaryBox.innerHTML = `
    <div class="summary-item">
      判定済み
      <strong>${finished.length}R</strong>
    </div>

    <div class="summary-item">
      的中
      <strong>${hits}R</strong>
    </div>

    <div class="summary-item">
      購入額
      <strong>${yen(stake)}</strong>
    </div>

    <div class="summary-item">
      払戻額
      <strong>${yen(returns)}</strong>
    </div>

    <div class="summary-item">
      収支
      <strong>
        ${profit >= 0 ? "+" : ""}
        ${yen(profit)}
      </strong>
    </div>

    <div class="summary-item">
      回収率
      <strong>${roi.toFixed(1)}%</strong>
    </div>
  `;
}

/* =========================
   履歴
========================= */

function renderHistory(){
  const history =
    getHistory();

  if(!history.length){
    historyBox.innerHTML =
      '<div class="status">保存履歴はまだありません</div>';

    renderSummary();
    renderLearning();
    renderWeights();
    return;
  }

  historyBox.innerHTML =
    history
      .slice()
      .reverse()
      .map(
        item=>{
          let resultHtml = `
            <div class="result">
              結果未確認
              <br><br>

              <button
                onclick="checkOne('${item.id}')"
              >
                このレースの結果を確認
              </button>
            </div>
          `;

          if(
            item.result?.finished === false
          ){
            resultHtml = `
              <div class="result">
                まだ結果が確定していません
                <br><br>

                <button
                  onclick="checkOne('${item.id}')"
                >
                  もう一度確認
                </button>
              </div>
            `;
          }

          if(item.result?.finished){
            const r =
              item.result;

            resultHtml = `
              <div class="result">

                <div class="hit">
                  ${
                    r.hit
                      ? "🎯 的中"
                      : "不的中"
                  }
                </div>

                結果：
                ${r.combination}
                <br>

                100円払戻：
                ${yen(r.payoutPer100)}
                <br>

                購入額：
                ${yen(r.totalStake)}
                <br>

                払戻額：
                ${yen(r.returnAmount)}
                <br>

                収支：
                ${r.profit >= 0 ? "+" : ""}
                ${yen(r.profit)}
                <br>

                回収率：
                ${r.roi.toFixed(1)}%

              </div>
            `;
          }

          return `
            <div class="history">

              <div class="history-title">
                ${item.date}
                ${item.venue || item.jcd}
                ${item.rno}R
              </div>

              <div class="history-meta">

                バージョン：
                ${item.version || "旧版"}
                <br>

                勝負度：
                ${item.confidence || "-"}
                <br>

                購入額：
                ${
                  item.totalStake
                    ? yen(item.totalStake)
                    : "旧データ"
                }
                <br>

                買い目：
                ${
                  item.bets
                    ?.map(
                      b =>
                        `${b.combination}（${Number(b.odds).toFixed(1)}倍 / EV ${Number(b.ev).toFixed(2)}）`
                    )
                    .join("、")
                  || "なし"
                }

              </div>

              ${resultHtml}

            </div>
          `;
        }
      )
      .join("");

  renderSummary();
  renderLearning();
  renderWeights();
}

/* =========================
   レース画面
========================= */

function clearRaceArea(){
  raceGrid.innerHTML = "";
  racersBox.innerHTML = "";
  predictionBox.innerHTML = "";

  currentSnapshot = null;

  raceTitle.textContent =
    "選手データ";

  racerStatus.textContent =
    "レースを選択してください";

  predictionStatus.textContent =
    "レースを選択すると予想します";
}

async function loadVenues(){
  venueStatus.textContent =
    "開催場を取得中...";

  venueSelect.innerHTML =
    '<option value="">開催場を選択</option>';

  clearRaceArea();

  try{
    const data =
      await getJSON(
        `/api/venues?hd=${apiDate()}`
      );

    for(const venue of data.venues){
      const option =
        document.createElement("option");

      option.value =
        venue.jcd;

      option.textContent =
        `${venue.name}（${venue.jcd}）`;

      venueSelect.appendChild(
        option
      );
    }

    venueStatus.textContent =
      `${data.venues.length}会場を取得しました`;
  }
  catch(error){
    venueStatus.textContent =
      `取得失敗：${error.message}`;
  }
}

async function loadRaces(){
  const jcd =
    venueSelect.value;

  if(!jcd){
    raceStatus.textContent =
      "開催場を選択してください";

    return;
  }

  raceStatus.textContent =
    "レースを取得中...";

  clearRaceArea();

  try{
    const data =
      await getJSON(
        `/api/venue?hd=${apiDate()}&jcd=${jcd}`
      );

    raceStatus.textContent =
      `${data.venue || ""} ${data.races.length}レースを取得しました`;

    for(const race of data.races){
      const button =
        document.createElement("button");

      button.className =
        "race-btn";

      button.textContent =
        `${race.rno}R`;

      button.addEventListener(
        "click",
        ()=>loadRace(
          race.rno,
          button,
          data.venue
        )
      );

      raceGrid.appendChild(
        button
      );
    }
  }
  catch(error){
    raceStatus.textContent =
      `取得失敗：${error.message}`;
  }
}

async function loadRace(
  rno,
  button,
  venueName
){
  const jcd =
    venueSelect.value;

  document
    .querySelectorAll(".race-btn")
    .forEach(
      btn =>
        btn.classList.remove("active")
    );

  button.classList.add("active");

  raceTitle.textContent =
    `${rno}R 選手データ`;

  racersBox.innerHTML = "";
  predictionBox.innerHTML = "";

  currentSnapshot = null;

  racerStatus.textContent =
    "選手データ取得中...";

  predictionStatus.textContent =
    "AI予想計算中...";

  try{
    const raceData =
      await getJSON(
        `/api/race?hd=${apiDate()}&jcd=${jcd}&rno=${rno}`
      );

    if(!raceData.racers?.length){
      racerStatus.textContent =
        "選手データを取得できませんでした";

      return;
    }

    let beforeData = {
      racers:[]
    };

    let oddsData = {
      odds:[],
      count:0
    };

    try{
      beforeData =
        await getJSON(
          `/api/before?hd=${apiDate()}&jcd=${jcd}&rno=${rno}`
        );
    }
    catch{}

    try{
      oddsData =
        await getJSON(
          `/api/odds?hd=${apiDate()}&jcd=${jcd}&rno=${rno}`
        );
    }
    catch{}

    const merged =
      mergeBefore(
        raceData.racers,
        beforeData
      );

    racerStatus.textContent =
      `${merged.length}艇を取得しました`;

    const prediction =
      renderPrediction(
        merged,
        oddsData,
        {
          date:apiDate(),
          jcd,
          venue:
            venueName ||
            raceData.venue ||
            jcd,
          rno
        }
      );

    renderRacers(
      merged,
      prediction.scored,
      prediction.marks
    );
  }
  catch(error){
    racerStatus.textContent =
      `取得失敗：${error.message}`;

    predictionStatus.textContent =
      "予想失敗";
  }
}

/* =========================
   起動
========================= */

dateInput.value =
  todayLocal();

$("loadVenues")
  .addEventListener(
    "click",
    loadVenues
  );

$("loadRaces")
  .addEventListener(
    "click",
    loadRaces
  );

$("savePrediction")
  .addEventListener(
    "click",
    saveCurrentPrediction
  );

$("checkAllResults")
  .addEventListener(
    "click",
    checkAllResults
  );

$("clearHistory")
  .addEventListener(
    "click",
    ()=>{
      if(
        confirm(
          "保存履歴をすべて削除しますか？"
        )
      ){
        localStorage.removeItem(
          "boat_ai_predictions"
        );

        renderHistory();

        saveStatus.textContent =
          "保存履歴を削除しました";
      }
    }
  );

renderHistory();
