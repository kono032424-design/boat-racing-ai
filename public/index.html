<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>競艇AI V6.1</title>

  <style>
    *{box-sizing:border-box}

    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:#0f172a;
      color:#f8fafc;
    }

    .wrap{
      max-width:760px;
      margin:auto;
      padding:18px 14px 40px;
    }

    h1{
      margin:0 0 6px;
      font-size:28px;
    }

    .sub{
      color:#94a3b8;
      font-size:13px;
      margin-bottom:16px;
    }

    .card{
      background:#1e293b;
      border-radius:16px;
      padding:14px;
      margin-bottom:14px;
    }

    label{
      display:block;
      color:#cbd5e1;
      font-size:13px;
      margin:5px 0;
    }

    input,select,button{
      width:100%;
      min-height:46px;
      border:0;
      border-radius:10px;
      font-size:16px;
    }

    input,select{
      background:#fff;
      color:#111827;
      padding:10px;
      margin-bottom:10px;
    }

    button{
      background:#2563eb;
      color:#fff;
      font-weight:800;
      padding:10px;
      margin-bottom:8px;
    }

    .secondary{
      background:#334155;
    }

    .status{
      color:#cbd5e1;
      font-size:14px;
      margin:6px 0 10px;
      min-height:20px;
    }

    .title{
      font-size:19px;
      font-weight:900;
      margin-bottom:10px;
    }

    .race-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:8px;
    }

    .race-btn{
      background:#334155;
      margin:0;
    }

    .race-btn.active{
      background:#2563eb;
    }

    .racer{
      background:#0f172a;
      border-radius:12px;
      padding:12px;
      margin-bottom:8px;
    }

    .topline{
      display:grid;
      grid-template-columns:44px 1fr auto;
      gap:10px;
      align-items:center;
    }

    .lane{
      width:40px;
      height:40px;
      border-radius:50%;
      background:#e2e8f0;
      color:#111827;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:900;
      font-size:18px;
    }

    .name{
      font-size:16px;
      font-weight:900;
    }

    .meta{
      font-size:12px;
      color:#94a3b8;
      margin-top:3px;
    }

    .score{
      font-size:18px;
      font-weight:900;
      text-align:right;
    }

    .stats{
      margin-top:9px;
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:6px;
      font-size:12px;
      color:#cbd5e1;
    }

    .stat{
      background:#1e293b;
      border-radius:8px;
      padding:7px;
    }

    .prediction{
      background:#0f172a;
      border-radius:12px;
      padding:13px;
    }

    .confidence{
      display:inline-block;
      font-size:20px;
      font-weight:900;
      padding:5px 12px;
      background:#334155;
      border-radius:999px;
    }

    .rank{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:10px 0;
      border-bottom:1px solid #334155;
    }

    .mark{
      font-size:22px;
      font-weight:900;
      margin-right:4px;
    }

    .ev-card{
      background:#1e293b;
      border-radius:12px;
      padding:12px;
      margin-top:9px;
    }

    .ev-top{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
    }

    .combo{
      font-size:20px;
      font-weight:900;
    }

    .decision{
      font-size:13px;
      font-weight:900;
      border-radius:999px;
      padding:5px 9px;
      background:#334155;
      white-space:nowrap;
    }

    .ev-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:6px;
      margin-top:9px;
    }

    .ev-item{
      background:#0f172a;
      border-radius:8px;
      padding:7px;
      text-align:center;
      font-size:12px;
    }

    .ev-item strong{
      display:block;
      font-size:15px;
      margin-top:3px;
    }

    .history{
      background:#0f172a;
      border-radius:12px;
      padding:12px;
      margin-bottom:9px;
    }

    .history-title{
      font-weight:900;
      margin-bottom:6px;
    }

    .history-meta{
      font-size:12px;
      color:#94a3b8;
      line-height:1.6;
    }

    .notice{
      color:#94a3b8;
      font-size:12px;
      line-height:1.55;
      margin-top:12px;
    }

    .version{
      text-align:center;
      color:#64748b;
      font-size:12px;
      margin-top:24px;
    }
  </style>
</head>

<body>

<div class="wrap">

  <h1>競艇AI V6.1</h1>

  <div class="sub">
    EV予想＋予想時点スナップショット保存
  </div>

  <div class="card">

    <label>日付</label>
    <input id="date" type="date">

    <button id="loadVenues">
      開催場を取得
    </button>

    <div id="venueStatus" class="status"></div>

    <label>開催場</label>

    <select id="venue">
      <option value="">開催場を選択</option>
    </select>

    <button id="loadRaces">
      選択した開催場のレースを取得
    </button>

    <div id="raceStatus" class="status"></div>

  </div>

  <div class="card">

    <div class="title">レース一覧</div>

    <div id="raceGrid" class="race-grid"></div>

  </div>

  <div class="card">

    <div id="raceTitle" class="title">
      選手データ
    </div>

    <div id="racerStatus" class="status">
      レースを選択してください
    </div>

    <div id="racers"></div>

  </div>

  <div class="card">

    <div class="title">
      AI予想・期待値
    </div>

    <div id="predictionStatus" class="status">
      レースを選択すると予想します
    </div>

    <div id="prediction"></div>

  </div>

  <div class="card">

    <div class="title">
      予想を保存
    </div>

    <label>購入予定額（円）</label>
    <input id="stake" type="number" min="0" step="100" value="1000">

    <button id="savePrediction">
      この予想を保存
    </button>

    <div id="saveStatus" class="status"></div>

  </div>

  <div class="card">

    <div class="title">
      保存履歴
    </div>

    <div id="history"></div>

    <button id="clearHistory" class="secondary">
      保存履歴を全削除
    </button>

  </div>

  <div class="version">
    Boat Racing AI V6.1
  </div>

</div>

<script>

const $ = id =>
  document.getElementById(id);

const dateInput = $("date");
const venueSelect = $("venue");
const raceGrid = $("raceGrid");
const racersBox = $("racers");
const predictionBox = $("prediction");
const historyBox = $("history");

const venueStatus = $("venueStatus");
const raceStatus = $("raceStatus");
const racerStatus = $("racerStatus");
const predictionStatus = $("predictionStatus");
const saveStatus = $("saveStatus");

const raceTitle = $("raceTitle");

let currentSnapshot = null;

function todayLocal(){

  const now = new Date();

  const y = now.getFullYear();

  const m =
    String(now.getMonth()+1)
      .padStart(2,"0");

  const d =
    String(now.getDate())
      .padStart(2,"0");

  return `${y}-${m}-${d}`;
}

function apiDate(){

  return dateInput.value
    .replaceAll("-","");
}

async function getJSON(url){

  const controller =
    new AbortController();

  const timer =
    setTimeout(
      ()=>controller.abort(),
      12000
    );

  try{

    const response =
      await fetch(
        url,
        {
          signal:controller.signal,
          cache:"no-store"
        }
      );

    const data =
      await response.json();

    if(
      !response.ok ||
      !data.ok
    ){
      throw new Error(
        data.error ||
        `HTTP ${response.status}`
      );
    }

    return data;

  }finally{

    clearTimeout(timer);
  }
}

function safeNumber(value){

  if(
    value === null ||
    value === undefined ||
    value === ""
  ){
    return null;
  }

  const n = Number(value);

  return Number.isFinite(n)
    ? n
    : null;
}

function fmt(value,digits=2){

  const n = safeNumber(value);

  return n === null
    ? "-"
    : n.toFixed(digits);
}

function mergeBefore(racers,beforeData){

  return racers.map(racer=>{

    const live =
      beforeData?.racers?.find(
        x =>
          Number(x.lane) ===
          Number(racer.lane)
      );

    return {
      ...racer,

      before:{
        course:
          live?.course ?? null,

        exhibitionTime:
          live?.exhibitionTime ?? null,

        exhibitionST:
          live?.exhibitionST ?? null,

        tilt:
          live?.tilt ?? null
      }
    };
  });
}

function aiScore(racer,allRacers){

  let score = 0;

  const laneScore = {
    1:25,
    2:19,
    3:16,
    4:13,
    5:8,
    6:5
  };

  score +=
    laneScore[racer.lane] || 0;

  const classScore = {
    A1:15,
    A2:12,
    B1:7,
    B2:3
  };

  score +=
    classScore[racer.class] || 0;

  const national =
    safeNumber(
      racer.national?.winRate
    );

  if(national !== null){
    score +=
      Math.min(
        18,
        national * 2.25
      );
  }

  const local =
    safeNumber(
      racer.local?.winRate
    );

  if(local !== null){
    score +=
      Math.min(
        10,
        local * 1.25
      );
  }

  const avgST =
    safeNumber(racer.avgST);

  if(avgST !== null){

    if(avgST <= 0.12){
      score += 8;
    }
    else if(avgST <= 0.14){
      score += 7;
    }
    else if(avgST <= 0.16){
      score += 5;
    }
    else if(avgST <= 0.18){
      score += 3;
    }
    else{
      score += 1;
    }
  }

  const motor =
    safeNumber(
      racer.motor?.secondRate
    );

  if(motor !== null){
    score +=
      Math.min(
        10,
        motor / 5
      );
  }

  const times =
    allRacers
      .map(
        r =>
          safeNumber(
            r.before?.exhibitionTime
          )
      )
      .filter(
        n => n !== null
      );

  const exhibition =
    safeNumber(
      racer.before?.exhibitionTime
    );

  if(
    exhibition !== null &&
    times.length
  ){

    const fastest =
      Math.min(...times);

    const diff =
      exhibition - fastest;

    if(diff <= 0.01){
      score += 8;
    }
    else if(diff <= 0.03){
      score += 7;
    }
    else if(diff <= 0.05){
      score += 5;
    }
    else if(diff <= 0.08){
      score += 3;
    }
    else{
      score += 1;
    }
  }

  const exhibitionST =
    safeNumber(
      racer.before?.exhibitionST
    );

  if(exhibitionST !== null){

    if(exhibitionST <= 0.05){
      score += 4;
    }
    else if(exhibitionST <= 0.10){
      score += 3;
    }
    else if(exhibitionST <= 0.15){
      score += 2;
    }
    else{
      score += 1;
    }
  }

  const course =
    safeNumber(
      racer.before?.course
    );

  if(course !== null){

    if(course === 1){
      score += 2;
    }
    else if(course <= 3){
      score += 1;
    }
  }

  return Math.round(
    score * 10
  ) / 10;
}

function strength(score){

  return Math.exp(
    score / 18
  );
}

function trifectaProbability(
  first,
  second,
  third,
  scored
){

  const racers =
    scored.map(r=>({
      lane:r.lane,
      strength:strength(r.score)
    }));

  const total1 =
    racers.reduce(
      (sum,r)=>
        sum+r.strength,
      0
    );

  const r1 =
    racers.find(
      r=>r.lane===first
    );

  const r2 =
    racers.find(
      r=>r.lane===second
    );

  const r3 =
    racers.find(
      r=>r.lane===third
    );

  if(
    !r1 ||
    !r2 ||
    !r3
  ){
    return 0;
  }

  const p1 =
    r1.strength / total1;

  const total2 =
    total1 - r1.strength;

  const p2 =
    r2.strength / total2;

  const total3 =
    total2 - r2.strength;

  const p3 =
    r3.strength / total3;

  return p1*p2*p3;
}

function getMarks(sorted){

  const result = {};

  if(sorted[0]){
    result[sorted[0].lane]="◎";
  }

  if(sorted[1]){
    result[sorted[1].lane]="○";
  }

  if(sorted[2]){
    result[sorted[2].lane]="▲";
  }

  return result;
}

function getConfidence(sorted){

  if(sorted.length < 3){
    return "B";
  }

  const top =
    sorted[0].score;

  const gap2 =
    sorted[0].score -
    sorted[1].score;

  const gap3 =
    sorted[0].score -
    sorted[2].score;

  if(
    top >= 82 &&
    gap2 >= 8 &&
    gap3 >= 14
  ){
    return "S";
  }

  if(
    top >= 68 &&
    gap2 >= 4
  ){
    return "A";
  }

  return "B";
}

function makeCandidates(scored){

  const top =
    scored
      .slice(0,4)
      .map(r=>r.lane);

  const list = [];

  for(const a of top){
    for(const b of top){

      if(a===b) continue;

      for(const c of top){

        if(
          c===a ||
          c===b
        ){
          continue;
        }

        list.push(
          `${a}-${b}-${c}`
        );
      }
    }
  }

  return list;
}

function oddsMap(oddsData){

  const map = {};

  for(
    const item of
    oddsData?.odds || []
  ){
    map[item.combination] =
      Number(item.odds);
  }

  return map;
}

function evaluateBets(
  scored,
  oddsData
){

  const map =
    oddsMap(oddsData);

  const candidates =
    makeCandidates(scored);

  const results = [];

  for(
    const combo of candidates
  ){

    const parts =
      combo
        .split("-")
        .map(Number);

    const probability =
      trifectaProbability(
        parts[0],
        parts[1],
        parts[2],
        scored
      );

    const odds =
      safeNumber(
        map[combo]
      );

    if(
      odds === null
    ){
      continue;
    }

    const ev =
      probability *
      odds;

    let decision =
      "見送り";

    if(ev >= 1.20){
      decision =
        "買い候補";
    }
    else if(ev >= 1.05){
      decision =
        "様子見";
    }

    results.push({
      combo,
      probability,
      odds,
      ev,
      decision
    });
  }

  return results
    .sort(
      (a,b)=>
        b.ev-a.ev
    )
    .slice(0,6);
}

function renderPrediction(
  racers,
  weather,
  oddsData,
  context
){

  const scored =
    racers
      .map(racer=>({
        ...racer,
        score:
          aiScore(
            racer,
            racers
          )
      }))
      .sort(
        (a,b)=>
          b.score-a.score
      );

  const marks =
    getMarks(scored);

  const confidence =
    getConfidence(scored);

  const bets =
    evaluateBets(
      scored,
      oddsData
    );

  predictionStatus.textContent =
    `勝負度 ${confidence} / オッズ ${oddsData?.count || 0}通り取得`;

  let betsHtml = "";

  if(bets.length){

    betsHtml =
      bets.map(bet=>{

        return `
          <div class="ev-card">

            <div class="ev-top">

              <div class="combo">
                ${bet.combo}
              </div>

              <div class="decision">
                ${bet.decision}
              </div>

            </div>

            <div class="ev-grid">

              <div class="ev-item">
                推定確率
                <strong>
                  ${(bet.probability*100).toFixed(1)}%
                </strong>
              </div>

              <div class="ev-item">
                オッズ
                <strong>
                  ${bet.odds.toFixed(1)}
                </strong>
              </div>

              <div class="ev-item">
                参考EV
                <strong>
                  ${bet.ev.toFixed(2)}
                </strong>
              </div>

            </div>

          </div>
        `;
      }).join("");

  }else{

    betsHtml = `
      <div class="notice">
        オッズ未取得のためEV評価できません。
      </div>
    `;
  }

  predictionBox.innerHTML = `
    <div class="prediction">

      <div>
        勝負度：
        <span class="confidence">
          ${confidence}
        </span>
      </div>

      ${scored.slice(0,3).map(r=>`
        <div class="rank">

          <div>
            <span class="mark">
              ${marks[r.lane] || ""}
            </span>

            ${r.lane}号艇
            ${r.name}
          </div>

          <strong>
            ${r.score}点
          </strong>

        </div>
      `).join("")}

      <div style="
        margin-top:14px;
        font-weight:900;
      ">
        EVランキング
      </div>

      ${betsHtml}

      <div class="notice">
        保存すると、その時点のオッズ・EV・AI点数を固定保存します。
        あとからオッズが変化しても保存内容は書き換わりません。
      </div>

    </div>
  `;

  currentSnapshot = {
    version:"6.1",
    createdAt:
      new Date().toISOString(),

    date:
      context.date,

    jcd:
      context.jcd,

    venue:
      context.venue,

    rno:
      context.rno,

    confidence,

    scored:
      scored.map(r=>({
        lane:r.lane,
        name:r.name,
        class:r.class,
        score:r.score
      })),

    bets:
      bets.map(b=>({
        combination:b.combo,
        probability:b.probability,
        odds:b.odds,
        ev:b.ev,
        decision:b.decision
      }))
  };

  return {
    scored,
    marks
  };
}

function renderRacers(
  racers,
  scored,
  marks
){

  racersBox.innerHTML = "";

  for(
    const racer of racers
  ){

    const scoreData =
      scored.find(
        r =>
          r.lane ===
          racer.lane
      );

    const row =
      document.createElement("div");

    row.className =
      "racer";

    row.innerHTML = `
      <div class="topline">

        <div class="lane">
          ${racer.lane}
        </div>

        <div>

          <div class="name">
            ${marks[racer.lane] || ""}
            ${racer.name}
          </div>

          <div class="meta">
            ${racer.class}
            /
            登録番号 ${racer.registration}
          </div>

        </div>

        <div class="score">
          ${scoreData?.score ?? "-"}点
        </div>

      </div>

      <div class="stats">

        <div class="stat">
          全国勝率：
          ${fmt(
            racer.national?.winRate
          )}
        </div>

        <div class="stat">
          当地勝率：
          ${fmt(
            racer.local?.winRate
          )}
        </div>

        <div class="stat">
          平均ST：
          ${fmt(
            racer.avgST
          )}
        </div>

        <div class="stat">
          モーター2連率：
          ${fmt(
            racer.motor?.secondRate
          )}%
        </div>

        <div class="stat">
          展示タイム：
          ${fmt(
            racer.before?.exhibitionTime
          )}
        </div>

        <div class="stat">
          展示ST：
          ${fmt(
            racer.before?.exhibitionST
          )}
        </div>

      </div>
    `;

    racersBox.appendChild(
      row
    );
  }
}

function getHistory(){

  try{
    return JSON.parse(
      localStorage.getItem(
        "boat_ai_predictions"
      ) || "[]"
    );
  }catch{
    return [];
  }
}

function saveHistory(history){

  localStorage.setItem(
    "boat_ai_predictions",
    JSON.stringify(history)
  );
}

function renderHistory(){

  const history =
    getHistory();

  if(!history.length){

    historyBox.innerHTML =
      '<div class="status">保存履歴はまだありません</div>';

    return;
  }

  historyBox.innerHTML =
    history
      .slice()
      .reverse()
      .map(item=>`

        <div class="history">

          <div class="history-title">
            ${item.date}
            ${item.venue || item.jcd}
            ${item.rno}R
          </div>

          <div class="history-meta">

            勝負度：
            ${item.confidence}
            <br>

            購入予定額：
            ${Number(item.stake || 0).toLocaleString()}円
            <br>

            保存：
            ${new Date(item.createdAt).toLocaleString("ja-JP")}
            <br>

            買い目：
            ${
              item.bets
                ?.slice(0,3)
                .map(
                  b =>
                    `${b.combination}（${b.odds}倍 / EV ${Number(b.ev).toFixed(2)}）`
                )
                .join("、")
                ||
                "なし"
            }

          </div>

        </div>

      `)
      .join("");
}

function saveCurrentPrediction(){

  if(!currentSnapshot){

    saveStatus.textContent =
      "先にレースを選択して予想を表示してください";

    return;
  }

  const stake =
    Number(
      $("stake").value
    );

  if(
    !Number.isFinite(stake) ||
    stake < 0
  ){

    saveStatus.textContent =
      "購入予定額を確認してください";

    return;
  }

  const snapshot =
    JSON.parse(
      JSON.stringify(
        currentSnapshot
      )
    );

  snapshot.stake =
    stake;

  const history =
    getHistory();

  history.push(
    snapshot
  );

  saveHistory(
    history
  );

  saveStatus.textContent =
    `${snapshot.venue} ${snapshot.rno}Rの予想を保存しました`;

  renderHistory();
}

function clearRaceArea(){

  raceGrid.innerHTML = "";
  racersBox.innerHTML = "";
  predictionBox.innerHTML = "";

  currentSnapshot = null;

  raceTitle.textContent =
    "選手データ";

  racerStatus.textContent =
    "レースを選択してください";

  predictionStatus.textContent =
    "レースを選択すると予想します";

  saveStatus.textContent = "";
}

async function loadVenues(){

  venueStatus.textContent =
    "開催場を取得中...";

  venueSelect.innerHTML =
    '<option value="">開催場を選択</option>';

  clearRaceArea();

  try{

    const data =
      await getJSON(
        `/api/venues?hd=${apiDate()}`
      );

    for(
      const venue of data.venues
    ){

      const option =
        document.createElement("option");

      option.value =
        venue.jcd;

      option.textContent =
        `${venue.name}（${venue.jcd}）`;

      venueSelect.appendChild(
        option
      );
    }

    venueStatus.textContent =
      `${data.venues.length}会場を取得しました`;

  }catch(error){

    venueStatus.textContent =
      `取得失敗：${error.message}`;
  }
}

async function loadRaces(){

  const jcd =
    venueSelect.value;

  if(!jcd){

    raceStatus.textContent =
      "開催場を選択してください";

    return;
  }

  raceStatus.textContent =
    "レースを取得中...";

  clearRaceArea();

  try{

    const data =
      await getJSON(
        `/api/venue?hd=${apiDate()}&jcd=${jcd}`
      );

    raceStatus.textContent =
      `${data.venue || ""} ${data.races.length}レースを取得しました`;

    for(
      const race of data.races
    ){

      const button =
        document.createElement("button");

      button.className =
        "race-btn";

      button.textContent =
        `${race.rno}R`;

      button.addEventListener(
        "click",
        ()=>loadRace(
          race.rno,
          button,
          data.venue
        )
      );

      raceGrid.appendChild(
        button
      );
    }

  }catch(error){

    raceStatus.textContent =
      `取得失敗：${error.message}`;
  }
}

async function loadRace(
  rno,
  button,
  venueName
){

  const jcd =
    venueSelect.value;

  document
    .querySelectorAll(".race-btn")
    .forEach(
      btn=>
        btn.classList.remove(
          "active"
        )
    );

  button.classList.add("active");

  raceTitle.textContent =
    `${rno}R 選手データ`;

  racersBox.innerHTML = "";
  predictionBox.innerHTML = "";
  currentSnapshot = null;

  racerStatus.textContent =
    "選手データを取得中...";

  predictionStatus.textContent =
    "AI予想・オッズを計算中...";

  try{

    const raceData =
      await getJSON(
        `/api/race?hd=${apiDate()}&jcd=${jcd}&rno=${rno}`
      );

    if(
      !raceData.racers ||
      !raceData.racers.length
    ){

      racerStatus.textContent =
        "選手データを取得できませんでした";

      predictionStatus.textContent =
        "予想できません";

      return;
    }

    let beforeData = {
      racers:[],
      weather:null
    };

    let oddsData = {
      odds:[],
      count:0
    };

    try{

      beforeData =
        await getJSON(
          `/api/before?hd=${apiDate()}&jcd=${jcd}&rno=${rno}`
        );

    }catch{}

    try{

      oddsData =
        await getJSON(
          `/api/odds?hd=${apiDate()}&jcd=${jcd}&rno=${rno}`
        );

    }catch{}

    const merged =
      mergeBefore(
        raceData.racers,
        beforeData
      );

    racerStatus.textContent =
      `${merged.length}艇を取得しました`;

    const prediction =
      renderPrediction(
        merged,
        beforeData.weather,
        oddsData,
        {
          date:
            apiDate(),

          jcd,

          venue:
            venueName ||
            raceData.venue ||
            jcd,

          rno
        }
      );

    renderRacers(
      merged,
      prediction.scored,
      prediction.marks
    );

  }catch(error){

    racerStatus.textContent =
      `取得失敗：${error.message}`;

    predictionStatus.textContent =
      "予想失敗";
  }
}

dateInput.value =
  todayLocal();

$("loadVenues")
  .addEventListener(
    "click",
    loadVenues
  );

$("loadRaces")
  .addEventListener(
    "click",
    loadRaces
  );

$("savePrediction")
  .addEventListener(
    "click",
    saveCurrentPrediction
  );

$("clearHistory")
  .addEventListener(
    "click",
    ()=>{

      if(
        confirm(
          "保存履歴をすべて削除しますか？"
        )
      ){

        localStorage.removeItem(
          "boat_ai_predictions"
        );

        renderHistory();

        saveStatus.textContent =
          "保存履歴を削除しました";
      }
    }
  );

renderHistory();

</script>

</body>
</html>
