<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>競艇AI V5.3</title>

<style>
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#07101d;
  color:#eef4ff
}
main{
  max-width:760px;
  margin:auto;
  padding:22px 16px 80px
}
.card{
  background:#101b2c;
  border:1px solid #263650;
  border-radius:18px;
  padding:18px;
  margin:14px 0
}
h1{font-size:28px;margin:8px 0}
.muted{color:#9fb0c8}
button,select,input{
  font-size:16px;
  border-radius:12px;
  border:1px solid #40516b;
  padding:12px;
  background:#15243a;
  color:#fff
}
button{
  font-weight:700;
  width:100%;
  margin:8px 0
}
.ok{color:#8ee6a8}
.err{color:#ff9b9b}
.row{display:flex;gap:8px}
.row>*{flex:1}
.race{
  padding:10px;
  border-bottom:1px solid #273650
}
.badge{
  display:inline-block;
  padding:4px 8px;
  border-radius:999px;
  background:#223653;
  font-size:12px
}
</style>
</head>

<body>
<main>

<h1>🚤 競艇AI V5.3</h1>
<p class="muted">Cloudflare Workers + GitHub版</p>

<div class="card">

<div class="row">
<input id="date" type="date">
<button id="venues">開催場を取得</button>
</div>

<p id="status" class="muted">準備OK</p>

<select id="venue" style="width:100%">
<option value="">開催場を選択</option>
</select>

<button id="load">
選択した開催場のレースを取得
</button>

</div>

<div class="card">
<b>取得結果</b>
<div id="out" class="muted">
まだ取得していません。
</div>
</div>

<div class="card">
<span class="badge">V5.3</span>
<p class="muted">
開催場取得 → レース取得までを安定化したバージョンです。
</p>
</div>

<script>

const $ = s => document.querySelector(s);

const jst =
new Date(Date.now()+9*3600000)
.toISOString()
.slice(0,10);

$("#date").value = jst;

async function getJSON(url){

 const c = new AbortController();

 const t =
 setTimeout(()=>c.abort(),12000);

 try{

  const r =
  await fetch(url,{signal:c.signal});

  const x =
  await r.json();

  if(!r.ok || !x.ok)
  throw new Error(
   x.error || `HTTP ${r.status}`
  );

  return x;

 } finally {

  clearTimeout(t);

 }

}

$("#venues").onclick =
async()=>{

 $("#status").textContent =
 "開催場を取得中…";

 $("#status").className =
 "muted";

 try{

  const hd =
  $("#date").value.replaceAll("-","");

  const x =
  await getJSON(
   `/api/venues?hd=${hd}`
  );

  $("#venue").innerHTML =
  '<option value="">開催場を選択</option>'+
  x.venues.map(
   v =>
   `<option value="${v.jcd}">
   ${v.name}
   </option>`
  ).join("");

  $("#status").textContent =
  `${x.venues.length}会場を取得しました`;

  $("#status").className =
  "ok";

 }catch(e){

  $("#status").textContent =
  "取得失敗："+e.message;

  $("#status").className =
  "err";

 }

};

$("#load").onclick =
async()=>{

 const jcd =
 $("#venue").value;

 if(!jcd){

  $("#out").textContent =
  "開催場を選んでください。";

  return;

 }

 $("#out").textContent =
 "レースを取得中…";

 try{

  const hd =
  $("#date").value.replaceAll("-","");

  const x =
  await getJSON(
   `/api/venue?hd=${hd}&jcd=${jcd}`
  );

  $("#out").innerHTML =
  x.races.length

  ? x.races.map(
    r =>
    `<div class="race">
    <b>${r.rno}R</b>
    　${r.status}
    </div>`
   ).join("")

  : "レースが見つかりませんでした。";

 }catch(e){

  $("#out").textContent =
  "取得失敗："+e.message;

 }

};

</script>

</main>
</body>
</html>
