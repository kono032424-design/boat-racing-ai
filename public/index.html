<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>競艇AI V5.7</title>

  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:#0f172a;
      color:#f8fafc;
    }
    .wrap{
      max-width:760px;
      margin:auto;
      padding:18px 14px 40px;
    }
    h1{margin:0 0 6px;font-size:28px}
    .sub{
      color:#94a3b8;
      font-size:13px;
      margin-bottom:16px;
    }
    .card{
      background:#1e293b;
      border-radius:16px;
      padding:14px;
      margin-bottom:14px;
    }
    label{
      display:block;
      color:#cbd5e1;
      font-size:13px;
      margin:5px 0;
    }
    input,select,button{
      width:100%;
      min-height:46px;
      border:0;
      border-radius:10px;
      font-size:16px;
    }
    input,select{
      background:white;
      color:#111827;
      padding:10px;
      margin-bottom:10px;
    }
    button{
      background:#2563eb;
      color:white;
      font-weight:800;
      padding:10px;
      margin-bottom:8px;
    }
    .status{
      color:#cbd5e1;
      font-size:14px;
      margin:6px 0 10px;
      min-height:20px;
    }
    .title{
      font-size:19px;
      font-weight:900;
      margin-bottom:10px;
    }
    .race-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:8px;
    }
    .race-btn{
      background:#334155;
      margin:0;
    }
    .race-btn.active{
      background:#2563eb;
    }
    .racer{
      background:#0f172a;
      border-radius:12px;
      padding:12px;
      margin-bottom:8px;
    }
    .topline{
      display:grid;
      grid-template-columns:45px 1fr auto;
      gap:10px;
      align-items:center;
    }
    .lane{
      width:40px;
      height:40px;
      border-radius:50%;
      background:#e2e8f0;
      color:#111827;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:900;
      font-size:18px;
    }
    .name{
      font-size:16px;
      font-weight:900;
    }
    .meta{
      font-size:12px;
      color:#94a3b8;
      margin-top:3px;
    }
    .score{
      font-size:19px;
      font-weight:900;
    }
    .stats{
      margin-top:9px;
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:6px;
      font-size:12px;
      color:#cbd5e1;
    }
    .stat{
      background:#1e293b;
      border-radius:8px;
      padding:7px;
    }
    .prediction{
      background:#0f172a;
      border-radius:12px;
      padding:13px;
    }
    .confidence{
      font-size:20px;
      font-weight:900;
      display:inline-block;
      padding:5px 12px;
      background:#334155;
      border-radius:999px;
    }
    .rank{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:10px 0;
      border-bottom:1px solid #334155;
    }
    .rank:last-child{border-bottom:0}
    .mark{
      font-size:22px;
      font-weight:900;
      margin-right:4px;
    }
    .bets{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:8px;
      margin-top:10px;
    }
    .bet{
      background:#1e293b;
      text-align:center;
      padding:10px 5px;
      border-radius:9px;
      font-weight:900;
      font-size:17px;
    }
    .notice{
      color:#94a3b8;
      font-size:12px;
      line-height:1.5;
      margin-top:12px;
    }
    .version{
      text-align:center;
      color:#64748b;
      font-size:12px;
      margin-top:24px;
    }
  </style>
</head>

<body>
<div class="wrap">

  <h1>競艇AI V5.7</h1>

  <div class="sub">
    全国勝率・当地勝率・平均ST・モーター成績反映
  </div>

  <div class="card">

    <label>日付</label>
    <input id="date" type="date">

    <button id="loadVenues">
      開催場を取得
    </button>

    <div id="venueStatus" class="status"></div>

    <label>開催場</label>
    <select id="venue">
      <option value="">開催場を選択</option>
    </select>

    <button id="loadRaces">
      選択した開催場のレースを取得
    </button>

    <div id="raceStatus" class="status"></div>

  </div>

  <div class="card">
    <div class="title">レース一覧</div>
    <div id="raceGrid" class="race-grid"></div>
  </div>

  <div class="card">

    <div id="raceTitle" class="title">
      選手データ
    </div>

    <div id="racerStatus" class="status">
      レースを選択してください
    </div>

    <div id="racers"></div>

  </div>

  <div class="card">

    <div class="title">
      AI予想
    </div>

    <div id="predictionStatus" class="status">
      レースを選択すると予想します
    </div>

    <div id="prediction"></div>

  </div>

  <div class="version">
    Boat Racing AI V5.7
  </div>

</div>

<script>

const $ = id =>
  document.getElementById(id);

const dateInput = $("date");
const venueSelect = $("venue");
const raceGrid = $("raceGrid");
const racersBox = $("racers");
const predictionBox = $("prediction");

const venueStatus = $("venueStatus");
const raceStatus = $("raceStatus");
const racerStatus = $("racerStatus");
const predictionStatus =
  $("predictionStatus");

const raceTitle = $("raceTitle");

function todayLocal(){

  const now = new Date();

  const y =
    now.getFullYear();

  const m =
    String(
      now.getMonth() + 1
    ).padStart(2,"0");

  const d =
    String(
      now.getDate()
    ).padStart(2,"0");

  return `${y}-${m}-${d}`;
}

function apiDate(){
  return dateInput.value
    .replaceAll("-","");
}

async function getJSON(url){

  const controller =
    new AbortController();

  const timer =
    setTimeout(
      ()=>controller.abort(),
      12000
    );

  try{

    const response =
      await fetch(
        url,
        {
          signal:
            controller.signal,
          cache:"no-store"
        }
      );

    const data =
      await response.json();

    if(
      !response.ok ||
      !data.ok
    ){
      throw new Error(
        data.error ||
        `HTTP ${response.status}`
      );
    }

    return data;

  }finally{
    clearTimeout(timer);
  }
}

function safeNumber(value){
  const n = Number(value);
  return Number.isFinite(n)
    ? n
    : null;
}

/*
 AIスコア

 艇番        最大30
 級別        最大20
 全国勝率    最大20
 当地勝率    最大10
 平均ST      最大10
 モーター    最大10

 合計100点前後
*/

function aiScore(racer){

  let score = 0;

  const laneScore = {
    1:30,
    2:22,
    3:18,
    4:14,
    5:9,
    6:6
  };

  score +=
    laneScore[racer.lane] || 0;

  const classScore = {
    A1:20,
    A2:15,
    B1:9,
    B2:4
  };

  score +=
    classScore[racer.class] || 0;

  const national =
    safeNumber(
      racer.national?.winRate
    );

  if(national !== null){
    score +=
      Math.min(
        20,
        national * 2.5
      );
  }

  const local =
    safeNumber(
      racer.local?.winRate
    );

  if(local !== null){
    score +=
      Math.min(
        10,
        local * 1.25
      );
  }

  const st =
    safeNumber(
      racer.avgST
    );

  if(st !== null){

    if(st <= 0.12){
      score += 10;
    }
    else if(st <= 0.14){
      score += 8;
    }
    else if(st <= 0.16){
      score += 6;
    }
    else if(st <= 0.18){
      score += 4;
    }
    else{
      score += 2;
    }
  }

  const motor =
    safeNumber(
      racer.motor?.secondRate
    );

  if(motor !== null){
    score +=
      Math.min(
        10,
        motor / 5
      );
  }

  return Math.round(
    score * 10
  ) / 10;
}

function getConfidence(sorted){

  if(sorted.length < 3){
    return "B";
  }

  const top =
    sorted[0].score;

  const gap2 =
    sorted[0].score -
    sorted[1].score;

  const gap3 =
    sorted[0].score -
    sorted[2].score;

  if(
    top >= 78 &&
    gap2 >= 8 &&
    gap3 >= 14
  ){
    return "S";
  }

  if(
    top >= 65 &&
    gap2 >= 4
  ){
    return "A";
  }

  return "B";
}

function getMarks(sorted){

  const result = {};

  if(sorted[0]){
    result[sorted[0].lane] = "◎";
  }

  if(sorted[1]){
    result[sorted[1].lane] = "○";
  }

  if(sorted[2]){
    result[sorted[2].lane] = "▲";
  }

  return result;
}

function makeBets(sorted){

  if(sorted.length < 3){
    return [];
  }

  const a =
    sorted[0].lane;

  const b =
    sorted[1].lane;

  const c =
    sorted[2].lane;

  return [
    `${a}-${b}-${c}`,
    `${a}-${c}-${b}`,
    `${b}-${a}-${c}`
  ];
}

function fmt(value,digits=2){

  if(
    value === null ||
    value === undefined
  ){
    return "-";
  }

  const n =
    Number(value);

  if(
    !Number.isFinite(n)
  ){
    return "-";
  }

  return n.toFixed(digits);
}

function renderPrediction(racers){

  const scored =
    racers
      .map(racer=>({
        ...racer,
        score:
          aiScore(racer)
      }))
      .sort(
        (a,b)=>
          b.score-a.score
      );

  const marks =
    getMarks(scored);

  const confidence =
    getConfidence(scored);

  const bets =
    makeBets(scored);

  predictionStatus.textContent =
    `勝負度 ${confidence}`;

  predictionBox.innerHTML = `
    <div class="prediction">

      <div>
        勝負度：
        <span class="confidence">
          ${confidence}
        </span>
      </div>

      ${scored.slice(0,3).map(r=>`
        <div class="rank">

          <div>
            <span class="mark">
              ${marks[r.lane] || ""}
            </span>

            ${r.lane}号艇
            ${r.name}
          </div>

          <strong>
            ${r.score}点
          </strong>

        </div>
      `).join("")}

      <div style="
        margin-top:12px;
        font-weight:900;
      ">
        3連単候補
      </div>

      <div class="bets">

        ${bets.map(b=>`
          <div class="bet">
            ${b}
          </div>
        `).join("")}

      </div>

      <div class="notice">
        V5.7では艇番・級別・全国勝率・当地勝率・
        平均ST・モーター2連率をスコア化しています。
        展示タイム・直前気配・オッズはまだ未反映です。
      </div>

    </div>
  `;

  return {
    scored,
    marks
  };
}

function renderRacers(
  racers,
  scored,
  marks
){

  racersBox.innerHTML = "";

  for(
    const racer of racers
  ){

    const scoreData =
      scored.find(
        r=>
          r.lane ===
          racer.lane
      );

    const row =
      document.createElement(
        "div"
      );

    row.className =
      "racer";

    row.innerHTML = `
      <div class="topline">

        <div class="lane">
          ${racer.lane}
        </div>

        <div>

          <div class="name">
            ${marks[racer.lane] || ""}
            ${racer.name}
          </div>

          <div class="meta">
            ${racer.class}
            /
            登録番号
            ${racer.registration}
          </div>

        </div>

        <div class="score">
          ${scoreData?.score ?? "-"}点
        </div>

      </div>

      <div class="stats">

        <div class="stat">
          全国勝率：
          ${fmt(
            racer.national?.winRate
          )}
        </div>

        <div class="stat">
          当地勝率：
          ${fmt(
            racer.local?.winRate
          )}
        </div>

        <div class="stat">
          平均ST：
          ${fmt(
            racer.avgST
          )}
        </div>

        <div class="stat">
          モーター2連率：
          ${fmt(
            racer.motor?.secondRate
          )}%
        </div>

        <div class="stat">
          全国2連率：
          ${fmt(
            racer.national?.secondRate
          )}%
        </div>

        <div class="stat">
          全国3連率：
          ${fmt(
            racer.national?.thirdRate
          )}%
        </div>

      </div>
    `;

    racersBox.appendChild(
      row
    );
  }
}

function clearRaceArea(){

  raceGrid.innerHTML = "";
  racersBox.innerHTML = "";
  predictionBox.innerHTML = "";

  raceTitle.textContent =
    "選手データ";

  racerStatus.textContent =
    "レースを選択してください";

  predictionStatus.textContent =
    "レースを選択すると予想します";
}

async function loadVenues(){

  venueStatus.textContent =
    "開催場を取得中...";

  venueSelect.innerHTML =
    '<option value="">開催場を選択</option>';

  clearRaceArea();

  try{

    const data =
      await getJSON(
        `/api/venues?hd=${apiDate()}`
      );

    for(
      const venue of
      data.venues
    ){

      const option =
        document.createElement(
          "option"
        );

      option.value =
        venue.jcd;

      option.textContent =
        `${venue.name}（${venue.jcd}）`;

      venueSelect.appendChild(
        option
      );
    }

    venueStatus.textContent =
      `${data.venues.length}会場を取得しました`;

  }catch(error){

    venueStatus.textContent =
      `取得失敗：${error.message}`;
  }
}

async function loadRaces(){

  const jcd =
    venueSelect.value;

  if(!jcd){

    raceStatus.textContent =
      "開催場を選択してください";

    return;
  }

  raceStatus.textContent =
    "レースを取得中...";

  clearRaceArea();

  try{

    const data =
      await getJSON(
        `/api/venue?hd=${apiDate()}&jcd=${jcd}`
      );

    raceStatus.textContent =
      `${data.venue || ""} ${data.races.length}レースを取得しました`;

    for(
      const race of
      data.races
    ){

      const button =
        document.createElement(
          "button"
        );

      button.className =
        "race-btn";

      button.textContent =
        `${race.rno}R`;

      button.addEventListener(
        "click",
        ()=>loadRace(
          race.rno,
          button
        )
      );

      raceGrid.appendChild(
        button
      );
    }

  }catch(error){

    raceStatus.textContent =
      `取得失敗：${error.message}`;
  }
}

async function loadRace(
  rno,
  button
){

  const jcd =
    venueSelect.value;

  document
    .querySelectorAll(
      ".race-btn"
    )
    .forEach(
      btn=>
        btn.classList.remove(
          "active"
        )
    );

  button.classList.add(
    "active"
  );

  raceTitle.textContent =
    `${rno}R 選手データ`;

  racersBox.innerHTML = "";
  predictionBox.innerHTML = "";

  racerStatus.textContent =
    "選手データを取得中...";

  predictionStatus.textContent =
    "AI予想を計算中...";

  try{

    const data =
      await getJSON(
        `/api/race?hd=${apiDate()}&jcd=${jcd}&rno=${rno}`
      );

    if(
      !data.racers ||
      !data.racers.length
    ){

      racerStatus.textContent =
        "選手データを取得できませんでした";

      predictionStatus.textContent =
        "予想できません";

      return;
    }

    racerStatus.textContent =
      `${data.racers.length}艇を取得しました`;

    const prediction =
      renderPrediction(
        data.racers
      );

    renderRacers(
      data.racers,
      prediction.scored,
      prediction.marks
    );

  }catch(error){

    racerStatus.textContent =
      `取得失敗：${error.message}`;

    predictionStatus.textContent =
      "予想失敗";
  }
}

dateInput.value =
  todayLocal();

$("loadVenues")
  .addEventListener(
    "click",
    loadVenues
  );

$("loadRaces")
  .addEventListener(
    "click",
    loadRaces
  );

</script>
</body>
</html>
