<script>

const $ = id =>
  document.getElementById(id);

const dateInput = $("date");
const venueSelect = $("venue");
const raceGrid = $("raceGrid");
const racersBox = $("racers");
const predictionBox = $("prediction");
const historyBox = $("history");
const comparisonBox = $("comparison");
const summaryBox = $("summary");
const weightsBox = $("weights");

const venueStatus = $("venueStatus");
const raceStatus = $("raceStatus");
const racerStatus = $("racerStatus");
const predictionStatus = $("predictionStatus");
const saveStatus = $("saveStatus");
const autoSaveStatus = $("autoSaveStatus");
const autoCheckStatus = $("autoCheckStatus");
const weightStatus = $("weightStatus");
const raceTitle = $("raceTitle");

let currentSnapshot = null;
let currentVenueRaces = [];

/* =========================
   基本
========================= */

function todayLocal(){

  const now = new Date();

  const y = now.getFullYear();

  const m =
    String(
      now.getMonth()+1
    ).padStart(2,"0");

  const d =
    String(
      now.getDate()
    ).padStart(2,"0");

  return `${y}-${m}-${d}`;
}

function todayApi(){

  return todayLocal()
    .replaceAll("-","");
}

function apiDate(){

  return dateInput.value
    .replaceAll("-","");
}

function yen(value){

  return (
    Number(value || 0)
      .toLocaleString("ja-JP") +
    "円"
  );
}

function safeNumber(v){

  if(
    v === null ||
    v === undefined ||
    v === ""
  ){

    return null;
  }

  const n = Number(v);

  return Number.isFinite(n)
    ? n
    : null;
}

function fmt(v,digits=2){

  const n =
    safeNumber(v);

  return n === null
    ? "-"
    : n.toFixed(digits);
}

function clamp(
  value,
  min,
  max
){

  return Math.max(
    min,
    Math.min(
      max,
      value
    )
  );
}

async function getJSON(url){

  const controller =
    new AbortController();

  const timer =
    setTimeout(
      ()=>controller.abort(),
      15000
    );

  try{

    const response =
      await fetch(
        url,
        {
          signal:controller.signal,
          cache:"no-store"
        }
      );

    const data =
      await response.json();

    if(
      !response.ok ||
      !data.ok
    ){

      throw new Error(
        data.error ||
        `HTTP ${response.status}`
      );
    }

    return data;

  }finally{

    clearTimeout(timer);
  }
}

/* =========================
   保存
========================= */

function getHistory(){

  try{

    return JSON.parse(
      localStorage.getItem(
        "boat_ai_predictions"
      ) || "[]"
    );

  }catch{

    return [];
  }
}

function saveHistory(history){

  localStorage.setItem(
    "boat_ai_predictions",
    JSON.stringify(history)
  );
}

/*
  V6.6.3だけを重複判定。
  旧バージョンと同じレースでも
  V6.6.3として保存可能。
*/

function alreadySaved(
  date,
  jcd,
  rno
){

  return getHistory()
    .some(
      item =>

        String(item.date) ===
          String(date) &&

        String(item.jcd) ===
          String(jcd) &&

        Number(item.rno) ===
          Number(rno) &&

        String(item.version || "") ===
          "6.6.3"
    );
}

/* =========================
   直前情報
========================= */

function mergeBefore(
  racers,
  beforeData
){

  return racers.map(
    racer=>{

      const live =
        beforeData?.racers?.find(
          x =>
            Number(x.lane) ===
            Number(racer.lane)
        );

      return {

        ...racer,

        before:{

          course:
            live?.course ?? null,

          exhibitionTime:
            live?.exhibitionTime ?? null,

          exhibitionST:
            live?.exhibitionST ?? null,

          tilt:
            live?.tilt ?? null
        }
      };
    }
  );
}

/* =========================
   採点項目
========================= */

const COMPONENT_NAMES = {

  lane:"枠・コース基本力",
  class:"級別",
  national:"全国勝率",
  local:"当地勝率",
  st:"平均ST",
  motor:"モーター",
  exhibition:"展示タイム",
  exhibitionST:"展示ST",
  course:"展示コース"
};

function scoreComponents(
  racer,
  allRacers
){

  const c = {

    lane:0,
    class:0,
    national:0,
    local:0,
    st:0,
    motor:0,
    exhibition:0,
    exhibitionST:0,
    course:0
  };

  const laneScore = {
    1:25,
    2:19,
    3:16,
    4:13,
    5:8,
    6:5
  };

  c.lane =
    laneScore[racer.lane] || 0;

  const classScore = {
    A1:15,
    A2:12,
    B1:7,
    B2:3
  };

  c.class =
    classScore[racer.class] || 0;

  const national =
    safeNumber(
      racer.national?.winRate
    );

  if(national !== null){

    c.national =
      Math.min(
        18,
        national * 2.25
      );
  }

  const local =
    safeNumber(
      racer.local?.winRate
    );

  if(local !== null){

    c.local =
      Math.min(
        10,
        local * 1.25
      );
  }

  const avgST =
    safeNumber(
      racer.avgST
    );

  if(avgST !== null){

    if(avgST <= .12){
      c.st = 8;
    }
    else if(avgST <= .14){
      c.st = 7;
    }
    else if(avgST <= .16){
      c.st = 5;
    }
    else if(avgST <= .18){
      c.st = 3;
    }
    else{
      c.st = 1;
    }
  }

  const motor =
    safeNumber(
      racer.motor?.secondRate
    );

  if(motor !== null){

    c.motor =
      Math.min(
        10,
        motor / 5
      );
  }

  const times =
    allRacers
      .map(
        r =>
          safeNumber(
            r.before?.exhibitionTime
          )
      )
      .filter(
        n =>
          n !== null
      );

  const exhibition =
    safeNumber(
      racer.before?.exhibitionTime
    );

  if(
    exhibition !== null &&
    times.length
  ){

    const fastest =
      Math.min(...times);

    const diff =
      exhibition-fastest;

    if(diff <= .01){
      c.exhibition = 8;
    }
    else if(diff <= .03){
      c.exhibition = 7;
    }
    else if(diff <= .05){
      c.exhibition = 5;
    }
    else if(diff <= .08){
      c.exhibition = 3;
    }
    else{
      c.exhibition = 1;
    }
  }

  const exhibitionST =
    safeNumber(
      racer.before?.exhibitionST
    );

  if(exhibitionST !== null){

    if(exhibitionST <= .05){
      c.exhibitionST = 4;
    }
    else if(exhibitionST <= .10){
      c.exhibitionST = 3;
    }
    else if(exhibitionST <= .15){
      c.exhibitionST = 2;
    }
    else{
      c.exhibitionST = 1;
    }
  }

  const course =
    safeNumber(
      racer.before?.course
    );

  if(course === 1){

    c.course = 2;

  }else if(
    course !== null &&
    course <= 3
  ){

    c.course = 1;
  }

  return c;
}

/* =========================
   学習
========================= */

function getTrainableHistory(
  asOfDate=null
){

  return getHistory()
    .filter(
      item =>{

        if(
          !item.result?.finished
        ){
          return false;
        }

        if(
          !Array.isArray(
            item.racersDetailed
          ) ||
          item.racersDetailed.length !== 6
        ){
          return false;
        }

        if(
          !Array.isArray(
            item.result.winningLanes
          ) ||
          item.result.winningLanes.length < 3
        ){
          return false;
        }

        if(
          asOfDate &&
          String(item.date) >=
          String(asOfDate)
        ){
          return false;
        }

        return true;
      }
    );
}

function calculateLearnedWeights(
  asOfDate=null
){

  const history =
    getTrainableHistory(
      asOfDate
    );

  const base = {};

  for(
    const key of
    Object.keys(
      COMPONENT_NAMES
    )
  ){

    base[key] = 1;
  }

  if(history.length < 10){

    return {
      active:false,
      races:history.length,
      weights:base
    };
  }

  const signals = {};

  for(
    const key of
    Object.keys(
      COMPONENT_NAMES
    )
  ){

    signals[key] = [];
  }

  for(
    const item of history
  ){

    const winners =
      new Set(
        item.result
          .winningLanes
          .slice(0,3)
          .map(Number)
      );

    for(
      const key of
      Object.keys(
        COMPONENT_NAMES
      )
    ){

      const allValues =
        item.racersDetailed.map(
          r =>
            Number(
              r.components?.[key] || 0
            )
        );

      const winnerValues =
        item.racersDetailed
          .filter(
            r =>
              winners.has(
                Number(r.lane)
              )
          )
          .map(
            r =>
              Number(
                r.components?.[key] || 0
              )
          );

      if(
        !winnerValues.length
      ){
        continue;
      }

      const allAvg =
        allValues.reduce(
          (a,b)=>a+b,
          0
        ) /
        allValues.length;

      const winnerAvg =
        winnerValues.reduce(
          (a,b)=>a+b,
          0
        ) /
        winnerValues.length;

      if(allAvg > 0){

        signals[key].push(
          (
            winnerAvg -
            allAvg
          ) /
          allAvg
        );
      }
    }
  }

  const weights = {};

  for(
    const key of
    Object.keys(
      COMPONENT_NAMES
    )
  ){

    const arr =
      signals[key];

    if(
      !arr.length
    ){

      weights[key] = 1;
      continue;
    }

    const avg =
      arr.reduce(
        (a,b)=>a+b,
        0
      ) /
      arr.length;

    const adjustment =
      clamp(
        avg * .35,
        -.15,
        .15
      );

    weights[key] =
      Math.round(
        (1+adjustment)*1000
      ) /
      1000;
  }

  return {
    active:true,
    races:history.length,
    weights
  };
}

/* =========================
   着順別モデル
========================= */

const ROLE_WEIGHTS = {

  first:{
    lane:1.25,
    class:.90,
    national:1.15,
    local:.75,
    st:1.25,
    motor:.70,
    exhibition:.80,
    exhibitionST:.90,
    course:1.15
  },

  second:{
    lane:.75,
    class:.85,
    national:.90,
    local:1.05,
    st:.85,
    motor:1.15,
    exhibition:1.15,
    exhibitionST:1.00,
    course:.75
  },

  third:{
    lane:.45,
    class:.65,
    national:.75,
    local:.95,
    st:.65,
    motor:1.20,
    exhibition:1.10,
    exhibitionST:.90,
    course:.50
  }
};

function roleScore(
  components,
  learningWeights,
  role
){

  let score = 0;

  for(
    const key of
    Object.keys(
      COMPONENT_NAMES
    )
  ){

    score +=
      Number(
        components[key] || 0
      ) *
      Number(
        learningWeights[key] || 1
      ) *
      Number(
        ROLE_WEIGHTS[role][key] || 1
      );
  }

  return (
    Math.round(
      score*10
    ) / 10
  );
}

function overallScore(
  components,
  learningWeights
){

  let score = 0;

  for(
    const key of
    Object.keys(
      COMPONENT_NAMES
    )
  ){

    score +=
      Number(
        components[key] || 0
      ) *
      Number(
        learningWeights[key] || 1
      );
  }

  return (
    Math.round(
      score*10
    ) / 10
  );
}

/* =========================
   120通り
========================= */

function makeAllCombinations(){

  const list = [];

  for(
    let first=1;
    first<=6;
    first++
  ){

    for(
      let second=1;
      second<=6;
      second++
    ){

      if(
        second === first
      ){
        continue;
      }

      for(
        let third=1;
        third<=6;
        third++
      ){

        if(
          third === first ||
          third === second
        ){
          continue;
        }

        list.push(
          `${first}-${second}-${third}`
        );
      }
    }
  }

  return list;
}

function strength(score){

  return Math.exp(
    score / 20
  );
}

function trifectaProbability(
  first,
  second,
  third,
  racers
){

  const r1 =
    racers.find(
      r =>
        r.lane === first
    );

  const r2 =
    racers.find(
      r =>
        r.lane === second
    );

  const r3 =
    racers.find(
      r =>
        r.lane === third
    );

  if(
    !r1 ||
    !r2 ||
    !r3
  ){
    return 0;
  }

  const firstTotal =
    racers.reduce(
      (sum,r)=>
        sum +
        strength(
          r.firstScore
        ),
      0
    );

  const p1 =
    strength(
      r1.firstScore
    ) /
    firstTotal;

  const secondCandidates =
    racers.filter(
      r =>
        r.lane !== first
    );

  const secondTotal =
    secondCandidates.reduce(
      (sum,r)=>
        sum +
        strength(
          r.secondScore
        ),
      0
    );

  const p2 =
    strength(
      r2.secondScore
    ) /
    secondTotal;

  const thirdCandidates =
    racers.filter(
      r =>
        r.lane !== first &&
        r.lane !== second
    );

  const thirdTotal =
    thirdCandidates.reduce(
      (sum,r)=>
        sum +
        strength(
          r.thirdScore
        ),
      0
    );

  const p3 =
    strength(
      r3.thirdScore
    ) /
    thirdTotal;

  return p1*p2*p3;
}

function makeOddsMap(
  oddsData
){

  const map = {};

  for(
    const item of
    oddsData?.odds || []
  ){

    map[
      item.combination
    ] =
      Number(
        item.odds
      );
  }

  return map;
}

/* =========================
   120通り評価
========================= */

function evaluateBets(
  racers,
  oddsData
){

  const oddsMap =
    makeOddsMap(
      oddsData
    );

  const candidates = [];

  for(
    const combination of
    makeAllCombinations()
  ){

    const [
      first,
      second,
      third
    ] =
      combination
        .split("-")
        .map(Number);

    const odds =
      safeNumber(
        oddsMap[
          combination
        ]
      );

    if(
      odds === null
    ){
      continue;
    }

    const firstRacer =
      racers.find(
        r =>
          r.lane === first
      );

    const secondRacer =
      racers.find(
        r =>
          r.lane === second
      );

    const thirdRacer =
      racers.find(
        r =>
          r.lane === third
      );

    const probability =
      trifectaProbability(
        first,
        second,
        third,
        racers
      );

    const ev =
      probability *
      odds;

    candidates.push({

      combination,

      first,
      second,
      third,

      firstRole:
        firstRacer.firstScore,

      secondRole:
        secondRacer.secondScore,

      thirdRole:
        thirdRacer.thirdScore,

      probability,

      odds,

      ev
    });
  }

  if(
    !candidates.length
  ){
    return [];
  }

  const maxFirst =
    Math.max(
      ...candidates.map(
        x => x.firstRole
      ),
      1
    );

  const maxSecond =
    Math.max(
      ...candidates.map(
        x => x.secondRole
      ),
      1
    );

  const maxThird =
    Math.max(
      ...candidates.map(
        x => x.thirdRole
      ),
      1
    );

  const maxProbability =
    Math.max(
      ...candidates.map(
        x => x.probability
      ),
      .000001
    );

  const maxEV =
    Math.max(
      ...candidates.map(
        x =>
          Math.min(
            x.ev,
            3
          )
      ),
      .000001
    );

  for(
    const item of candidates
  ){

    const firstNorm =
      item.firstRole /
      maxFirst;

    const secondNorm =
      item.secondRole /
      maxSecond;

    const thirdNorm =
      item.thirdRole /
      maxThird;

    const probabilityNorm =
      item.probability /
      maxProbability;

    const evNorm =
      Math.log1p(
        Math.min(
          item.ev,
          3
        )
      ) /
      Math.log1p(
        maxEV
      );

    item.totalScore =
      (
        firstNorm * .20 +
        secondNorm * .12 +
        thirdNorm * .08 +
        probabilityNorm * .40 +
        evNorm * .20
      ) *
      100;

    item.totalScore =
      Math.round(
        item.totalScore*10
      ) / 10;
  }

  return candidates
    .sort(
      (a,b)=>
        b.totalScore -
        a.totalScore
    );
}

/* =========================
   勝負度
========================= */

function getConfidence(
  racers
){

  const firstRanks =
    racers
      .slice()
      .sort(
        (a,b)=>
          b.firstScore -
          a.firstScore
      );

  if(
    firstRanks.length < 3
  ){
    return "B";
  }

  const gap2 =
    firstRanks[0].firstScore -
    firstRanks[1].firstScore;

  const gap3 =
    firstRanks[0].firstScore -
    firstRanks[2].firstScore;

  if(
    gap2 >= 9 &&
    gap3 >= 14
  ){
    return "S";
  }

  if(
    gap2 >= 4.5
  ){
    return "A";
  }

  return "B";
}

function buildPrediction(
  racers,
  oddsData,
  context
){

  const learned =
    calculateLearnedWeights(
      context.date
    );

  const modelRacers =
    racers.map(
      racer=>{

        const components =
          scoreComponents(
            racer,
            racers
          );

        return {

          ...racer,

          components,

          overallScore:
            overallScore(
              components,
              learned.weights
            ),

          firstScore:
            roleScore(
              components,
              learned.weights,
              "first"
            ),

          secondScore:
            roleScore(
              components,
              learned.weights,
              "second"
            ),

          thirdScore:
            roleScore(
              components,
              learned.weights,
              "third"
            )
        };
      }
    );

  const overallRanking =
    modelRacers
      .slice()
      .sort(
        (a,b)=>
          b.overallScore -
          a.overallScore
      );

  const firstRanking =
    modelRacers
      .slice()
      .sort(
        (a,b)=>
          b.firstScore -
          a.firstScore
      );

  const confidence =
    getConfidence(
      modelRacers
    );

  const allBets =
    evaluateBets(
      modelRacers,
      oddsData
    );

  const top15 =
    allBets.slice(
      0,
      15
    );

  /*
    ★V6.6.3
    120通り全部の順位を軽量保存。
    結果後に実結果が何位だったか確認できる。
  */

  const allBetRanking =
    allBets.map(
      (b,index)=>({

        rank:
          index + 1,

        combination:
          b.combination,

        totalScore:
          b.totalScore,

        probability:
          b.probability,

        odds:
          b.odds,

        ev:
          b.ev
      })
    );

  const snapshot = {

    id:
      `${context.date}-${context.jcd}-${context.rno}-${Date.now()}-${Math.random().toString(36).slice(2,7)}`,

    version:
      "6.6.3",

    createdAt:
      new Date()
        .toISOString(),

    date:
      context.date,

    jcd:
      context.jcd,

    venue:
      context.venue,

    rno:
      Number(
        context.rno
      ),

    confidence,

    evaluatedCount:
      allBets.length,

    learnedWeights:
      learned.weights,

    learningRaces:
      learned.races,

    racersDetailed:
      modelRacers.map(
        r=>({

          lane:r.lane,
          name:r.name,
          class:r.class,

          components:{
            ...r.components
          },

          overallScore:
            r.overallScore,

          firstScore:
            r.firstScore,

          secondScore:
            r.secondScore,

          thirdScore:
            r.thirdScore
        })
      ),

    overallRanking:
      overallRanking.map(
        r => r.lane
      ),

    firstRanking:
      firstRanking.map(
        r => r.lane
      ),

    /*
      上位15点は購入比較用
    */

    bets:
      top15.map(
        b=>({

          combination:
            b.combination,

          first:
            b.first,

          second:
            b.second,

          third:
            b.third,

          firstRole:
            b.firstRole,

          secondRole:
            b.secondRole,

          thirdRole:
            b.thirdRole,

          probability:
            b.probability,

          odds:
            b.odds,

          ev:
            b.ev,

          totalScore:
            b.totalScore
        })
      ),

    /*
      120通り順位保存
    */

    allBetRanking
  };

  return {

    learned,
    modelRacers,
    overallRanking,
    firstRanking,
    confidence,
    allBets,
    top15,
    snapshot
  };
}

function makeSavedItem(
  snapshot,
  unit,
  mode
){

  const item =
    JSON.parse(
      JSON.stringify(
        snapshot
      )
    );

  item.betUnit =
    unit;

  item.totalStake =
    unit *
    item.bets.length;

  item.saveMode =
    mode;

  item.result =
    null;

  return item;
}

function saveCurrentPrediction(){

  if(
    !currentSnapshot
  ){

    saveStatus.textContent =
      "先にレースを選択してください";

    return;
  }

  if(
    alreadySaved(
      currentSnapshot.date,
      currentSnapshot.jcd,
      currentSnapshot.rno
    )
  ){

    saveStatus.textContent =
      "V6.6.3ではこのレースは保存済みです";

    return;
  }

  const unit =
    Number(
      $("betUnit").value
    );

  if(
    !Number.isFinite(unit) ||
    unit < 100
  ){

    saveStatus.textContent =
      "1点100円以上で入力してください";

    return;
  }

  if(
    !currentSnapshot.bets?.length
  ){

    saveStatus.textContent =
      "買い目を取得できていません";

    return;
  }

  const mode =
    String(
      currentSnapshot.date
    ) <
    String(
      todayApi()
    )

      ? "backtest"

      : "manual";

  const item =
    makeSavedItem(
      currentSnapshot,
      unit,
      mode
    );

  const history =
    getHistory();

  history.push(
    item
  );

  saveHistory(
    history
  );

  saveStatus.textContent =
    `${item.venue} ${item.rno}Rを保存しました。120通りAI順位も保存済みです`;

  renderHistory();
}

/* =========================
   自動保存
========================= */

async function getRacePredictionData(
  date,
  jcd,
  rno,
  venueName
){

  try{

    const result =
      await getJSON(
        `/api/result?hd=${date}&jcd=${jcd}&rno=${rno}`
      );

    if(
      result.finished
    ){

      return {
        skipped:true,
        reason:"finished"
      };
    }

  }catch{}

  const raceData =
    await getJSON(
      `/api/race?hd=${date}&jcd=${jcd}&rno=${rno}`
    );

  if(
    !raceData.racers?.length
  ){

    return {
      skipped:true,
      reason:"racers"
    };
  }

  let before = {
    racers:[]
  };

  let odds = {
    odds:[],
    count:0
  };

  try{

    before =
      await getJSON(
        `/api/before?hd=${date}&jcd=${jcd}&rno=${rno}`
      );

  }catch{}

  try{

    odds =
      await getJSON(
        `/api/odds?hd=${date}&jcd=${jcd}&rno=${rno}`
      );

  }catch{}

  if(
    !odds.odds?.length
  ){

    return {
      skipped:true,
      reason:"odds"
    };
  }

  const merged =
    mergeBefore(
      raceData.racers,
      before
    );

  const prediction =
    buildPrediction(
      merged,
      odds,
      {
        date,
        jcd,

        venue:
          venueName ||
          raceData.venue ||
          jcd,

        rno
      }
    );

  return {
    skipped:false,
    prediction
  };
}

async function autoSaveVenue(){

  const jcd =
    venueSelect.value;

  if(!jcd){

    autoSaveStatus.textContent =
      "開催場を選択してください";

    return;
  }

  if(
    !currentVenueRaces.length
  ){

    autoSaveStatus.textContent =
      "先にレース一覧を取得してください";

    return;
  }

  const unit =
    Number(
      $("autoBetUnit").value
    );

  if(
    !Number.isFinite(unit) ||
    unit < 100
  ){

    autoSaveStatus.textContent =
      "1点100円以上で入力してください";

    return;
  }

  const button =
    $("autoSaveVenue");

  button.disabled = true;

  const date =
    apiDate();

  const venueName =
    venueSelect.options[
      venueSelect.selectedIndex
    ]?.textContent
      ?.split("（")[0] ||
    jcd;

  let saved = 0;
  let duplicate = 0;
  let finished = 0;
  let unavailable = 0;

  for(
    let i=0;
    i<currentVenueRaces.length;
    i++
  ){

    const rno =
      Number(
        currentVenueRaces[i].rno
      );

    autoSaveStatus.textContent =
      `${rno}R確認中 ${i+1}/${currentVenueRaces.length}`;

    if(
      alreadySaved(
        date,
        jcd,
        rno
      )
    ){

      duplicate++;
      continue;
    }

    try{

      const data =
        await getRacePredictionData(
          date,
          jcd,
          rno,
          venueName
        );

      if(
        data.skipped
      ){

        if(
          data.reason ===
          "finished"
        ){

          finished++;

        }else{

          unavailable++;
        }

        continue;
      }

      const item =
        makeSavedItem(
          data.prediction.snapshot,
          unit,
          "auto"
        );

      const history =
        getHistory();

      history.push(
        item
      );

      saveHistory(
        history
      );

      saved++;

    }catch(error){

      console.log(error);
      unavailable++;
    }
  }

  button.disabled = false;

  autoSaveStatus.innerHTML = `
    完了<br>
    保存：${saved}R<br>
    V6.6.3保存済み：${duplicate}R<br>
    終了済み：${finished}R<br>
    データ未取得：${unavailable}R
  `;

  renderHistory();
}

function rankOfLane(
  racers,
  lane,
  field
){

  const sorted =
    racers
      .slice()
      .sort(
        (a,b)=>
          Number(b[field]) -
          Number(a[field])
      );

  const index =
    sorted.findIndex(
      r =>
        Number(r.lane) ===
        Number(lane)
    );

  return index >= 0
    ? index + 1
    : null;
}

function strategyResult(
  bets,
  winning,
  payout,
  unit,
  count
){

  const selected =
    bets.slice(
      0,
      Math.min(
        count,
        bets.length
      )
    );

  const hit =
    selected.some(
      b =>
        b.combination ===
        winning
    );

  const stake =
    unit *
    selected.length;

  const returnAmount =
    hit
      ? Math.round(
          payout *
          (
            unit /
            100
          )
        )
      : 0;

  const profit =
    returnAmount -
    stake;

  const roi =
    stake > 0
      ? returnAmount /
        stake *
        100
      : 0;

  return {
    count:selected.length,
    hit,
    stake,
    returnAmount,
    profit,
    roi
  };
}

          Number(found.totalScore),

        probability:
          Number(found.probability),

        odds:
          Number(found.odds),

        ev:
          Number(found.ev)
      };
    }
  }

  /*
    V6.6.2以前は15位以下の
    正確な順位を保存していない。
  */

  const topIndex =
    item.bets?.findIndex(
      b =>
        b.combination ===
        winning
    );

  if(
    topIndex >= 0
  ){

    return {
      rank:
        topIndex + 1,

      total:
        item.evaluatedCount || 120,

      oldData:true
    };
  }

  return {
    rank:null,
    total:item.evaluatedCount || 120,
    oldData:true
  };
}

async function checkResult(
  item
){

  const data =
    await getJSON(
      `/api/result?hd=${item.date}&jcd=${item.jcd}&rno=${item.rno}`
    );

  if(
    !data.finished
  ){

    return {
      finished:false
    };
  }

  const winning =
    data.combination;

  const winningLanes =
    Array.isArray(
      data.winningLanes
    ) &&
    data.winningLanes.length >= 3

      ? data.winningLanes
          .slice(0,3)
          .map(Number)

      : String(
          winning
        )
          .split("-")
          .map(Number);

  const bets =
    item.bets || [];

  const unit =
    Number(
      item.betUnit || 100
    );

  const p6 =
    strategyResult(
      bets,
      winning,
      data.payout,
      unit,
      6
    );

  const p10 =
    strategyResult(
      bets,
      winning,
      data.payout,
      unit,
      10
    );

  const p15 =
    strategyResult(
      bets,
      winning,
      data.payout,
      unit,
      15
    );

  const racers =
    item.racersDetailed || [];

  const diagnostics = {

    overall:[

      rankOfLane(
        racers,
        winningLanes[0],
        "overallScore"
      ),

      rankOfLane(
        racers,
        winningLanes[1],
        "overallScore"
      ),

      rankOfLane(
        racers,
        winningLanes[2],
        "overallScore"
      )
    ],

    role:{

      first:
        rankOfLane(
          racers,
          winningLanes[0],
          "firstScore"
        ),

      second:
        rankOfLane(
          racers,
          winningLanes[1],
          "secondScore"
        ),

      third:
        rankOfLane(
          racers,
          winningLanes[2],
          "thirdScore"
        )
    }
  };

  const actualRank =
    getActualCombinationRank(
      item,
      winning
    );

  return {

    finished:true,

    checkedAt:
      new Date()
        .toISOString(),

    combination:
      winning,

    winningLanes,

    payoutPer100:
      data.payout,

    method:
      data.method,

    actualRank,

    comparison:{
      p6,
      p10,
      p15
    },

    diagnostics,

    hit:
      p15.hit,

    totalStake:
      p15.stake,

    returnAmount:
      p15.returnAmount,

    profit:
      p15.profit,

    roi:
      p15.roi
  };
}

async function checkOne(
  id
){

  const history =
    getHistory();

  const index =
    history.findIndex(
      item =>
        item.id === id
    );

  if(index < 0){
    return;
  }

  try{

    history[index].result =
      await checkResult(
        history[index]
      );

    saveHistory(
      history
    );

    renderHistory();

  }catch(error){

    alert(
      `結果取得失敗：${error.message}`
    );
  }
}

async function checkAllResults(
  automatic=false
){

  const history =
    getHistory();

  const targets =
    history
      .map(
        (item,index)=>({
          item,
          index
        })
      )
      .filter(
        x =>
          !x.item.result?.finished
      );

  if(
    !targets.length
  ){

    if(automatic){

      autoCheckStatus.textContent =
        "未確認レースはありません";
    }

    return;
  }

  const button =
    $("checkAllResults");

  if(
    !automatic
  ){

    button.disabled = true;

    button.textContent =
      "結果確認中...";
  }

  let updated = 0;

  for(
    let i=0;
    i<targets.length;
    i++
  ){

    if(automatic){

      autoCheckStatus.textContent =
        `自動照合 ${i+1}/${targets.length}`;
    }

    try{

      const result =
        await checkResult(
          targets[i].item
        );

      history[
        targets[i].index
      ].result =
        result;

      if(
        result.finished
      ){

        updated++;
      }

    }catch(error){

      console.log(error);
    }
  }

  saveHistory(
    history
  );

  renderHistory();

  if(
    !automatic
  ){

    button.disabled = false;

    button.textContent =
      "結果を一括チェック";

  }else{

    autoCheckStatus.textContent =
      updated
        ? `${updated}R更新しました`
        : "新しい確定結果はありません";
  }
}

/* =========================
   6/10/15比較
========================= */

function comparisonData(
  key
){

  const finished =
    getHistory()
      .filter(
        item =>
          item.result?.finished &&
          item.result?.comparison?.[key]
      );

  let hits = 0;
  let stake = 0;
  let returns = 0;

  for(
    const item of finished
  ){

    const c =
      item.result
        .comparison[key];

    if(c.hit){
      hits++;
    }

    stake +=
      Number(
        c.stake || 0
      );

    returns +=
      Number(
        c.returnAmount || 0
      );
  }

  return {

    races:
      finished.length,

    hits,

    hitRate:
      finished.length
        ? hits /
          finished.length *
          100
        : 0,

    stake,

    returns,

    profit:
      returns-stake,

    roi:
      stake
        ? returns /
          stake *
          100
        : 0
  };
}

  `;
}

function renderWeights(){

  const learned =
    calculateLearnedWeights();

  if(
    !learned.active
  ){

    weightStatus.textContent =
      `詳細学習データ ${learned.races}/10R`;

    weightsBox.innerHTML = `
      <div class="adjust">

        🧠 項目別学習はまだOFF
        <br>

        あと
        ${Math.max(
          0,
          10-learned.races
        )}R

      </div>
    `;

    return;
  }

  weightStatus.textContent =
    `${learned.races}Rから項目別補正中`;

  weightsBox.innerHTML =
    Object.entries(
      learned.weights
    )
      .map(
        ([key,value])=>{

          const percent =
            (value-1)*100;

          return `
            <div class="learn-row">

              <div class="learn-head">

                <span>
                  ${COMPONENT_NAMES[key]}
                </span>

                <span>
                  ×${value.toFixed(3)}
                </span>

              </div>

              <div class="learn-detail">

                基準比：
                ${percent >= 0 ? "+" : ""}
                ${percent.toFixed(1)}%

              </div>

            </div>
          `;
        }
      )
      .join("");
}

                  onclick="checkOne('${item.id}')"

                  もう一度確認

              </div>
            `;
          }

          if(
            item.result?.finished

            const r =
              item.result;

            const c =
              r.comparison;

            const d =
              r.diagnostics;

            const ar =
              r.actualRank;

            let actualRankHtml = "";

            if(
              ar?.rank
            ){

              actualRankHtml = `
                <div class="actual-rank">

                  🎯 実結果のAI評価
                  <br>

                  <strong>
                    ${ar.rank}位 / ${ar.total}通り
                  </strong>

                  <br>

                    ar.rank <= 6
                      ? "✅ 上位6点圏内"
                      : ar.rank <= 10

                        : ar.rank <= 15
                          ? "🟡 上位15点圏内"
                          : "❌ 上位15点圏外"
                  }

                      ar.totalScore
                    )
                      ? `
                        <br>
                        AI総合点：
                        ${ar.totalScore.toFixed(1)}

                        <br>
                        予想時推定確率：
                        ${(ar.probability*100).toFixed(2)}%

                        <br>
                        予想時オッズ：
                        ${ar.odds.toFixed(1)}

                        <br>

                </div>
              `;

            }else{

              actualRankHtml = `
                <div class="actual-rank">

                  実結果の正確な120通り順位は、
                  この旧バージョンでは保存されていません。

                </div>
              `;
            }

            resultHtml = `
              <div class="result">

                <div class="hit">
                  実結果：
                  ${r.combination}
                </div>

                100円払戻：
                ${yen(
                  r.payoutPer100
                )}

                      <br>

                      6点：

                      /
                      収支
                      ${c.p6.profit >= 0 ? "+" : ""}
                      ${yen(c.p6.profit)}

                      <br>

                      10点：
                      ${
                        c.p10.hit
                          ? "🎯 的中"
                          : "×"
                      }

                      /
                      収支
                      ${c.p10.profit >= 0 ? "+" : ""}
                      ${yen(c.p10.profit)}

                      <br>

                      15点：
                      ${
                        c.p15.hit
                          ? "🎯 的中"
                          : "×"
                      }

                      /
                      収支
                      ${c.p15.profit >= 0 ? "+" : ""}
                      ${yen(c.p15.profit)}
                    `
                    : ""
                }

                ${
                  d
                    ? `
                      <div class="diagnostic">

                        🔍 着順別診断

                        /

   開催場
========================= */

function clearRaceArea(){

  raceGrid.innerHTML = "";
  racersBox.innerHTML = "";
  predictionBox.innerHTML = "";

  currentSnapshot = null;
  currentVenueRaces = [];

  raceTitle.textContent =
    "選手データ";

  racerStatus.textContent =
    "レースを選択してください";

  predictionStatus.textContent =
    "レースを選択すると予想します";
}

async function loadVenues(){

  venueStatus.textContent =
    "開催場取得中...";

  venueSelect.innerHTML =
    '<option value="">開催場を選択</option>';

  clearRaceArea();

  try{

    const data =
      await getJSON(
        `/api/venues?hd=${apiDate()}`
      );

    for(
      const venue of
      data.venues
    ){

      const option =
        document.createElement(
          "option"
        );

      option.value =
        venue.jcd;

      option.textContent =
        `${venue.name}（${venue.jcd}）`;

      venueSelect.appendChild(
        option
      );
    }

    venueStatus.textContent =
      `${data.venues.length}会場取得`;

  }catch(error){

    venueStatus.textContent =
      `取得失敗：${error.message}`;
  }
}

async function loadRaces(){

  const jcd =
    venueSelect.value;

  if(!jcd){

    raceStatus.textContent =
      "開催場を選択してください";

    return;
  }

  raceStatus.textContent =
    "レース取得中...";

  raceGrid.innerHTML = "";
  racersBox.innerHTML = "";
  predictionBox.innerHTML = "";

  currentSnapshot = null;
  currentVenueRaces = [];

  try{

    const data =
      await getJSON(
        `/api/venue?hd=${apiDate()}&jcd=${jcd}`
      );

    currentVenueRaces =
      data.races || [];

    raceStatus.textContent =
      `${data.venue || ""} ${data.races.length}レース`;

    for(
      const race of
      data.races
    ){

      const button =
        document.createElement(
          "button"
        );

      button.className =
        "race-btn";

      button.textContent =
        `${race.rno}R`;

      button.addEventListener(
        "click",
        ()=>loadRace(
          race.rno,
          button,
          data.venue
        )
      );

      raceGrid.appendChild(
        button
      );
    }

  }catch(error){

    raceStatus.textContent =
      `取得失敗：${error.message}`;
  }
}

/* =========================
   1R取得
========================= */

async function loadRace(
  rno,
  button,
  venueName
){

  const jcd =
    venueSelect.value;

  document
    .querySelectorAll(
      ".race-btn"
    )
    .forEach(
      btn =>
        btn.classList.remove(
          "active"
        )
    );

  button.classList.add(
    "active"
  );

  raceTitle.textContent =
    `${rno}R 選手データ`;

  racersBox.innerHTML = "";
  predictionBox.innerHTML = "";

  currentSnapshot = null;

  racerStatus.textContent =
    "取得中...";

  predictionStatus.textContent =
    "120通り計算中...";

  try{

    const raceData =
      await getJSON(
        `/api/race?hd=${apiDate()}&jcd=${jcd}&rno=${rno}`
      );

    if(
      !raceData.racers?.length
    ){

      racerStatus.textContent =
        "選手データなし";

      return;
    }

    let before = {
      racers:[]
    };

    let odds = {
      odds:[],
      count:0
    };

    try{

      before =
        await getJSON(
          `/api/before?hd=${apiDate()}&jcd=${jcd}&rno=${rno}`
        );

    }catch{}

    try{

      odds =
        await getJSON(
          `/api/odds?hd=${apiDate()}&jcd=${jcd}&rno=${rno}`
        );

    }catch{}

    const merged =
      mergeBefore(
        raceData.racers,
        before
      );

    const prediction =
      renderPrediction(
        merged,
        odds,
        {
          date:apiDate(),
          jcd,

          venue:
            venueName ||
            raceData.venue ||
            jcd,

          rno
        }
      );

    renderRacers(
      prediction.modelRacers
    );

    racerStatus.textContent =
      `${merged.length}艇取得`;

  }catch(error){

    racerStatus.textContent =
      `取得失敗：${error.message}`;

    predictionStatus.textContent =
      "予想失敗";
  }
}
