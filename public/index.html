<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>競艇AI V5.9</title>

  <style>
    *{box-sizing:border-box}

    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:#0f172a;
      color:#f8fafc;
    }

    .wrap{
      max-width:760px;
      margin:auto;
      padding:18px 14px 40px;
    }

    h1{
      margin:0 0 6px;
      font-size:28px;
    }

    .sub{
      color:#94a3b8;
      font-size:13px;
      margin-bottom:16px;
    }

    .card{
      background:#1e293b;
      border-radius:16px;
      padding:14px;
      margin-bottom:14px;
    }

    label{
      display:block;
      color:#cbd5e1;
      font-size:13px;
      margin:5px 0;
    }

    input,
    select,
    button{
      width:100%;
      min-height:46px;
      border:0;
      border-radius:10px;
      font-size:16px;
    }

    input,
    select{
      background:white;
      color:#111827;
      padding:10px;
      margin-bottom:10px;
    }

    button{
      background:#2563eb;
      color:white;
      font-weight:800;
      padding:10px;
      margin-bottom:8px;
    }

    .status{
      color:#cbd5e1;
      font-size:14px;
      margin:6px 0 10px;
      min-height:20px;
    }

    .title{
      font-size:19px;
      font-weight:900;
      margin-bottom:10px;
    }

    .race-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:8px;
    }

    .race-btn{
      background:#334155;
      margin:0;
    }

    .race-btn.active{
      background:#2563eb;
    }

    .racer{
      background:#0f172a;
      border-radius:12px;
      padding:12px;
      margin-bottom:8px;
    }

    .topline{
      display:grid;
      grid-template-columns:45px 1fr auto;
      gap:10px;
      align-items:center;
    }

    .lane{
      width:40px;
      height:40px;
      border-radius:50%;
      background:#e2e8f0;
      color:#111827;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:900;
      font-size:18px;
    }

    .name{
      font-size:16px;
      font-weight:900;
    }

    .meta{
      font-size:12px;
      color:#94a3b8;
      margin-top:3px;
    }

    .score{
      font-size:19px;
      font-weight:900;
      text-align:right;
    }

    .stats{
      margin-top:9px;
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:6px;
      font-size:12px;
      color:#cbd5e1;
    }

    .stat{
      background:#1e293b;
      border-radius:8px;
      padding:7px;
    }

    .prediction{
      background:#0f172a;
      border-radius:12px;
      padding:13px;
    }

    .confidence{
      display:inline-block;
      font-size:20px;
      font-weight:900;
      padding:5px 12px;
      background:#334155;
      border-radius:999px;
    }

    .rank{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:10px 0;
      border-bottom:1px solid #334155;
    }

    .rank:last-child{
      border-bottom:0;
    }

    .mark{
      font-size:22px;
      font-weight:900;
      margin-right:4px;
    }

    .bets{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:8px;
      margin-top:10px;
    }

    .bet{
      background:#1e293b;
      text-align:center;
      padding:10px 5px;
      border-radius:9px;
      font-weight:900;
      font-size:17px;
    }

    .live{
      margin-top:10px;
      padding:9px;
      border-radius:10px;
      background:#172554;
      font-size:13px;
      line-height:1.6;
    }

    .notice{
      color:#94a3b8;
      font-size:12px;
      line-height:1.5;
      margin-top:12px;
    }

    .version{
      text-align:center;
      color:#64748b;
      font-size:12px;
      margin-top:24px;
    }
  </style>
</head>

<body>

<div class="wrap">

  <h1>競艇AI V5.9</h1>

  <div class="sub">
    選手成績＋モーター＋直前展示データ反映
  </div>

  <div class="card">

    <label>日付</label>
    <input id="date" type="date">

    <button id="loadVenues">
      開催場を取得
    </button>

    <div id="venueStatus" class="status"></div>

    <label>開催場</label>

    <select id="venue">
      <option value="">
        開催場を選択
      </option>
    </select>

    <button id="loadRaces">
      選択した開催場のレースを取得
    </button>

    <div id="raceStatus" class="status"></div>

  </div>

  <div class="card">

    <div class="title">
      レース一覧
    </div>

    <div id="raceGrid" class="race-grid"></div>

  </div>

  <div class="card">

    <div id="raceTitle" class="title">
      選手データ
    </div>

    <div id="racerStatus" class="status">
      レースを選択してください
    </div>

    <div id="racers"></div>

  </div>

  <div class="card">

    <div class="title">
      AI予想
    </div>

    <div id="predictionStatus" class="status">
      レースを選択すると予想します
    </div>

    <div id="prediction"></div>

  </div>

  <div class="version">
    Boat Racing AI V5.9
  </div>

</div>

<script>

const $ = id =>
  document.getElementById(id);

const dateInput = $("date");
const venueSelect = $("venue");
const raceGrid = $("raceGrid");
const racersBox = $("racers");
const predictionBox = $("prediction");

const venueStatus = $("venueStatus");
const raceStatus = $("raceStatus");
const racerStatus = $("racerStatus");

const predictionStatus =
  $("predictionStatus");

const raceTitle =
  $("raceTitle");

function todayLocal(){

  const now = new Date();

  const y =
    now.getFullYear();

  const m =
    String(
      now.getMonth() + 1
    ).padStart(2,"0");

  const d =
    String(
      now.getDate()
    ).padStart(2,"0");

  return `${y}-${m}-${d}`;
}

function apiDate(){

  return dateInput.value
    .replaceAll("-","");
}

async function getJSON(url){

  const controller =
    new AbortController();

  const timer =
    setTimeout(
      ()=>controller.abort(),
      12000
    );

  try{

    const response =
      await fetch(
        url,
        {
          signal:
            controller.signal,
          cache:"no-store"
        }
      );

    const data =
      await response.json();

    if(
      !response.ok ||
      !data.ok
    ){
      throw new Error(
        data.error ||
        `HTTP ${response.status}`
      );
    }

    return data;

  }finally{

    clearTimeout(timer);
  }
}

function safeNumber(value){

  const n =
    Number(value);

  return Number.isFinite(n)
    ? n
    : null;
}

function fmt(value,digits=2){

  if(
    value === null ||
    value === undefined
  ){
    return "-";
  }

  const n =
    Number(value);

  if(
    !Number.isFinite(n)
  ){
    return "-";
  }

  return n.toFixed(digits);
}

function mergeBefore(
  racers,
  beforeData
){

  return racers.map(racer=>{

    const live =
      beforeData?.racers?.find(
        x =>
          Number(x.lane) ===
          Number(racer.lane)
      );

    return {
      ...racer,

      before:{
        course:
          live?.course ??
          null,

        exhibitionTime:
          live?.exhibitionTime ??
          null,

        exhibitionST:
          live?.exhibitionST ??
          null,

        tilt:
          live?.tilt ??
          null
      }
    };
  });
}

/*
  V5.9 AIスコア

  基本能力
  艇番　　　　 25
  級別　　　　 15
  全国勝率　　 18
  当地勝率　　 10
  平均ST　　　  8
  モーター　　 10

  直前
  展示タイム　 8
  展示ST　　　 4
  進入　　　　 2

  合計およそ100点
*/

function aiScore(
  racer,
  allRacers
){

  let score = 0;

  const laneScore = {
    1:25,
    2:19,
    3:16,
    4:13,
    5:8,
    6:5
  };

  score +=
    laneScore[racer.lane] || 0;

  const classScore = {
    A1:15,
    A2:12,
    B1:7,
    B2:3
  };

  score +=
    classScore[racer.class] || 0;

  const national =
    safeNumber(
      racer.national?.winRate
    );

  if(national !== null){

    score +=
      Math.min(
        18,
        national * 2.25
      );
  }

  const local =
    safeNumber(
      racer.local?.winRate
    );

  if(local !== null){

    score +=
      Math.min(
        10,
        local * 1.25
      );
  }

  const avgST =
    safeNumber(
      racer.avgST
    );

  if(avgST !== null){

    if(avgST <= 0.12){
      score += 8;
    }
    else if(avgST <= 0.14){
      score += 7;
    }
    else if(avgST <= 0.16){
      score += 5;
    }
    else if(avgST <= 0.18){
      score += 3;
    }
    else{
      score += 1;
    }
  }

  const motor =
    safeNumber(
      racer.motor?.secondRate
    );

  if(motor !== null){

    score +=
      Math.min(
        10,
        motor / 5
      );
  }

  /*
    展示タイムはレース内で
    最速艇との比較で評価
  */

  const exhibitionTimes =
    allRacers
      .map(r =>
        safeNumber(
          r.before?.exhibitionTime
        )
      )
      .filter(
        n => n !== null
      );

  const exhibition =
    safeNumber(
      racer.before?.exhibitionTime
    );

  if(
    exhibition !== null &&
    exhibitionTimes.length
  ){

    const fastest =
      Math.min(
        ...exhibitionTimes
      );

    const diff =
      exhibition - fastest;

    if(diff <= 0.01){
      score += 8;
    }
    else if(diff <= 0.03){
      score += 7;
    }
    else if(diff <= 0.05){
      score += 5;
    }
    else if(diff <= 0.08){
      score += 3;
    }
    else{
      score += 1;
    }
  }

  /*
    スタート展示
  */

  const exhibitionST =
    safeNumber(
      racer.before?.exhibitionST
    );

  if(exhibitionST !== null){

    if(exhibitionST <= 0.05){
      score += 4;
    }
    else if(exhibitionST <= 0.10){
      score += 3;
    }
    else if(exhibitionST <= 0.15){
      score += 2;
    }
    else{
      score += 1;
    }
  }

  /*
    進入コース
  */

  const course =
    safeNumber(
      racer.before?.course
    );

  if(course !== null){

    if(course === 1){
      score += 2;
    }
    else if(course <= 3){
      score += 1;
    }
  }

  return Math.round(
    score * 10
  ) / 10;
}

function getConfidence(sorted){

  if(sorted.length < 3){
    return "B";
  }

  const top =
    sorted[0].score;

  const gap2 =
    sorted[0].score -
    sorted[1].score;

  const gap3 =
    sorted[0].score -
    sorted[2].score;

  if(
    top >= 82 &&
    gap2 >= 8 &&
    gap3 >= 14
  ){
    return "S";
  }

  if(
    top >= 68 &&
    gap2 >= 4
  ){
    return "A";
  }

  return "B";
}

function getMarks(sorted){

  const result = {};

  if(sorted[0]){
    result[sorted[0].lane] = "◎";
  }

  if(sorted[1]){
    result[sorted[1].lane] = "○";
  }

  if(sorted[2]){
    result[sorted[2].lane] = "▲";
  }

  return result;
}

function makeBets(sorted){

  if(sorted.length < 3){
    return [];
  }

  const a =
    sorted[0].lane;

  const b =
    sorted[1].lane;

  const c =
    sorted[2].lane;

  return [
    `${a}-${b}-${c}`,
    `${a}-${c}-${b}`,
    `${b}-${a}-${c}`
  ];
}

function renderPrediction(
  racers,
  weather
){

  const scored =
    racers
      .map(racer=>({
        ...racer,
        score:
          aiScore(
            racer,
            racers
          )
      }))
      .sort(
        (a,b)=>
          b.score-a.score
      );

  const marks =
    getMarks(scored);

  const confidence =
    getConfidence(scored);

  const bets =
    makeBets(scored);

  predictionStatus.textContent =
    `勝負度 ${confidence}`;

  let weatherHtml = "";

  if(weather){

    weatherHtml = `
      <div class="live">
        気温：
        ${fmt(weather.temperature,1)}℃　
        風速：
        ${fmt(weather.windSpeed,1)}m　
        水温：
        ${fmt(weather.waterTemperature,1)}℃　
        波高：
        ${fmt(weather.waveHeight,0)}cm
      </div>
    `;
  }

  predictionBox.innerHTML = `
    <div class="prediction">

      <div>
        勝負度：
        <span class="confidence">
          ${confidence}
        </span>
      </div>

      ${scored.slice(0,3).map(r=>`
        <div class="rank">

          <div>
            <span class="mark">
              ${marks[r.lane] || ""}
            </span>

            ${r.lane}号艇
            ${r.name}
          </div>

          <strong>
            ${r.score}点
          </strong>

        </div>
      `).join("")}

      <div style="
        margin-top:12px;
        font-weight:900;
      ">
        3連単候補
      </div>

      <div class="bets">

        ${bets.map(b=>`
          <div class="bet">
            ${b}
          </div>
        `).join("")}

      </div>

      ${weatherHtml}

      <div class="notice">
        V5.9では選手成績・枠番・級別・平均ST・
        モーター成績に加え、展示タイム・
        スタート展示・進入コースを反映しています。
        直前情報が未公開の場合は、
        通常データのみで評価します。
        オッズ・期待値はまだ未反映です。
      </div>

    </div>
  `;

  return {
    scored,
    marks
  };
}

function renderRacers(
  racers,
  scored,
  marks
){

  racersBox.innerHTML = "";

  for(
    const racer of racers
  ){

    const scoreData =
      scored.find(
        r =>
          r.lane ===
          racer.lane
      );

    const row =
      document.createElement(
        "div"
      );

    row.className =
      "racer";

    row.innerHTML = `
      <div class="topline">

        <div class="lane">
          ${racer.lane}
        </div>

        <div>

          <div class="name">
            ${marks[racer.lane] || ""}
            ${racer.name}
          </div>

          <div class="meta">
            ${racer.class}
            /
            登録番号
            ${racer.registration}
          </div>

        </div>

        <div class="score">
          ${scoreData?.score ?? "-"}点
        </div>

      </div>

      <div class="stats">

        <div class="stat">
          全国勝率：
          ${fmt(
            racer.national?.winRate
          )}
        </div>

        <div class="stat">
          当地勝率：
          ${fmt(
            racer.local?.winRate
          )}
        </div>

        <div class="stat">
          平均ST：
          ${fmt(
            racer.avgST
          )}
        </div>

        <div class="stat">
          モーター2連率：
          ${fmt(
            racer.motor?.secondRate
          )}%
        </div>

        <div class="stat">
          展示タイム：
          ${fmt(
            racer.before?.exhibitionTime
          )}
        </div>

        <div class="stat">
          展示ST：
          ${fmt(
            racer.before?.exhibitionST
          )}
        </div>

        <div class="stat">
          進入：
          ${racer.before?.course ?? "-"}
          コース
        </div>

        <div class="stat">
          チルト：
          ${fmt(
            racer.before?.tilt,
            1
          )}
        </div>

      </div>
    `;

    racersBox.appendChild(
      row
    );
  }
}

function clearRaceArea(){

  raceGrid.innerHTML = "";
  racersBox.innerHTML = "";
  predictionBox.innerHTML = "";

  raceTitle.textContent =
    "選手データ";

  racerStatus.textContent =
    "レースを選択してください";

  predictionStatus.textContent =
    "レースを選択すると予想します";
}

async function loadVenues(){

  venueStatus.textContent =
    "開催場を取得中...";

  venueSelect.innerHTML =
    '<option value="">開催場を選択</option>';

  clearRaceArea();

  try{

    const data =
      await getJSON(
        `/api/venues?hd=${apiDate()}`
      );

    for(
      const venue of
      data.venues
    ){

      const option =
        document.createElement(
          "option"
        );

      option.value =
        venue.jcd;

      option.textContent =
        `${venue.name}（${venue.jcd}）`;

      venueSelect.appendChild(
        option
      );
    }

    venueStatus.textContent =
      `${data.venues.length}会場を取得しました`;

  }catch(error){

    venueStatus.textContent =
      `取得失敗：${error.message}`;
  }
}

async function loadRaces(){

  const jcd =
    venueSelect.value;

  if(!jcd){

    raceStatus.textContent =
      "開催場を選択してください";

    return;
  }

  raceStatus.textContent =
    "レースを取得中...";

  clearRaceArea();

  try{

    const data =
      await getJSON(
        `/api/venue?hd=${apiDate()}&jcd=${jcd}`
      );

    raceStatus.textContent =
      `${data.venue || ""} ${data.races.length}レースを取得しました`;

    for(
      const race of
      data.races
    ){

      const button =
        document.createElement(
          "button"
        );

      button.className =
        "race-btn";

      button.textContent =
        `${race.rno}R`;

      button.addEventListener(
        "click",
        ()=>loadRace(
          race.rno,
          button
        )
      );

      raceGrid.appendChild(
        button
      );
    }

  }catch(error){

    raceStatus.textContent =
      `取得失敗：${error.message}`;
  }
}

async function loadRace(
  rno,
  button
){

  const jcd =
    venueSelect.value;

  document
    .querySelectorAll(
      ".race-btn"
    )
    .forEach(
      btn =>
        btn.classList.remove(
          "active"
        )
    );

  button.classList.add(
    "active"
  );

  raceTitle.textContent =
    `${rno}R 選手データ`;

  racersBox.innerHTML = "";
  predictionBox.innerHTML = "";

  racerStatus.textContent =
    "選手データを取得中...";

  predictionStatus.textContent =
    "AI予想を計算中...";

  try{

    const raceData =
      await getJSON(
        `/api/race?hd=${apiDate()}&jcd=${jcd}&rno=${rno}`
      );

    if(
      !raceData.racers ||
      !raceData.racers.length
    ){

      racerStatus.textContent =
        "選手データを取得できませんでした";

      predictionStatus.textContent =
        "予想できません";

      return;
    }

    let beforeData = {
      racers:[],
      weather:null
    };

    try{

      beforeData =
        await getJSON(
          `/api/before?hd=${apiDate()}&jcd=${jcd}&rno=${rno}`
        );

    }catch(error){

      console.log(
        "直前情報なし",
        error
      );
    }

    const merged =
      mergeBefore(
        raceData.racers,
        beforeData
      );

    racerStatus.textContent =
      beforeData.racers?.length
        ? `${merged.length}艇＋直前情報を取得しました`
        : `${merged.length}艇を取得しました（直前情報未公開）`;

    const prediction =
      renderPrediction(
        merged,
        beforeData.weather
      );

    renderRacers(
      merged,
      prediction.scored,
      prediction.marks
    );

  }catch(error){

    racerStatus.textContent =
      `取得失敗：${error.message}`;

    predictionStatus.textContent =
      "予想失敗";
  }
}

dateInput.value =
  todayLocal();

$("loadVenues")
  .addEventListener(
    "click",
    loadVenues
  );

$("loadRaces")
  .addEventListener(
    "click",
    loadRaces
  );

</script>

</body>
</html>
