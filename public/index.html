<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111827" />
  <title>競艇AI V5.5</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }

    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 18px 14px 40px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 28px;
    }

    .sub {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 18px;
    }

    .card {
      background: #1e293b;
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 13px;
      color: #cbd5e1;
      margin-bottom: 6px;
    }

    input,
    select,
    button {
      width: 100%;
      min-height: 46px;
      border-radius: 10px;
      border: 0;
      font-size: 16px;
    }

    input,
    select {
      padding: 10px 12px;
      background: #fff;
      color: #111827;
      margin-bottom: 10px;
    }

    button {
      padding: 11px 12px;
      background: #2563eb;
      color: white;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 8px;
    }

    button:disabled {
      opacity: 0.5;
    }

    .status {
      margin-top: 8px;
      font-size: 14px;
      color: #cbd5e1;
      min-height: 20px;
    }

    .race-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

    .race-btn {
      background: #334155;
      margin: 0;
    }

    .race-btn.active {
      background: #2563eb;
    }

    .race-title {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .racer {
      background: #0f172a;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 8px;
      display: grid;
      grid-template-columns: 48px 1fr;
      gap: 10px;
      align-items: center;
    }

    .lane {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 18px;
      background: #e2e8f0;
      color: #111827;
    }

    .racer-name {
      font-size: 17px;
      font-weight: 800;
    }

    .racer-meta {
      color: #94a3b8;
      font-size: 13px;
      margin-top: 3px;
    }

    .empty {
      color: #94a3b8;
      font-size: 14px;
      padding: 10px 0;
    }

    .version {
      text-align: center;
      color: #64748b;
      font-size: 12px;
      margin-top: 24px;
    }
  </style>
</head>

<body>
  <div class="wrap">

    <h1>競艇AI V5.5</h1>
    <div class="sub">
      開催場・レース・選手データ取得版
    </div>

    <div class="card">
      <label for="date">日付</label>
      <input id="date" type="date" />

      <button id="loadVenues">
        開催場を取得
      </button>

      <div id="venueStatus" class="status"></div>

      <label for="venue">開催場</label>
      <select id="venue">
        <option value="">
          開催場を選択
        </option>
      </select>

      <button id="loadRaces">
        選択した開催場のレースを取得
      </button>

      <div id="raceStatus" class="status"></div>
    </div>

    <div class="card">
      <div class="race-title">
        レース一覧
      </div>

      <div id="raceGrid" class="race-grid"></div>
    </div>

    <div class="card">
      <div class="race-title" id="selectedRaceTitle">
        選手情報
      </div>

      <div id="racerStatus" class="status">
        レースを選択してください
      </div>

      <div id="racers"></div>
    </div>

    <div class="version">
      Boat Racing AI V5.5
    </div>

  </div>

  <script>
    const $ = id =>
      document.getElementById(id);

    const dateInput = $("date");
    const venueSelect = $("venue");
    const loadVenuesBtn = $("loadVenues");
    const loadRacesBtn = $("loadRaces");

    const venueStatus = $("venueStatus");
    const raceStatus = $("raceStatus");
    const racerStatus = $("racerStatus");

    const raceGrid = $("raceGrid");
    const racersBox = $("racers");
    const selectedRaceTitle =
      $("selectedRaceTitle");

    let selectedRace = null;

    function todayLocal() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(
        now.getMonth() + 1
      ).padStart(2, "0");

      const d = String(
        now.getDate()
      ).padStart(2, "0");

      return `${y}-${m}-${d}`;
    }

    function apiDate() {
      return dateInput.value
        .replaceAll("-", "");
    }

    async function getJSON(url) {
      const controller =
        new AbortController();

      const timer = setTimeout(
        () => controller.abort(),
        12000
      );

      try {
        const response = await fetch(
          url,
          {
            signal: controller.signal,
            cache: "no-store"
          }
        );

        const data = await response.json();

        if (!response.ok || !data.ok) {
          throw new Error(
            data.error ||
            `HTTP ${response.status}`
          );
        }

        return data;

      } finally {
        clearTimeout(timer);
      }
    }

    function clearRaceArea() {
      raceGrid.innerHTML = "";
      racersBox.innerHTML = "";
      selectedRace = null;

      selectedRaceTitle.textContent =
        "選手情報";

      racerStatus.textContent =
        "レースを選択してください";
    }

    async function loadVenues() {
      venueStatus.textContent =
        "開催場を取得中...";

      venueSelect.innerHTML =
        '<option value="">開催場を選択</option>';

      clearRaceArea();

      try {
        const data = await getJSON(
          `/api/venues?hd=${apiDate()}`
        );

        for (const venue of data.venues) {
          const option =
            document.createElement("option");

          option.value = venue.jcd;
          option.textContent =
            `${venue.name}（${venue.jcd}）`;

          venueSelect.appendChild(option);
        }

        venueStatus.textContent =
          `${data.venues.length}会場を取得しました`;

      } catch (error) {
        venueStatus.textContent =
          `取得失敗：${error.message}`;
      }
    }

    async function loadRaces() {
      const jcd = venueSelect.value;

      if (!jcd) {
        raceStatus.textContent =
          "開催場を選択してください";
        return;
      }

      raceStatus.textContent =
        "レースを取得中...";

      clearRaceArea();

      try {
        const data = await getJSON(
          `/api/venue?hd=${apiDate()}&jcd=${jcd}`
        );

        if (!data.races.length) {
          raceStatus.textContent =
            "レース情報がありません";
          return;
        }

        raceStatus.textContent =
          `${data.venue || ""} ${
            data.races.length
          }レースを取得しました`;

        for (const race of data.races) {
          const button =
            document.createElement("button");

          button.className = "race-btn";
          button.textContent =
            `${race.rno}R`;

          button.addEventListener(
            "click",
            () => loadRace(
              race.rno,
              button
            )
          );

          raceGrid.appendChild(button);
        }

      } catch (error) {
        raceStatus.textContent =
          `取得失敗：${error.message}`;
      }
    }

    async function loadRace(
      rno,
      button
    ) {
      const jcd = venueSelect.value;

      selectedRace = rno;

      document
        .querySelectorAll(".race-btn")
        .forEach(btn =>
          btn.classList.remove("active")
        );

      button.classList.add("active");

      selectedRaceTitle.textContent =
        `${rno}R 選手情報`;

      racersBox.innerHTML = "";

      racerStatus.textContent =
        "選手データを取得中...";

      try {
        const data = await getJSON(
          `/api/race?hd=${apiDate()}&jcd=${jcd}&rno=${rno}`
        );

        if (!data.racers.length) {
          racerStatus.textContent =
            "選手データを取得できませんでした";
          return;
        }

        racerStatus.textContent =
          `${data.racers.length}艇を取得しました`;

        for (const racer of data.racers) {
          const row =
            document.createElement("div");

          row.className = "racer";

          const lane =
            document.createElement("div");

          lane.className = "lane";
          lane.textContent = racer.lane;

          const info =
            document.createElement("div");

          const name =
            document.createElement("div");

          name.className = "racer-name";
          name.textContent = racer.name;

          const meta =
            document.createElement("div");

          meta.className = "racer-meta";
          meta.textContent =
            `${racer.class} / 登録番号 ${racer.registration}`;

          info.appendChild(name);
          info.appendChild(meta);

          row.appendChild(lane);
          row.appendChild(info);

          racersBox.appendChild(row);
        }

      } catch (error) {
        racerStatus.textContent =
          `取得失敗：${error.message}`;
      }
    }

    dateInput.value = todayLocal();

    loadVenuesBtn.addEventListener(
      "click",
      loadVenues
    );

    loadRacesBtn.addEventListener(
      "click",
      loadRaces
    );
  </script>
</body>
</html>
