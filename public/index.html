<script>

const $ = id =>
  document.getElementById(id);

const dateInput = $("date");
const venueSelect = $("venue");
const raceGrid = $("raceGrid");
const racersBox = $("racers");
const predictionBox = $("prediction");
const historyBox = $("history");
const sRaceList = $("sRaceList");
const comparisonBox = $("comparison");
const battleComparisonBox = $("battleComparison");
const weightsBox = $("weights");

let currentSnapshot = null;
let currentVenueRaces = [];
let currentSRaces = [];

let sView = "battle";

let historyDisplayCount = 5;
let historyFilter = "all";
let historyPeriod = "all";

const expandedHistoryIds =
  new Set();

/* =========================
   基本
========================= */

function todayLocal(){

  const now = new Date();

  const y = now.getFullYear();

  const m =
    String(
      now.getMonth()+1
    ).padStart(2,"0");

  const d =
    String(
      now.getDate()
    ).padStart(2,"0");

  return `${y}-${m}-${d}`;
}

function todayApi(){

  return todayLocal()
    .replaceAll("-","");
}

function yesterdayApi(){

  const date = new Date();

  date.setDate(
    date.getDate()-1
  );

  const y =
    date.getFullYear();

  const m =
    String(
      date.getMonth()+1
    ).padStart(2,"0");

  const d =
    String(
      date.getDate()
    ).padStart(2,"0");

  return `${y}${m}${d}`;
}

function apiDate(){

  return dateInput.value
    .replaceAll("-","");
}

function safeNumber(value){

  if(
    value === null ||
    value === undefined ||
    value === ""
  ){
    return null;
  }

  const n = Number(value);

  return Number.isFinite(n)
    ? n
    : null;
}

function fmt(
  value,
  digits=2
){

  const n =
    safeNumber(value);

  return n === null
    ? "-"
    : n.toFixed(digits);
}

function yen(value){

  return (
    Number(value || 0)
      .toLocaleString("ja-JP")
    +
    "円"
  );
}

function clamp(
  value,
  min,
  max
){

  return Math.max(
    min,
    Math.min(
      max,
      value
    )
  );
}

function norm(
  value,
  low,
  high
){

  if(
    high <= low
  ){
    return .5;
  }

  return clamp(
    (value-low) /
    (high-low),
    0,
    1
  );
}

async function getJSON(url){

  const controller =
    new AbortController();

  const timer =
    setTimeout(
      ()=>controller.abort(),
      15000
    );

  try{

    const response =
      await fetch(
        url,
        {
          signal:
            controller.signal,

          cache:
            "no-store"
        }
      );

    const data =
      await response.json();

    if(
      !response.ok ||
      !data.ok
    ){

      throw new Error(
        data.error ||
        `HTTP ${response.status}`
      );
    }

    return data;

  }finally{

    clearTimeout(timer);
  }
}

/* =========================
   履歴保存
========================= */

function getHistory(){

  try{

    return JSON.parse(
      localStorage.getItem(
        "boat_ai_predictions"
      ) || "[]"
    );

  }catch{

    return [];
  }
}

function saveHistory(history){

  localStorage.setItem(
    "boat_ai_predictions",
    JSON.stringify(history)
  );
}

function alreadySaved(
  date,
  jcd,
  rno
){

  return getHistory()
    .some(
      item =>

        String(item.date) ===
          String(date)

        &&

        String(item.jcd) ===
          String(jcd)

        &&

        Number(item.rno) ===
          Number(rno)

        &&

        String(
          item.version || ""
        ) ===
          "6.6.6"
    );
}

/* =========================
   直前情報
========================= */

function mergeBefore(
  racers,
  beforeData
){

  return racers.map(
    racer=>{

      const live =
        beforeData
          ?.racers
          ?.find(
            x =>
              Number(x.lane) ===
              Number(racer.lane)
          );

      return {

        ...racer,

        before:{

          course:
            live?.course ??
            null,

          exhibitionTime:
            live?.exhibitionTime ??
            null,

          exhibitionST:
            live?.exhibitionST ??
            null,

          tilt:
            live?.tilt ??
            null
        }
      };
    }
  );
}

/* =========================
   採点
========================= */

const COMPONENT_NAMES = {

  lane:
    "枠・コース基本力",

  class:
    "級別",

  national:
    "全国勝率",

  local:
    "当地勝率",

  st:
    "平均ST",

  motor:
    "モーター",

  exhibition:
    "展示タイム",

  exhibitionST:
    "展示ST",

  course:
    "展示コース"
};

function scoreComponents(
  racer,
  allRacers
){

  const c = {

    lane:0,
    class:0,
    national:0,
    local:0,
    st:0,
    motor:0,
    exhibition:0,
    exhibitionST:0,
    course:0
  };

  const laneScore = {
    1:25,
    2:19,
    3:16,
    4:13,
    5:8,
    6:5
  };

  c.lane =
    laneScore[
      racer.lane
    ] || 0;

  const classScore = {
    A1:15,
    A2:12,
    B1:7,
    B2:3
  };

  c.class =
    classScore[
      racer.class
    ] || 0;

  const national =
    safeNumber(
      racer.national?.winRate
    );

  if(
    national !== null
  ){

    c.national =
      Math.min(
        18,
        national * 2.25
      );
  }

  const local =
    safeNumber(
      racer.local?.winRate
    );

  if(
    local !== null
  ){

    c.local =
      Math.min(
        10,
        local * 1.25
      );
  }

  const avgST =
    safeNumber(
      racer.avgST
    );

  if(
    avgST !== null
  ){

    if(avgST <= .12){
      c.st = 8;
    }

    else if(avgST <= .14){
      c.st = 7;
    }

    else if(avgST <= .16){
      c.st = 5;
    }

    else if(avgST <= .18){
      c.st = 3;
    }

    else{
      c.st = 1;
    }
  }

  const motor =
    safeNumber(
      racer.motor?.secondRate
    );

  if(
    motor !== null
  ){

    c.motor =
      Math.min(
        10,
        motor / 5
      );
  }

  const exhibitionTimes =
    allRacers
      .map(
        r =>
          safeNumber(
            r.before
              ?.exhibitionTime
          )
      )
      .filter(
        x =>
          x !== null
      );

  const exhibition =
    safeNumber(
      racer.before?.exhibitionTime
    );

  if(
    exhibition !== null &&
    exhibitionTimes.length
  ){

    const fastest =
      Math.min(
        ...exhibitionTimes
      );

    const diff =
      exhibition -
      fastest;

    if(diff <= .01){
      c.exhibition = 8;
    }

    else if(diff <= .03){
      c.exhibition = 7;
    }

    else if(diff <= .05){
      c.exhibition = 5;
    }

    else if(diff <= .08){
      c.exhibition = 3;
    }

    else{
      c.exhibition = 1;
    }
  }

  const exhibitionST =
    safeNumber(
      racer.before?.exhibitionST
    );

  if(
    exhibitionST !== null
  ){

    if(exhibitionST <= .05){
      c.exhibitionST = 4;
    }

    else if(exhibitionST <= .10){
      c.exhibitionST = 3;
    }

    else if(exhibitionST <= .15){
      c.exhibitionST = 2;
    }

    else{
      c.exhibitionST = 1;
    }
  }

  const course =
    safeNumber(
      racer.before?.course
    );

  if(course === 1){

    c.course = 2;

  }else if(
    course !== null &&
    course <= 3
  ){

    c.course = 1;
  }

  return c;
}

/* =========================
   学習
========================= */

function getTrainableHistory(
  asOfDate=null
){

  return getHistory()
    .filter(
      item =>{

        if(
          !item.result?.finished
        ){
          return false;
        }

        if(
          !Array.isArray(
            item.racersDetailed
          ) ||
          item.racersDetailed.length !== 6
        ){
          return false;
        }

        if(
          !Array.isArray(
            item.result.winningLanes
          ) ||
          item.result.winningLanes.length < 3
        ){
          return false;
        }

        if(
          asOfDate &&
          String(item.date) >=
          String(asOfDate)
        ){
          return false;
        }

        return true;
      }
    );
}

function calculateLearnedWeights(
  asOfDate=null
){

  const history =
    getTrainableHistory(
      asOfDate
    );

  const base = {};

  for(
    const key of
    Object.keys(
      COMPONENT_NAMES
    )
  ){

    base[key] = 1;
  }

  if(
    history.length < 10
  ){

    return {

      active:false,

      races:
        history.length,

      weights:
        base
    };
  }

  const signals = {};

  for(
    const key of
    Object.keys(
      COMPONENT_NAMES
    )
  ){

    signals[key] = [];
  }

  for(
    const item of history
  ){

    const winners =
      new Set(
        item.result
          .winningLanes
          .slice(0,3)
          .map(Number)
      );

    for(
      const key of
      Object.keys(
        COMPONENT_NAMES
      )
    ){

      const allValues =
        item.racersDetailed
          .map(
            r =>
              Number(
                r.components?.[key] ||
                0
              )
          );

      const winnerValues =
        item.racersDetailed
          .filter(
            r =>
              winners.has(
                Number(r.lane)
              )
          )
          .map(
            r =>
              Number(
                r.components?.[key] ||
                0
              )
          );

      if(
        !winnerValues.length
      ){
        continue;
      }

      const allAverage =
        allValues.reduce(
          (a,b)=>a+b,
          0
        )
        /
        allValues.length;

      const winnerAverage =
        winnerValues.reduce(
          (a,b)=>a+b,
          0
        )
        /
        winnerValues.length;

      if(
        allAverage > 0
      ){

        signals[key].push(
          (
            winnerAverage -
            allAverage
          )
          /
          allAverage
        );
      }
    }
  }

  const weights = {};

  for(
    const key of
    Object.keys(
      COMPONENT_NAMES
    )
  ){

    const array =
      signals[key];

    if(
      !array.length
    ){

      weights[key] = 1;

      continue;
    }

    const average =
      array.reduce(
        (a,b)=>a+b,
        0
      )
      /
      array.length;

    const adjustment =
      clamp(
        average * .35,
        -.15,
        .15
      );

    weights[key] =
      Math.round(
        (1+adjustment)*1000
      )
      /
      1000;
  }

  return {

    active:true,

    races:
      history.length,

    weights
  };
}

/* =========================
   着順別
========================= */

const ROLE_WEIGHTS = {

  first:{

    lane:1.25,
    class:.90,
    national:1.15,
    local:.75,
    st:1.25,
    motor:.70,
    exhibition:.80,
    exhibitionST:.90,
    course:1.15
  },

  second:{

    lane:.75,
    class:.85,
    national:.90,
    local:1.05,
    st:.85,
    motor:1.15,
    exhibition:1.15,
    exhibitionST:1,
    course:.75
  },

  third:{

    lane:.45,
    class:.65,
    national:.75,
    local:.95,
    st:.65,
    motor:1.20,
    exhibition:1.10,
    exhibitionST:.90,
    course:.50
  }
};

function roleScore(
  components,
  learnedWeights,
  role
){

  let score = 0;

  for(
    const key of
    Object.keys(
      COMPONENT_NAMES
    )
  ){

    score +=

      Number(
        components[key] || 0
      )

      *

      Number(
        learnedWeights[key] || 1
      )

      *

      Number(
        ROLE_WEIGHTS[role][key] || 1
      );
  }

  return Math.round(
    score*10
  ) / 10;
}

function overallScore(
  components,
  learnedWeights
){

  let score = 0;

  for(
    const key of
    Object.keys(
      COMPONENT_NAMES
    )
  ){

    score +=
      Number(
        components[key] || 0
      )
      *
      Number(
        learnedWeights[key] || 1
      );
  }

  return Math.round(
    score*10
  ) / 10;
}

/* =========================
   120通り
========================= */

function makeAllCombinations(){

  const result = [];

  for(
    let first=1;
    first<=6;
    first++
  ){

    for(
      let second=1;
      second<=6;
      second++
    ){

      if(
        second === first
      ){
        continue;
      }

      for(
        let third=1;
        third<=6;
        third++
      ){

        if(
          third === first ||
          third === second
        ){
          continue;
        }

        result.push(
          `${first}-${second}-${third}`
        );
      }
    }
  }

  return result;
}

function strength(score){

  return Math.exp(
    score / 20
  );
}

function firstWinShare(
  lane,
  racers
){

  const total =
    racers.reduce(
      (sum,r)=>
        sum +
        strength(
          r.firstScore
        ),
      0
    );

  const racer =
    racers.find(
      r =>
        r.lane === lane
    );

  if(
    !racer ||
    !total
  ){
    return 0;
  }

  return (
    strength(
      racer.firstScore
    )
    /
    total
  );
}

function trifectaProbability(
  first,
  second,
  third,
  racers
){

  const r1 =
    racers.find(
      r =>
        r.lane === first
    );

  const r2 =
    racers.find(
      r =>
        r.lane === second
    );

  const r3 =
    racers.find(
      r =>
        r.lane === third
    );

  if(
    !r1 ||
    !r2 ||
    !r3
  ){
    return 0;
  }

  const firstTotal =
    racers.reduce(
      (sum,r)=>
        sum +
        strength(
          r.firstScore
        ),
      0
    );

  const p1 =
    strength(
      r1.firstScore
    )
    /
    firstTotal;

  const secondCandidates =
    racers.filter(
      r =>
        r.lane !== first
    );

  const secondTotal =
    secondCandidates.reduce(
      (sum,r)=>
        sum +
        strength(
          r.secondScore
        ),
      0
    );

  const p2 =
    strength(
      r2.secondScore
    )
    /
    secondTotal;

  const thirdCandidates =
    racers.filter(
      r =>
        r.lane !== first &&
        r.lane !== second
    );

  const thirdTotal =
    thirdCandidates.reduce(
      (sum,r)=>
        sum +
        strength(
          r.thirdScore
        ),
      0
    );

  const p3 =
    strength(
      r3.thirdScore
    )
    /
    thirdTotal;

  return p1*p2*p3;
}

function makeOddsMap(
  oddsData
){

  const map = {};

  for(
    const item of
    oddsData?.odds || []
  ){

    map[
      item.combination
    ] =
      Number(
        item.odds
      );
  }

  return map;
}

function evaluateBets(
  racers,
  oddsData
){

  const oddsMap =
    makeOddsMap(
      oddsData
    );

  const candidates = [];

  for(
    const combination of
    makeAllCombinations()
  ){

    const [
      first,
      second,
      third
    ] =
      combination
        .split("-")
        .map(Number);

    const odds =
      safeNumber(
        oddsMap[
          combination
        ]
      );

    if(
      odds === null
    ){
      continue;
    }

    const firstRacer =
      racers.find(
        r => r.lane === first
      );

    const secondRacer =
      racers.find(
        r => r.lane === second
      );

    const thirdRacer =
      racers.find(
        r => r.lane === third
      );

    const probability =
      trifectaProbability(
        first,
        second,
        third,
        racers
      );

    candidates.push({

      combination,

      first,
      second,
      third,

      firstRole:
        firstRacer.firstScore,

      secondRole:
        secondRacer.secondScore,

      thirdRole:
        thirdRacer.thirdScore,

      probability,

      odds,

      ev:
        probability *
        odds
    });
  }

  if(
    !candidates.length
  ){
    return [];
  }

  const maxFirst =
    Math.max(
      ...candidates.map(
        x => x.firstRole
      ),
      1
    );

  const maxSecond =
    Math.max(
      ...candidates.map(
        x => x.secondRole
      ),
      1
    );

  const maxThird =
    Math.max(
      ...candidates.map(
        x => x.thirdRole
      ),
      1
    );

  const maxProbability =
    Math.max(
      ...candidates.map(
        x => x.probability
      ),
      .000001
    );

  const maxEV =
    Math.max(
      ...candidates.map(
        x =>
          Math.min(
            x.ev,
            3
          )
      ),
      .000001
    );

  for(
    const item of candidates
  ){

    const firstNorm =
      item.firstRole /
      maxFirst;

    const secondNorm =
      item.secondRole /
      maxSecond;

    const thirdNorm =
      item.thirdRole /
      maxThird;

    const probabilityNorm =
      item.probability /
      maxProbability;

    const evNorm =
      Math.log1p(
        Math.min(
          item.ev,
          3
        )
      )
      /
      Math.log1p(
        maxEV
      );

    item.totalScore =
      (
        firstNorm * .20
        +
        secondNorm * .12
        +
        thirdNorm * .08
        +
        probabilityNorm * .40
        +
        evNorm * .20
      )
      *
      100;

    item.totalScore =
      Math.round(
        item.totalScore*10
      ) / 10;
  }

  return candidates.sort(
    (a,b)=>
      b.totalScore -
      a.totalScore
  );
}

/* =========================
   S/A/B
========================= */

function getConfidence(
  racers
){

  const ranking =
    racers
      .slice()
      .sort(
        (a,b)=>
          b.firstScore -
          a.firstScore
      );

  if(
    ranking.length < 3
  ){
    return "B";
  }

  const gap2 =
    ranking[0].firstScore -
    ranking[1].firstScore;

  const gap3 =
    ranking[0].firstScore -
    ranking[2].firstScore;

  if(
    gap2 >= 9 &&
    gap3 >= 14
  ){
    return "S";
  }

  if(
    gap2 >= 4.5
  ){
    return "A";
  }

  return "B";
}

/* =========================
   V6.6.6 S勝負判定
========================= */

function roleStability(
  racers,
  field
){

  const sorted =
    racers
      .slice()
      .sort(
        (a,b)=>
          b[field] -
          a[field]
      );

  if(
    sorted.length < 6
  ){
    return 0;
  }

  const top3 =
    (
      sorted[0][field] +
      sorted[1][field] +
      sorted[2][field]
    ) / 3;

  const bottom3 =
    (
      sorted[3][field] +
      sorted[4][field] +
      sorted[5][field]
    ) / 3;

  if(
    top3 <= 0
  ){
    return 0;
  }

  return clamp(
    (
      (
        top3 -
        bottom3
      )
      /
      top3
    )
    *
    220,
    0,
    100
  );
}

function beforeCoverage(
  racers
){

  let available = 0;
  let total = 0;

  for(
    const racer of racers
  ){

    const values = [

      racer.before
        ?.exhibitionTime,

      racer.before
        ?.exhibitionST,

      racer.before
        ?.course
    ];

    for(
      const value of values
    ){

      total++;

      if(
        safeNumber(value) !==
        null
      ){
        available++;
      }
    }
  }

  return total
    ? available / total
    : 0;
}

function makeSDecision(
  confidence,
  racers,
  allBets
){

  if(
    confidence !== "S"
  ){

    return {

      status:"NONE",

      label:
        `${confidence}評価`,

      score:0,

      metrics:null,

      reasons:[]
    };
  }

  const firstRanking =
    racers
      .slice()
      .sort(
        (a,b)=>
          b.firstScore -
          a.firstScore
      );

  const topLane =
    firstRanking[0].lane;

  const firstShare =
    firstWinShare(
      topLane,
      racers
    );

  const firstGap =
    firstRanking[0].firstScore -
    firstRanking[1].firstScore;

  const top6Probability =
    allBets
      .slice(0,6)
      .reduce(
        (sum,b)=>
          sum +
          Number(
            b.probability || 0
          ),
        0
      );

  const secondStable =
    roleStability(
      racers,
      "secondScore"
    );

  const thirdStable =
    roleStability(
      racers,
      "thirdScore"
    );

  const coverage =
    beforeCoverage(
      racers
    );

  const firstShareScore =
    norm(
      firstShare,
      .22,
      .42
    );

  const top6Score =
    norm(
      top6Probability,
      .12,
      .28
    );

  const gapScore =
    norm(
      firstGap,
      7,
      16
    );

  const secondScore =
    clamp(
      secondStable / 100,
      0,
      1
    );

  const thirdScore =
    clamp(
      thirdStable / 100,
      0,
      1
    );

  const coverageScore =
    clamp(
      coverage,
      0,
      1
    );

  const quality =
    (
      firstShareScore * .25
      +
      top6Score * .25
      +
      gapScore * .15
      +
      secondScore * .10
      +
      thirdScore * .10
      +
      coverageScore * .15
    )
    *
    100;

  const score =
    Math.round(
      quality*10
    ) / 10;

  const reasons = [];

  if(
    firstShare < .30
  ){

    reasons.push(
      "1着候補の優位度が弱い"
    );
  }

  if(
    top6Probability < .18
  ){

    reasons.push(
      "上位6点に確率が集中していない"
    );
  }

  if(
    firstGap < 9
  ){

    reasons.push(
      "1着候補の点差が小さい"
    );
  }

  if(
    secondStable < 35
  ){

    reasons.push(
      "2着候補がばらけている"
    );
  }

  if(
    thirdStable < 30
  ){

    reasons.push(
      "3着候補がばらけている"
    );
  }

  if(
    coverage < .55
  ){

    reasons.push(
      "展示データが不足"
    );
  }

  if(
    score < 68
  ){

    reasons.push(
      "総合安定スコアが基準未満"
    );
  }

  /*
    S勝負の最低条件
  */

  const battle =
    score >= 68
    &&
    firstShare >= .30
    &&
    top6Probability >= .18
    &&
    coverage >= .55;

  return {

    status:
      battle
        ? "BET"
        : "PASS",

    label:
      battle
        ? "🔥 S勝負"
        : "⚠️ S見送り",

    score,

    metrics:{

      firstShare,

      top6Probability,

      firstGap,

      secondStability:
        secondStable,

      thirdStability:
        thirdStable,

      beforeCoverage:
        coverage
    },

    reasons:
      battle

        ? [
            "1着候補が優勢",
            "上位買い目への確率集中を確認",
            "展示データ条件をクリア"
          ]

        : reasons
  };
}

/* =========================
   予想生成
========================= */

function buildPrediction(
  racers,
  oddsData,
  context
){

  const learned =
    calculateLearnedWeights(
      context.date
    );

  const modelRacers =
    racers.map(
      racer=>{

        const components =
          scoreComponents(
            racer,
            racers
          );

        return {

          ...racer,

          components,

          overallScore:
            overallScore(
              components,
              learned.weights
            ),

          firstScore:
            roleScore(
              components,
              learned.weights,
              "first"
            ),

          secondScore:
            roleScore(
              components,
              learned.weights,
              "second"
            ),

          thirdScore:
            roleScore(
              components,
              learned.weights,
              "third"
            )
        };
      }
    );

  const overallRanking =
    modelRacers
      .slice()
      .sort(
        (a,b)=>
          b.overallScore -
          a.overallScore
      );

  const firstRanking =
    modelRacers
      .slice()
      .sort(
        (a,b)=>
          b.firstScore -
          a.firstScore
      );

  const confidence =
    getConfidence(
      modelRacers
    );

  const allBets =
    evaluateBets(
      modelRacers,
      oddsData
    );

  const top15 =
    allBets.slice(
      0,
      15
    );

  const sDecision =
    makeSDecision(
      confidence,
      modelRacers,
      allBets
    );

  const allBetRanking =
    allBets.map(
      (bet,index)=>({

        rank:
          index + 1,

        combination:
          bet.combination,

        totalScore:
          bet.totalScore,

        probability:
          bet.probability,

        odds:
          bet.odds,

        ev:
          bet.ev
      })
    );

  const snapshot = {

    id:
      `${context.date}-${context.jcd}-${context.rno}-${Date.now()}-${Math.random().toString(36).slice(2,7)}`,

    version:
      "6.6.6",

    createdAt:
      new Date()
        .toISOString(),

    date:
      context.date,

    jcd:
      context.jcd,

    venue:
      context.venue,

    rno:
      Number(
        context.rno
      ),

    confidence,

    sDecision,

    evaluatedCount:
      allBets.length,

    learningRaces:
      learned.races,

    learnedWeights:
      learned.weights,

    racersDetailed:
      modelRacers.map(
        r=>({

          lane:r.lane,

          name:r.name,

          class:r.class,

          components:{
            ...r.components
          },

          overallScore:
            r.overallScore,

          firstScore:
            r.firstScore,

          secondScore:
            r.secondScore,

          thirdScore:
            r.thirdScore
        })
      ),

    bets:
      top15.map(
        b=>({

          combination:
            b.combination,

          probability:
            b.probability,

          odds:
            b.odds,

          ev:
            b.ev,

          totalScore:
            b.totalScore,

          firstRole:
            b.firstRole,

          secondRole:
            b.secondRole,

          thirdRole:
            b.thirdRole
        })
      ),

    allBetRanking
  };

  return {

    learned,
    modelRacers,
    overallRanking,
    firstRanking,
    confidence,
    sDecision,
    allBets,
    top15,
    snapshot
  };
}

async function getPredictionData(
  date,
  jcd,
  rno,
  venueName
){

  const race =
    await getJSON(
      `/api/race?hd=${date}&jcd=${jcd}&rno=${rno}`
    );

  if(
    !race.racers?.length
  ){
    return null;
  }

  let before = {
    racers:[]
  };

  let odds = {
    odds:[]
  };

  try{

    before =
      await getJSON(
        `/api/before?hd=${date}&jcd=${jcd}&rno=${rno}`
      );

  }catch{}

  try{

    odds =
      await getJSON(
        `/api/odds?hd=${date}&jcd=${jcd}&rno=${rno}`
      );

  }catch{}

  if(
    !odds.odds?.length
  ){
    return null;
  }

  const merged =
    mergeBefore(
      race.racers,
      before
    );

  return buildPrediction(
    merged,
    odds,
    {
      date,
      jcd,

      venue:
        venueName ||
        race.venue ||
        jcd,

      rno
    }
  );
}

async function scanSRaces(){

  const jcd =
    venueSelect.value;

  if(!jcd){

    $("sScanStatus").textContent =
      "開催場を選択してください";

    return;
  }

  if(
    !currentVenueRaces.length
  ){

    $("sScanStatus").textContent =
      "先にレース一覧を取得してください";

    return;
  }

  const button =
    $("scanSRaces");

  button.disabled = true;

  currentSRaces = [];

  const date =
    apiDate();

  const venueName =
    venueSelect.options[
      venueSelect.selectedIndex
    ]?.textContent
      ?.split("（")[0]
    ||
    jcd;

  let battleCount = 0;
  let passCount = 0;
  let unavailable = 0;

  for(
    let i=0;
    i<currentVenueRaces.length;
    i++
  ){

    const rno =
      Number(
        currentVenueRaces[i].rno
      );

    $("sScanStatus").textContent =

          );

        }

    try{

          jcd,

function makeSavedItem(
  snapshot,
  unit,
  mode
){

  const item =
    JSON.parse(
      JSON.stringify(
        snapshot
      )
    );

  item.betUnit = unit;

  item.saveMode = mode;

  item.result = null;

  return item;
}

function saveAllSRaces(){

    );

    !battleRaces.length

  }

    Number(

  if(

  ){

    $("sSaveStatus").textContent =
      "100円以上で入力してください";

  let saved = 0;
  let duplicate = 0;

  for(

      race.prediction
        .snapshot;

    if(
      alreadySaved(

  resetHistoryView();

========================= */

function rankOfLane(
  racers,
  lane,
  field
){

  const sorted =
    racers
      .slice()
      .sort(
        (a,b)=>
          Number(b[field]) -
          Number(a[field])
      );

  const index =
    sorted.findIndex(
      r =>
        Number(r.lane) ===
        Number(lane)
    );

  return index >= 0
    ? index+1
    : null;
}

function strategyResult(
  bets,
  winning,
  payout,
  unit,
  count
){

  const selected =
    bets.slice(
      0,
      Math.min(
        count,
        bets.length
      )
    );

  const hit =
    selected.some(
      b =>
        b.combination ===
        winning
    );

  const stake =
    unit *
    selected.length;

  const returnAmount =
    hit
      ? Math.round(
          payout *
          (
            unit /
            100
          )
        )
      : 0;

  return {

    hit,

    stake,

    returnAmount,

    profit:
      returnAmount -
      stake,

    roi:
      stake
        ? returnAmount /
          stake *
          100
        : 0
  };
}

function getActualCombinationRank(
  item,
  winning
){

  if(
    Array.isArray(
      item.allBetRanking
    )
  ){

    const found =
      item.allBetRanking
        .find(
          x =>
            x.combination ===
            winning
        );

    if(found){

      return {

        rank:
          found.rank,

        total:
          item.allBetRanking.length,

        totalScore:
          found.totalScore,

        probability:
          found.probability,

        odds:
          found.odds,

        ev:
          found.ev
      };
    }
  }

  return {
    rank:null,
    total:120
  };
}

async function checkResult(item){

  const data =
    await getJSON(
      `/api/result?hd=${item.date}&jcd=${item.jcd}&rno=${item.rno}`
    );

  if(
    !data.finished
  ){

    return {
      finished:false
    };
  }

  const winning =
    data.combination;

  const winningLanes =
    Array.isArray(
      data.winningLanes
    ) &&
    data.winningLanes.length >= 3

      ? data.winningLanes
          .slice(0,3)
          .map(Number)

      : winning
          .split("-")
          .map(Number);

  const bets =
    item.bets || [];

  const unit =
    Number(
      item.betUnit || 100
    );

  const p6 =
    strategyResult(
      bets,
      winning,
      data.payout,
      unit,
      6
    );

  const p10 =
    strategyResult(
      bets,
      winning,
      data.payout,
      unit,
      10
    );

  const p15 =
    strategyResult(
      bets,
      winning,
      data.payout,
      unit,
      15
    );

  const racers =
    item.racersDetailed ||
    [];

  return {

    finished:true,

    checkedAt:
      new Date()
        .toISOString(),

    combination:
      winning,

    winningLanes,

    payoutPer100:
      data.payout,

    method:
      data.method,

    actualRank:
      getActualCombinationRank(
        item,
        winning
      ),

    comparison:{
      p6,
      p10,
      p15
    },

    diagnostics:{

      overall:[

        rankOfLane(
          racers,
          winningLanes[0],
          "overallScore"
        ),

        rankOfLane(
          racers,
          winningLanes[1],
          "overallScore"
        ),

        rankOfLane(
          racers,
          winningLanes[2],
          "overallScore"
        )
      ],

      role:{

        first:
          rankOfLane(
            racers,
            winningLanes[0],
            "firstScore"
          ),

        second:
          rankOfLane(
            racers,
            winningLanes[1],
            "secondScore"
          ),

        third:
          rankOfLane(
            racers,
            winningLanes[2],
            "thirdScore"
          )
      }
    },

    hit:
      p15.hit,

    totalStake:
      p15.stake,

    returnAmount:
      p15.returnAmount,

    profit:
      p15.profit,

    roi:
      p15.roi
  };
}

async function checkAllResults(
  automatic=false
){

  const history =
    getHistory();

  const targets =
    history
      .map(
        (item,index)=>({
          item,
          index
        })
      )
      .filter(
        x =>
          !x.item.result?.finished
      );

  if(
    !targets.length
  ){

    if(automatic){

      $("autoCheckStatus")
        .textContent =
          "未確認レースはありません";
    }

    return;
  }

  let updated = 0;

  for(
    let i=0;
    i<targets.length;
    i++
  ){

    if(automatic){

      $("autoCheckStatus")
        .textContent =
          `結果確認 ${i+1}/${targets.length}`;
    }

    try{

      const result =
        await checkResult(
          targets[i].item
        );

      history[
        targets[i].index
      ].result =
        result;

      if(
        result.finished
      ){
        updated++;
      }

    }catch{}
  }

  saveHistory(history);

  renderHistory();

  if(automatic){

    $("autoCheckStatus")
      .textContent =
        updated
          ? `${updated}R更新`
          : "新しい結果なし";
  }
}

/* =========================
   実績比較
========================= */

function comparisonData(
  key,
  mode="all"
){

  const items =
    getHistory()
      .filter(
        item =>{

          if(
            !item.result
              ?.finished
          ){
            return false;
          }

          if(
            !item.result
              ?.comparison
              ?.[key]
          ){
            return false;
          }

          if(
            mode === "battle"
          ){

            return (
              item.sDecision
                ?.status ===
              "BET"
            );
          }

          return true;
        }
      );

  let hits = 0;
  let stake = 0;
  let returns = 0;

  for(
    const item of items
  ){

    const result =
      item.result
        .comparison[key];

    if(result.hit){
      hits++;
    }

    stake +=
      result.stake || 0;

    returns +=
      result.returnAmount || 0;
  }

  return {

    races:
      items.length,

    hits,

    hitRate:
      items.length
        ? hits /
          items.length *
          100
        : 0,

    stake,

    returns,

    profit:
      returns -
      stake,

    roi:
      stake
        ? returns /
          stake *
          100
        : 0
  };
}

function comparisonHtml(
  title,

){

      ${yen(data.profit)}

      <br>

      回収率：

  `;
}

                ${COMPONENT_NAMES[key]}
              </span>

              <span>
                ×${value.toFixed(3)}
              </span>

            </div>

          </div>

        `
      )
      .join("");
}

/* =========================
   履歴
========================= */

function isHistoryHit(item){

  return Boolean(
    item.result
      ?.comparison
      ?.p15
      ?.hit
  );
}

function historyMatches(
  item
){

  if(
    historyFilter ===
    "battle" &&
    item.sDecision?.status !==
    "BET"
  ){
    return false;
  }

  if(
    historyFilter ===
    "pass" &&
    item.sDecision?.status !==
    "PASS"
  ){
    return false;
  }

  if(
    historyFilter ===
    "s" &&
    item.confidence !==
    "S"
  ){
    return false;
  }

  if(
    historyFilter ===
    "hit" &&
    !isHistoryHit(item)
  ){
    return false;
  }

  if(
    historyFilter ===
    "miss"
  ){

    if(
      !item.result?.finished ||
      isHistoryHit(item)
    ){
      return false;
    }
  }

  if(
    historyPeriod ===
    "today" &&
    String(item.date) !==
    todayApi()
  ){
    return false;
  }

  if(
    historyPeriod ===
    "yesterday" &&
    String(item.date) !==
    yesterdayApi()
  ){
    return false;
  }

  return true;
}

function compactResultText(item){

  if(
    !item.result?.finished
  ){

    return "結果待ち";
  }

  const c =
    item.result.comparison;

  return `
    結果 ${item.result.combination}
    /
    AI ${
      item.result.actualRank?.rank ||
      "-"
    }位
    /
    6点${c?.p6?.hit ? "○" : "×"}
    10点${c?.p10?.hit ? "○" : "×"}
    15点${c?.p15?.hit ? "○" : "×"}
  `;
}

function historyDetailHtml(
  item
){

  let resultHtml = `
    <div class="result">

      結果未確認

      ${
        item.id
          ? `
            <br><br>
            <button
              onclick="checkOne('${item.id}')"
            >
              結果を確認
            </button>
          `
          : ""
      }

    </div>
  `;

  if(
    item.result?.finished
  ){

    const r =
      item.result;

    const c =
      r.comparison;

    const d =
      r.diagnostics;

    const ar =
      r.actualRank;

    resultHtml = `
      <div class="result">

        実結果：
        <strong>
          ${r.combination}
        </strong>

        <br>

        払戻：
        ${yen(r.payoutPer100)}

        ${
          ar?.rank
            ? `
              <div class="actual-rank">

                実結果のAI評価

                <br>

                <strong>
                  ${ar.rank}位 / ${ar.total}通り
                </strong>

              </div>
            `
            : ""
        }

        <br>

        6点：
        ${c?.p6?.hit ? "🎯" : "×"}
        ${yen(c?.p6?.profit)}

        <br>

        10点：
        ${c?.p10?.hit ? "🎯" : "×"}
        ${yen(c?.p10?.profit)}

        <br>

        15点：
        ${c?.p15?.hit ? "🎯" : "×"}
        ${yen(c?.p15?.profit)}

        ${
          d
            ? `
              <div class="diagnostic">

                1着：
                総合${d.overall[0]}位 /
                1着適性${d.role.first}位

                <br>

                2着：
                総合${d.overall[1]}位 /
                2着適性${d.role.second}位

                <br>

                3着：
                総合${d.overall[2]}位 /
                3着適性${d.role.third}位

              </div>
            `
            : ""
        }

      </div>
    `;
  }

  return `
    <div class="history-meta">

      バージョン：
      ${item.version || "旧版"}

      <br>

      勝負度：
      ${item.confidence || "-"}

      <br>

      S判定：
      ${item.sDecision?.label || "-"}

      ${
        item.sDecision?.score
          ? `
            <br>
            S安定スコア：
            ${item.sDecision.score}
          `
          : ""
      }

      <br>

      保存点数：
      ${item.bets?.length || 0}

    </div>

    ${resultHtml}
  `;
}

function toggleHistory(id){

  if(
    expandedHistoryIds.has(id)
  ){

    expandedHistoryIds.delete(id);

  }else{

    expandedHistoryIds.add(id);
  }

  renderHistory();
}

function renderHistory(){

  renderComparisons();
  renderWeights();

  const history =
    getHistory();

  const entries =
    history
      .slice()
      .reverse()
      .filter(
        historyMatches
      );

  const visible =
    entries.slice(
      0,
      historyDisplayCount
    );

  $("historyCount").textContent =
    `該当 ${entries.length}件 / 表示 ${visible.length}件`;

  if(
    !visible.length
  ){

    historyBox.innerHTML = `
      <div class="status">
        履歴なし
      </div>
    `;

    $("loadMoreHistory")
      .style.display =
        "none";

    return;
  }

  historyBox.innerHTML =
    visible
      .map(
        (item,index)=>{

          const id =
            item.id ||
            `legacy-${index}`;

          const open =
            expandedHistoryIds
              .has(id);

          const status =
            item.sDecision
              ?.status;

          const badge =
            status === "BET"
              ? "🔥 S勝負"
              : status === "PASS"
                ? "⚠️ S見送り"
                : item.confidence ||
                  "-";

          return `
            <div class="
              history-item
              ${
                status === "BET"
                  ? "battle"
                  : status === "PASS"
                    ? "pass"
                    : ""
              }
            ">

              <div
                class="history-summary"
                onclick="toggleHistory('${id}')"
              >

                <div class="history-summary-top">

                  <div class="history-race">

                    ${item.date}
                    ${item.venue || item.jcd}
                    ${item.rno}R

                  </div>

                  <div class="
                    history-badge
                    ${
                      status === "BET"
                        ? "battle"
                        : status === "PASS"
                          ? "pass"
                          : ""
                    }
                  ">

                    ${badge}

                  </div>

                </div>

                <div class="history-compact">

                  ${compactResultText(item)}

                </div>

                <div class="history-arrow">

                  ${
                    open
                      ? "▲ 閉じる"
                      : "▼ 詳細"
                  }

                </div>

              </div>

              <div class="
                history-detail
                ${open ? "open" : ""}
              ">

                ${historyDetailHtml(item)}

              </div>

            </div>
          `;
        }
      )
      .join("");

  $("loadMoreHistory")
    .style.display =
      visible.length < entries.length
        ? "block"
        : "none";
}

/* =========================
   開催場
========================= */

async function loadVenues(){

  $("venueStatus").textContent =
    "取得中...";

  venueSelect.innerHTML =
    '<option value="">開催場を選択</option>';

  try{

    const data =
      await getJSON(
        `/api/venues?hd=${apiDate()}`
      );

    for(
      const venue of data.venues
    ){

      const option =
        document.createElement(
          "option"
        );

      option.value =
        venue.jcd;

      option.textContent =
        `${venue.name}（${venue.jcd}）`;

      venueSelect.appendChild(
        option
      );
    }

    $("venueStatus").textContent =
      `${data.venues.length}会場`;

  }catch(error){

    $("venueStatus").textContent =
      error.message;
  }
}

async function loadRaces(){

  const jcd =
    venueSelect.value;

  if(!jcd){
    return;
  }

  raceGrid.innerHTML = "";

  currentVenueRaces = [];

  currentSRaces = [];

  sRaceList.innerHTML = "";

  try{

    const data =
      await getJSON(
        `/api/venue?hd=${apiDate()}&jcd=${jcd}`
      );

    currentVenueRaces =
      data.races || [];

    $("raceStatus").textContent =
      `${data.venue} ${currentVenueRaces.length}R`;

    for(
      const race of
      currentVenueRaces
    ){

      const button =
        document.createElement(
          "button"
        );

      button.className =
        "race-btn";

      button.textContent =
        `${race.rno}R`;

      button.onclick =
        ()=>loadRace(
          race.rno,
          button,
          data.venue
        );

      raceGrid.appendChild(
        button
      );
    }

  }catch(error){

    $("raceStatus").textContent =
      error.message;
  }
}

async function loadRace(
  rno,
  button,
  venueName
){

  const jcd =
    venueSelect.value;

  document
    .querySelectorAll(
      ".race-btn"
    )
    .forEach(
      x =>
        x.classList.remove(
          "active"
        )
    );

  button?.classList.add(
    "active"
  );

  $("raceTitle").textContent =
    `${rno}R 選手データ`;

  $("racerStatus").textContent =
    "取得中...";

  predictionBox.innerHTML = "";

  try{

    const prediction =
      await getPredictionData(
        apiDate(),
        jcd,
        rno,
        venueName
      );

    if(
      !prediction
    ){

      $("racerStatus").textContent =
        "予想データなし";

      return;
    }

    renderRacers(
      prediction.modelRacers
    );

    renderPredictionBuilt(
      prediction
    );

    $("racerStatus").textContent =
      `${prediction.modelRacers.length}艇取得`;

  }catch(error){

    $("racerStatus").textContent =
      error.message;
  }
}

/* =========================
   イベント
========================= */

dateInput.value =
  todayLocal();

$("loadVenues")
  .onclick =
    loadVenues;

$("loadRaces")
  .onclick =
    loadRaces;

$("scanSRaces")
  .onclick =
    scanSRaces;

$("saveAllS")
  .onclick =
    saveAllSRaces;

$("savePrediction")
  .onclick =
    saveCurrentPrediction;

$("checkAllResults")
  .onclick =
    ()=>checkAllResults(false);

document
  .querySelectorAll(
    "[data-s-view]"
  )
  .forEach(
    button=>{

      button.onclick =
        ()=>{

          sView =
            button.dataset.sView;

          document
            .querySelectorAll(
              "[data-s-view]"
            )
            .forEach(
              x =>
                x.classList.remove(
                  "active"
                )
            );

          button.classList.add(
            "active"
          );

          renderSRaces();
        };
    }
  );

document
  .querySelectorAll(
    "[data-history-filter]"
  )
  .forEach(
    button=>{

      button.onclick =
        ()=>{

          historyFilter =
            button.dataset
              .historyFilter;

          historyDisplayCount = 5;

          document
            .querySelectorAll(
              "[data-history-filter]"
            )
            .forEach(
              x=>{

                x.classList.remove(
                  "active",
                  "battle-active",
                  "pass-active"
                );
              }
            );

          if(
            historyFilter ===
            "battle"
          ){

            button.classList.add(
              "battle-active"
            );

          }else if(
            historyFilter ===
            "pass"
          ){

            button.classList.add(
              "pass-active"
            );

          }else{

            button.classList.add(
              "active"
            );
          }

          renderHistory();
        };
    }
  );

document
  .querySelectorAll(
    "[data-history-period]"
  )
  .forEach(
    button=>{

      button.onclick =
        ()=>{

          historyPeriod =
            button.dataset
              .historyPeriod;

          historyDisplayCount = 5;

          document
            .querySelectorAll(
              "[data-history-period]"
            )
            .forEach(
              x =>
                x.classList.remove(
                  "active"
                )
            );

          button.classList.add(
            "active"
          );

          renderHistory();
        };
    }
  );

$("loadMoreHistory")
  .onclick =
    ()=>{

      historyDisplayCount += 5;

      renderHistory();
    };

$("clearHistory")
  .onclick =
    ()=>{

      if(
        confirm(
          "保存履歴を全部削除しますか？"
        )
      ){

        localStorage.removeItem(
          "boat_ai_predictions"
        );

        expandedHistoryIds.clear();

        renderHistory();
      }
    };

/* =========================
   起動
========================= */

renderHistory();

setTimeout(
  ()=>checkAllResults(true),
  1000
);

</script>
