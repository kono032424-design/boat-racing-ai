<script>

const $ = id =>
  document.getElementById(id);

const dateInput = $("date");
const venueSelect = $("venue");
const raceGrid = $("raceGrid");
const racersBox = $("racers");
const predictionBox = $("prediction");
const historyBox = $("history");
const summaryBox = $("summary");
const learningBox = $("learning");

const venueStatus = $("venueStatus");
const raceStatus = $("raceStatus");
const racerStatus = $("racerStatus");
const predictionStatus = $("predictionStatus");
const saveStatus = $("saveStatus");
const learningStatus = $("learningStatus");
const raceTitle = $("raceTitle");

let currentSnapshot = null;

/* 基本 */

function todayLocal(){

  const now =
    new Date();

  const y =
    now.getFullYear();

  const m =
    String(
      now.getMonth()+1
    ).padStart(2,"0");

  const d =
    String(
      now.getDate()
    ).padStart(2,"0");

  return `${y}-${m}-${d}`;
}

function apiDate(){

  return dateInput.value
    .replaceAll("-","");
}

async function getJSON(url){

  const controller =
    new AbortController();

  const timer =
    setTimeout(
      ()=>controller.abort(),
      12000
    );

  try{

    const response =
      await fetch(
        url,
        {
          signal:
            controller.signal,
          cache:"no-store"
        }
      );

    const data =
      await response.json();

    if(
      !response.ok ||
      !data.ok
    ){
      throw new Error(
        data.error ||
        `HTTP ${response.status}`
      );
    }

    return data;

  }finally{

    clearTimeout(timer);
  }
}

function safeNumber(v){

  if(
    v === null ||
    v === undefined ||
    v === ""
  ){
    return null;
  }

  const n =
    Number(v);

  return Number.isFinite(n)
    ? n
    : null;
}

function fmt(v,digits=2){

  const n =
    safeNumber(v);

  return n === null
    ? "-"
    : n.toFixed(digits);
}

function yen(v){

  return (
    Number(v || 0)
      .toLocaleString("ja-JP") +
    "円"
  );
}

/* 保存データ */

function getHistory(){

  try{

    return JSON.parse(
      localStorage.getItem(
        "boat_ai_predictions"
      ) || "[]"
    );

  }catch{

    return [];
  }
}

function saveHistory(history){

  localStorage.setItem(
    "boat_ai_predictions",
    JSON.stringify(history)
  );
}

/* 実績集計 */

function aggregate(items,keyFn){

  const map = {};

  for(
    const item of items
  ){

    const key =
      keyFn(item);

    if(!map[key]){

      map[key] = {
        key,
        races:0,
        hits:0,
        stake:0,
        returns:0
      };
    }

    const row =
      map[key];

    row.races++;

    if(item.result?.hit){
      row.hits++;
    }

    row.stake +=
      Number(
        item.result?.totalStake || 0
      );

    row.returns +=
      Number(
        item.result?.returnAmount || 0
      );
  }

  return Object.values(map)
    .map(
      row=>({

        ...row,

        hitRate:
          row.races
            ? (
                row.hits /
                row.races
              ) * 100
            : 0,

        profit:
          row.returns -
          row.stake,

        roi:
          row.stake
            ? (
                row.returns /
                row.stake
              ) * 100
            : 0
      })
    );
}

/*
 自動補正

 10R未満 → 0

 回収率
 150%以上 → +3
 120%以上 → +2
 105%以上 → +1

 80%未満 → -1
 60%未満 → -2

 1条件の最大補正 ±3

 会場＋R番号＋勝負度
 合計最大 ±6 に制限
*/

function performanceAdjustment(row){

  if(
    !row ||
    row.races < 10
  ){
    return 0;
  }

  if(row.roi >= 150){
    return 3;
  }

  if(row.roi >= 120){
    return 2;
  }

  if(row.roi >= 105){
    return 1;
  }

  if(row.roi < 60){
    return -2;
  }

  if(row.roi < 80){
    return -1;
  }

  return 0;
}

function getLearningAdjustment(
  venue,
  rno,
  confidence
){

  const finished =
    getHistory()
      .filter(
        item =>
          item.result?.finished
      );

  if(!finished.length){

    return {
      total:0,
      venue:0,
      race:0,
      confidence:0,
      active:false
    };
  }

  const venueRows =
    aggregate(
      finished,
      item =>
        item.venue ||
        item.jcd
    );

  const raceRows =
    aggregate(
      finished,
      item =>
        `${item.rno}R`
    );

  const confidenceRows =
    aggregate(
      finished,
      item =>
        item.confidence ||
        "不明"
    );

  const venueRow =
    venueRows.find(
      row =>
        row.key === venue
    );

  const raceRow =
    raceRows.find(
      row =>
        row.key === `${rno}R`
    );

  const confidenceRow =
    confidenceRows.find(
      row =>
        row.key === confidence
    );

  const venueAdj =
    performanceAdjustment(
      venueRow
    );

  const raceAdj =
    performanceAdjustment(
      raceRow
    );

  const confidenceAdj =
    performanceAdjustment(
      confidenceRow
    );

  let total =
    venueAdj +
    raceAdj +
    confidenceAdj;

  /*
    学習補正が強くなりすぎないよう制限
  */

  total =
    Math.max(
      -6,
      Math.min(
        6,
        total
      )
    );

  return {
    total,
    venue:venueAdj,
    race:raceAdj,
    confidence:
      confidenceAdj,

    active:
      total !== 0
  };
}

/* 直前情報 */

function mergeBefore(
  racers,
  beforeData
){

  return racers.map(
    racer=>{

      const live =
        beforeData?.racers?.find(
          x =>
            Number(x.lane) ===
            Number(racer.lane)
        );

      return {

        ...racer,

        before:{

          course:
            live?.course ??
            null,

          exhibitionTime:
            live?.exhibitionTime ??
            null,

          exhibitionST:
            live?.exhibitionST ??
            null,

          tilt:
            live?.tilt ??
            null
        }
      };
    }
  );
}

/* 基本AI */

function baseAiScore(
  racer,
  allRacers
){

  let score = 0;

  const laneScore = {
    1:25,
    2:19,
    3:16,
    4:13,
    5:8,
    6:5
  };

  score +=
    laneScore[racer.lane] || 0;

  const classScore = {
    A1:15,
    A2:12,
    B1:7,
    B2:3
  };

  score +=
    classScore[racer.class] || 0;

  const national =
    safeNumber(
      racer.national?.winRate
    );

  if(national !== null){

    score +=
      Math.min(
        18,
        national * 2.25
      );
  }

  const local =
    safeNumber(
      racer.local?.winRate
    );

  if(local !== null){

    score +=
      Math.min(
        10,
        local * 1.25
      );
  }

  const avgST =
    safeNumber(
      racer.avgST
    );

  if(avgST !== null){

    if(avgST <= .12){
      score += 8;
    }

    else if(avgST <= .14){
      score += 7;
    }

    else if(avgST <= .16){
      score += 5;
    }

    else if(avgST <= .18){
      score += 3;
    }

    else{
      score += 1;
    }
  }

  const motor =
    safeNumber(
      racer.motor?.secondRate
    );

  if(motor !== null){

    score +=
      Math.min(
        10,
        motor / 5
      );
  }

  const times =
    allRacers
      .map(
        r =>
          safeNumber(
            r.before?.exhibitionTime
          )
      )
      .filter(
        n =>
          n !== null
      );

  const exhibition =
    safeNumber(
      racer.before?.exhibitionTime
    );

  if(
    exhibition !== null &&
    times.length
  ){

    const fastest =
      Math.min(
        ...times
      );

    const diff =
      exhibition -
      fastest;

    if(diff <= .01){
      score += 8;
    }

    else if(diff <= .03){
      score += 7;
    }

    else if(diff <= .05){
      score += 5;
    }

    else if(diff <= .08){
      score += 3;
    }

    else{
      score += 1;
    }
  }

  const exhibitionST =
    safeNumber(
      racer.before?.exhibitionST
    );

  if(exhibitionST !== null){

    if(exhibitionST <= .05){
      score += 4;
    }

    else if(exhibitionST <= .10){
      score += 3;
    }

    else if(exhibitionST <= .15){
      score += 2;
    }

    else{
      score += 1;
    }
  }

  const course =
    safeNumber(
      racer.before?.course
    );

  if(course === 1){

    score += 2;

  }else if(
    course !== null &&
    course <= 3
  ){

    score += 1;
  }

  return Math.round(
    score * 10
  ) / 10;
}

/*
 学習補正はレース全体の信頼度へ使用。
 艇ごとの順位を無理に変えず、
 予想確率の強弱を調整する。
*/

function strength(
  score,
  learningAdjustment
){

  const adjustedScore =
    score +
    learningAdjustment;

  return Math.exp(
    adjustedScore / 18
  );
}

function trifectaProbability(
  first,
  second,
  third,
  scored,
  learningAdjustment
){

  const racers =
    scored.map(
      r=>({

        lane:r.lane,

        strength:
          strength(
            r.score,
            learningAdjustment
          )
      })
    );

  const total1 =
    racers.reduce(
      (sum,r)=>
        sum+r.strength,
      0
    );

  const r1 =
    racers.find(
      r =>
        r.lane===first
    );

  const r2 =
    racers.find(
      r =>
        r.lane===second
    );

  const r3 =
    racers.find(
      r =>
        r.lane===third
    );

  if(
    !r1 ||
    !r2 ||
    !r3
  ){

    return 0;
  }

  const p1 =
    r1.strength /
    total1;

  const total2 =
    total1 -
    r1.strength;

  const p2 =
    r2.strength /
    total2;

  const total3 =
    total2 -
    r2.strength;

  const p3 =
    r3.strength /
    total3;

  return (
    p1 *
    p2 *
    p3
  );
}

function getMarks(sorted){

  const marks = {};

  if(sorted[0]){
    marks[
      sorted[0].lane
    ] = "◎";
  }

  if(sorted[1]){
    marks[
      sorted[1].lane
    ] = "○";
  }

  if(sorted[2]){
    marks[
      sorted[2].lane
    ] = "▲";
  }

  return marks;
}

function getConfidence(sorted){

  if(sorted.length < 3){
    return "B";
  }

  const top =
    sorted[0].score;

  const gap2 =
    sorted[0].score -
    sorted[1].score;

  const gap3 =
    sorted[0].score -
    sorted[2].score;

  if(
    top >= 82 &&
    gap2 >= 8 &&
    gap3 >= 14
  ){
    return "S";
  }

  if(
    top >= 68 &&
    gap2 >= 4
  ){
    return "A";
  }

  return "B";
}

function makeCandidates(
  scored
){

  const top =
    scored
      .slice(0,4)
      .map(
        r =>
          r.lane
      );

  const list = [];

  for(const a of top){

    for(const b of top){

      if(a===b){
        continue;
      }

      for(const c of top){

        if(
          c===a ||
          c===b
        ){
          continue;
        }

        list.push(
          `${a}-${b}-${c}`
        );
      }
    }
  }

  return list;
}

function makeOddsMap(
  oddsData
){

  const map = {};

  for(
    const item of
    oddsData?.odds || []
  ){

    map[
      item.combination
    ] =
      Number(
        item.odds
      );
  }

  return map;
}

function evaluateBets(
  scored,
  oddsData,
  learningAdjustment
){

  const map =
    makeOddsMap(
      oddsData
    );

  const results = [];

  for(
    const combo of
    makeCandidates(scored)
  ){

    const parts =
      combo
        .split("-")
        .map(Number);

    const probability =
      trifectaProbability(
        parts[0],
        parts[1],
        parts[2],
        scored,
        learningAdjustment
      );

    const odds =
      safeNumber(
        map[combo]
      );

    if(
      odds === null
    ){
      continue;
    }

    results.push({

      combination:
        combo,

      probability,

      odds,

      ev:
        probability *
        odds
    });
  }

  return results
    .sort(
      (a,b)=>
        b.ev -
        a.ev
    )
    .slice(0,6);
}

/* 予想表示 */

function renderPrediction(
  racers,
  oddsData,
  context
){

  const scored =
    racers
      .map(
        racer=>({

          ...racer,

          score:
            baseAiScore(
              racer,
              racers
            )
        })
      )
      .sort(
        (a,b)=>
          b.score-a.score
      );

  const marks =
    getMarks(
      scored
    );

  const confidence =
    getConfidence(
      scored
    );

  const learning =
    getLearningAdjustment(
      context.venue,
      context.rno,
      confidence
    );

  const bets =
    evaluateBets(
      scored,
      oddsData,
      learning.total
    );

  predictionStatus.textContent =
    `勝負度 ${confidence} / 学習補正 ${learning.total >= 0 ? "+" : ""}${learning.total}`;

  const learningText =
    learning.active
      ? `
        <div class="adjust">
          🧠 学習補正 ON
          <br>
          会場補正：
          ${learning.venue >= 0 ? "+" : ""}
          ${learning.venue}
          <br>
          ${context.rno}R補正：
          ${learning.race >= 0 ? "+" : ""}
          ${learning.race}
          <br>
          勝負度${confidence}補正：
          ${learning.confidence >= 0 ? "+" : ""}
          ${learning.confidence}
          <br>
          合計：
          ${learning.total >= 0 ? "+" : ""}
          ${learning.total}
        </div>
      `
      : `
        <div class="adjust">
          🧠 学習補正：まだOFF
          <br>
          同一条件10R以上から自動反映します。
        </div>
      `;

  predictionBox.innerHTML = `
    <div class="prediction">

      <div>
        勝負度：
        <span class="confidence">
          ${confidence}
        </span>
      </div>

      ${learningText}

      ${scored.slice(0,3).map(r=>`
        <div class="rank">

          <div>
            <span class="mark">
              ${marks[r.lane] || ""}
            </span>

            ${r.lane}号艇
            ${r.name}
          </div>

          <strong>
            ${r.score}点
          </strong>

        </div>
      `).join("")}

      <div style="
        margin-top:14px;
        font-weight:900;
      ">
        EVランキング
      </div>

      ${bets.map(b=>`
        <div class="ev-card">

          <div class="ev-top">

            <div class="combo">
              ${b.combination}
            </div>

          </div>

          <div class="ev-grid">

            <div class="ev-item">
              推定確率
              <strong>
                ${(b.probability*100).toFixed(1)}%
              </strong>
            </div>

            <div class="ev-item">
              オッズ
              <strong>
                ${b.odds.toFixed(1)}
              </strong>
            </div>

            <div class="ev-item">
              参考EV
              <strong>
                ${b.ev.toFixed(2)}
              </strong>
            </div>

          </div>

        </div>
      `).join("")}

      <div class="notice">
        自動補正は過去実績を軽く反映する仕組みです。
        将来の的中や利益を保証するものではありません。
      </div>

    </div>
  `;

  currentSnapshot = {

    id:
      `${context.date}-${context.jcd}-${context.rno}-${Date.now()}`,

    version:
      "6.4",

    createdAt:
      new Date().toISOString(),

    date:
      context.date,

    jcd:
      context.jcd,

    venue:
      context.venue,

    rno:
      context.rno,

    confidence,

    learningAdjustment:
      learning,

    scored:
      scored.map(
        r=>({

          lane:r.lane,
          name:r.name,
          class:r.class,
          score:r.score
        })
      ),

    bets:
      bets
        .slice(0,3)
        .map(
          b=>({

            combination:
              b.combination,

            probability:
              b.probability,

            odds:
              b.odds,

            ev:
              b.ev
          })
        )
  };

  return {
    scored,
    marks
  };
}

/* 選手表示 */

        <div class="lane">
          ${racer.lane}
        </div>

        <div>

          <div class="name">
            ${marks[racer.lane] || ""}
            ${racer.name}
          </div>

          <div class="meta">
            ${racer.class}
            /
            登録番号
            ${racer.registration}

        <div class="score">

        </div>

}

/* 保存 */

function saveCurrentPrediction(){

  if(!currentSnapshot){

    saveStatus.textContent =
      "先にレースを選択してください";

    return;
  }

  const unit =
    Number(
      $("betUnit").value
    );

  if(
    !Number.isFinite(unit) ||
    unit < 100
  ){

    saveStatus.textContent =
      "1点100円以上で入力してください";

    return;
  }

  const item =
    JSON.parse(
      JSON.stringify(
        currentSnapshot
      )
    );

  item.betUnit =
    unit;

  item.totalStake =
    unit *
    item.bets.length;

  item.result =
    null;

  const history =
    getHistory();

  history.push(
    item
  );

  saveHistory(
    history
  );

  saveStatus.textContent =
    `${item.venue} ${item.rno}Rを保存しました`;

  renderHistory();
}

/* 結果取得 */

async function checkResult(
  item
){

  const data =
    await getJSON(
      `/api/result?hd=${item.date}&jcd=${item.jcd}&rno=${item.rno}`
    );

  if(
    !data.finished
  ){

    return {
      finished:false
    };
  }

  const hitBet =
    item.bets?.find(
      bet =>
        bet.combination ===
        data.combination
    );

  const hit =
    Boolean(
      hitBet
    );

  const unit =
    Number(
      item.betUnit || 0
    );

  const totalStake =
    Number(
      item.totalStake || 0
    );

  const returnAmount =
    hit &&
    unit > 0

      ? Math.round(
          data.payout *
          (unit / 100)
        )

      : 0;

  const profit =
    returnAmount -
    totalStake;

  const roi =
    totalStake > 0
      ? (
          returnAmount /
          totalStake
        ) * 100
      : 0;

  return {

    finished:true,

    checkedAt:
      new Date().toISOString(),

    combination:
      data.combination,

    payoutPer100:
      data.payout,

    method:
      data.method,

    hit,

    returnAmount,

    totalStake,

    profit,

    roi
  };
}

async function checkOne(
  id
){

  const history =
    getHistory();

  const index =
    history.findIndex(
      item =>
        item.id === id
    );

  if(
    index < 0
  ){
    return;
  }

  try{

    history[index].result =
      await checkResult(
        history[index]
      );

    saveHistory(
      history
    );

    renderHistory();

  }catch(error){

    alert(
      `結果取得失敗：${error.message}`
    );
  }
}

async function checkAllResults(){

  const history =
    getHistory();

  const button =
    $("checkAllResults");

  button.disabled =
    true;

  button.textContent =
    "結果を確認中...";

  for(
    let i=0;
    i<history.length;
    i++
  ){

    try{

      history[i].result =
        await checkResult(
          history[i]
        );

    }catch(error){

      console.log(
        error
      );
    }
  }

  saveHistory(
    history
  );

  renderHistory();

  button.disabled =
    false;

  button.textContent =
    "結果を一括チェック";
}

/* 学習表示 */

function renderLearningRows(
  title,
  rows
){

  if(
    !rows.length
  ){
    return "";
  }

  rows.sort(
    (a,b)=>
      b.roi -
      a.roi
  );

  return `
    <div style="margin-bottom:15px">

      <div style="
        font-weight:900;
        margin-bottom:7px;
      ">
        ${title}
      </div>

      ${rows.map(row=>{

        const adj =
          performanceAdjustment(
            row
          );

        return `
          <div class="learn-row">

            <div class="learn-head">

              <span>
                ${row.key}
              </span>

              <span>
                補正
                ${adj >= 0 ? "+" : ""}
                ${adj}
              </span>

            </div>

            <div class="learn-detail">

              ${row.races}R /
              的中 ${row.hits}R /
              的中率
              ${row.hitRate.toFixed(1)}%
              <br>

              回収率
              ${row.roi.toFixed(1)}%
              /
              収支
              ${row.profit >= 0 ? "+" : ""}
              ${yen(row.profit)}

              ${
                row.races < 10
                  ? "<br>※10R未満のため予想には未反映"
                  : ""
              }

            </div>

          </div>
        `;
      }).join("")}

    </div>
  `;
}

function renderLearning(){

  const finished =
    getHistory()
      .filter(
        item =>
          item.result?.finished
      );

  if(
    !finished.length
  ){

    learningStatus.textContent =
      "結果照合済みデータがまだありません";

    learningBox.innerHTML =
      "";

    return;
  }

  learningStatus.textContent =
    `${finished.length}Rを学習データとして使用`;

  const venueRows =
    aggregate(
      finished,
      item =>
        item.venue ||
        item.jcd
    );

  const raceRows =
    aggregate(
      finished,
      item =>
        `${item.rno}R`
    );

  const confidenceRows =
    aggregate(
      finished,
      item =>
        item.confidence ||
        "不明"
    );

  learningBox.innerHTML =

    renderLearningRows(
      "会場別",
      venueRows
    ) +

    renderLearningRows(
      "レース番号別",
      raceRows
    ) +

    renderLearningRows(
      "勝負度別",
      confidenceRows
    );
}

/* 総合収支 */

function renderSummary(){

  const finished =
    getHistory()
      .filter(
        item =>
          item.result?.finished
      );

  const stake =
    finished.reduce(
      (sum,item)=>
        sum +
        Number(
          item.result.totalStake || 0
        ),
      0
    );

  const returns =
    finished.reduce(
      (sum,item)=>
        sum +
        Number(
          item.result.returnAmount || 0
        ),
      0
    );

  const hits =
    finished.filter(
      item =>
        item.result.hit
    ).length;

  const profit =
    returns -
    stake;

  const roi =
    stake > 0
      ? (
          returns /
          stake
        ) * 100
      : 0;

  summaryBox.innerHTML = `

    <div class="summary-item">
      判定済み
      <strong>
        ${finished.length}R
      </strong>
    </div>

    <div class="summary-item">
      的中
      <strong>
        ${hits}R
      </strong>
    </div>

    <div class="summary-item">
      購入額
      <strong>
        ${yen(stake)}
      </strong>
    </div>

    <div class="summary-item">
      払戻
      <strong>
        ${yen(returns)}
      </strong>
    </div>

    <div class="summary-item">
      収支
      <strong>
        ${profit >= 0 ? "+" : ""}
        ${yen(profit)}
      </strong>
    </div>

    <div class="summary-item">
      回収率
      <strong>
        ${roi.toFixed(1)}%
      </strong>
    </div>
  `;
}

/* 履歴 */

function renderHistory(){

  const history =
    getHistory();

  if(
    !history.length
  ){

    historyBox.innerHTML =
      '<div class="status">保存履歴はまだありません</div>';

    renderSummary();
    renderLearning();

    return;
  }

  historyBox.innerHTML =
    history
      .slice()
      .reverse()
      .map(
        item=>{

          let resultHtml = `
            <div class="result">

              結果未確認
              <br><br>

              <button
                onclick="checkOne('${item.id}')"
              >
                このレースの結果を確認
              </button>

            </div>
          `;

          if(
            item.result?.finished === false
          ){

            resultHtml = `
              <div class="result">

                まだ結果が確定していません
                <br><br>

                <button
                  onclick="checkOne('${item.id}')"
                >
                  もう一度確認
                </button>

              </div>
            `;
          }

          if(
            item.result?.finished
          ){

            const r =
              item.result;

            resultHtml = `
              <div class="result">

                <div class="hit">
                  ${
                    r.hit
                      ? "🎯 的中"
                      : "不的中"
                  }
                </div>

                結果：
                ${r.combination}
                <br>

                100円払戻：
                ${yen(r.payoutPer100)}
                <br>

                購入額：
                ${yen(r.totalStake)}
                <br>

                払戻額：
                ${yen(r.returnAmount)}
                <br>

                収支：
                ${r.profit >= 0 ? "+" : ""}
                ${yen(r.profit)}
                <br>

                回収率：
                ${r.roi.toFixed(1)}%

              </div>
            `;
          }

          const learning =
            item.learningAdjustment;

          return `
            <div class="history">

              <div class="history-title">
                ${item.date}
                ${item.venue || item.jcd}
                ${item.rno}R
              </div>

              <div class="history-meta">

                勝負度：
                ${item.confidence}
                <br>

                学習補正：
                ${
                  learning
                    ? (
                        (learning.total >= 0 ? "+" : "") +
                        learning.total
                      )
                    : "なし"
                }
                <br>

                購入額：
                ${
                  item.totalStake
                    ? yen(item.totalStake)
                    : "旧保存データ"
                }
                <br>

                買い目：
                ${
                  item.bets
                    ?.map(
                      b =>
                        `${b.combination}（${Number(b.odds).toFixed(1)}倍 / EV ${Number(b.ev).toFixed(2)}）`
                    )
                    .join("、")
                  ||
                  "なし"
                }

              </div>

              ${resultHtml}

            </div>
          `;
        }
      )
      .join("");

  renderSummary();
  renderLearning();
}

/* レース画面 */

function clearRaceArea(){

  raceGrid.innerHTML = "";
  racersBox.innerHTML = "";
  predictionBox.innerHTML = "";

  currentSnapshot =
    null;

  raceTitle.textContent =
    "選手データ";

  racerStatus.textContent =
    "レースを選択してください";

  predictionStatus.textContent =
    "レースを選択すると予想します";
}

async function loadVenues(){

  venueStatus.textContent =
    "開催場を取得中...";

  venueSelect.innerHTML =
    '<option value="">開催場を選択</option>';

  clearRaceArea();

  try{

    const data =
      await getJSON(
        `/api/venues?hd=${apiDate()}`
      );

    for(
      const venue of
      data.venues
    ){

      const option =
        document.createElement(
          "option"
        );

      option.value =
        venue.jcd;

      option.textContent =
        `${venue.name}（${venue.jcd}）`;

      venueSelect.appendChild(
        option
      );
    }

    venueStatus.textContent =
      `${data.venues.length}会場を取得しました`;

  }catch(error){

    venueStatus.textContent =
      `取得失敗：${error.message}`;
  }
}

async function loadRaces(){

  const jcd =
    venueSelect.value;

  if(
    !jcd
  ){

    raceStatus.textContent =
      "開催場を選択してください";

    return;
  }

  raceStatus.textContent =
    "レースを取得中...";

  clearRaceArea();

  try{

    const data =
      await getJSON(
        `/api/venue?hd=${apiDate()}&jcd=${jcd}`
      );

    raceStatus.textContent =
      `${data.venue || ""} ${data.races.length}レースを取得しました`;

    for(
      const race of
      data.races
    ){

      const button =
        document.createElement(
          "button"
        );

      button.className =
        "race-btn";

      button.textContent =
        `${race.rno}R`;

      button.addEventListener(
        "click",
        ()=>loadRace(
          race.rno,
          button,
          data.venue
        )
      );

      raceGrid.appendChild(
        button
      );
    }

  }catch(error){

    raceStatus.textContent =
      `取得失敗：${error.message}`;
  }
}

async function loadRace(
  rno,
  button,
  venueName
){

  const jcd =
    venueSelect.value;

  document
    .querySelectorAll(
      ".race-btn"
    )
    .forEach(
      btn =>
        btn.classList.remove(
          "active"
        )
    );

  button.classList.add(
    "active"
  );

  raceTitle.textContent =
    `${rno}R 選手データ`;

  racersBox.innerHTML =
    "";

  predictionBox.innerHTML =
    "";

  currentSnapshot =
    null;

  racerStatus.textContent =
    "選手データ取得中...";

  predictionStatus.textContent =
    "AI予想計算中...";

  try{

    const raceData =
      await getJSON(
        `/api/race?hd=${apiDate()}&jcd=${jcd}&rno=${rno}`
      );

    if(
      !raceData.racers?.length
    ){

      racerStatus.textContent =
        "選手データを取得できませんでした";

      return;
    }

    let beforeData = {
      racers:[]
    };

    let oddsData = {
      odds:[],
      count:0
    };

    try{

      beforeData =
        await getJSON(
          `/api/before?hd=${apiDate()}&jcd=${jcd}&rno=${rno}`
        );

    }catch{}

    try{

      oddsData =
        await getJSON(
          `/api/odds?hd=${apiDate()}&jcd=${jcd}&rno=${rno}`
        );

    }catch{}

    const merged =
      mergeBefore(
        raceData.racers,
        beforeData
      );

    racerStatus.textContent =
      `${merged.length}艇を取得しました`;

    /*
      まず基本点から勝負度を計算し、
      その勝負度を過去学習補正の検索条件にする。
    */

    const prediction =
      renderPrediction(
        merged,
        oddsData,
        {
          date:
            apiDate(),

          jcd,

          venue:
            venueName ||
            raceData.venue ||
            jcd,

          rno
        }
      );

    renderRacers(
      merged,
      prediction.scored,
      prediction.marks
    );

  }catch(error){

    racerStatus.textContent =
      `取得失敗：${error.message}`;

    predictionStatus.textContent =
      "予想失敗";
  }
}

/* 起動 */

dateInput.value =
  todayLocal();

$("loadVenues")
  .addEventListener(
    "click",
    loadVenues
  );

$("loadRaces")
  .addEventListener(
    "click",
    loadRaces
  );

$("savePrediction")
  .addEventListener(
    "click",
    saveCurrentPrediction
  );

$("checkAllResults")
  .addEventListener(
    "click",
    checkAllResults
  );

$("clearHistory")
  .addEventListener(
    "click",
    ()=>{

      if(
        confirm(
          "保存履歴をすべて削除しますか？"
        )
      ){

        localStorage.removeItem(
          "boat_ai_predictions"
        );

        renderHistory();

        saveStatus.textContent =
          "保存履歴を削除しました";
      }
    }
  );

renderHistory();

</script>
