<script>

const $ = id =>
  document.getElementById(id);

const dateInput = $("date");
const venueSelect = $("venue");
const raceGrid = $("raceGrid");
const racersBox = $("racers");
const predictionBox = $("prediction");
const historyBox = $("history");
const summaryBox = $("summary");
const comparisonBox = $("comparison");
const learningBox = $("learning");
const weightsBox = $("weights");

const venueStatus = $("venueStatus");
const raceStatus = $("raceStatus");
const racerStatus = $("racerStatus");
const predictionStatus = $("predictionStatus");
const saveStatus = $("saveStatus");
const autoSaveStatus = $("autoSaveStatus");
const autoCheckStatus = $("autoCheckStatus");
const learningStatus = $("learningStatus");
const weightStatus = $("weightStatus");
const raceTitle = $("raceTitle");

let currentSnapshot = null;
let currentVenueRaces = [];

/* =========================
   基本
========================= */

function todayLocal(){

  const now = new Date();

  const y =
    now.getFullYear();

  const m =
    String(
      now.getMonth()+1
    ).padStart(2,"0");

  const d =
    String(
      now.getDate()
    ).padStart(2,"0");

  return `${y}-${m}-${d}`;
}

function apiDate(){

  return dateInput.value
    .replaceAll("-","");
}

async function getJSON(url){

  const controller =
    new AbortController();

  const timer =
    setTimeout(
      ()=>controller.abort(),
      15000
    );

  try{

    const response =
      await fetch(
        url,
        {
          signal:
            controller.signal,
          cache:"no-store"
        }
      );

    const data =
      await response.json();

    if(
      !response.ok ||
      !data.ok
    ){

      throw new Error(
        data.error ||
        `HTTP ${response.status}`
      );
    }

    return data;

  }finally{

    clearTimeout(timer);
  }
}

function safeNumber(v){

  if(
    v === null ||
    v === undefined ||
    v === ""
  ){

    return null;
  }

  const n =
    Number(v);

  return Number.isFinite(n)
    ? n
    : null;
}

function fmt(v,digits=2){

  const n =
    safeNumber(v);

  return n === null
    ? "-"
    : n.toFixed(digits);
}

function yen(v){

  return (
    Number(v || 0)
      .toLocaleString("ja-JP") +
    "円"
  );
}

function clamp(
  value,
  min,
  max
){

  return Math.max(
    min,
    Math.min(
      max,
      value
    )
  );
}

/* =========================
   履歴
========================= */

function getHistory(){

  try{

    return JSON.parse(
      localStorage.getItem(
        "boat_ai_predictions"
      ) || "[]"
    );

  }catch{

    return [];
  }
}

function saveHistory(history){

  localStorage.setItem(
    "boat_ai_predictions",
    JSON.stringify(history)
  );
}

function sameRace(
  item,
  date,
  jcd,
  rno
){

  return (
    String(item.date) === String(date) &&
    String(item.jcd) === String(jcd) &&
    Number(item.rno) === Number(rno)
  );
}

function alreadySaved(
  date,
  jcd,
  rno
){

  return getHistory()
    .some(
      item =>
        sameRace(
          item,
          date,
          jcd,
          rno
        )
    );
}

/* =========================
   直前情報
========================= */

function mergeBefore(
  racers,
  beforeData
){

  return racers.map(
    racer=>{

      const live =
        beforeData?.racers?.find(
          x =>
            Number(x.lane) ===
            Number(racer.lane)
        );

      return {

        ...racer,

        before:{

          course:
            live?.course ??
            null,

          exhibitionTime:
            live?.exhibitionTime ??
            null,

          exhibitionST:
            live?.exhibitionST ??
            null,

          tilt:
            live?.tilt ??
            null
        }
      };
    }
  );
}

/* =========================
   採点
========================= */

function scoreComponents(
  racer,
  allRacers
){

  const c = {

    lane:0,
    class:0,
    national:0,
    local:0,
    st:0,
    motor:0,
    exhibition:0,
    exhibitionST:0,
    course:0
  };

  const laneScore = {
    1:25,
    2:19,
    3:16,
    4:13,
    5:8,
    6:5
  };

  c.lane =
    laneScore[racer.lane] || 0;

  const classScore = {
    A1:15,
    A2:12,
    B1:7,
    B2:3
  };

  c.class =
    classScore[racer.class] || 0;

  const national =
    safeNumber(
      racer.national?.winRate
    );

  if(
    national !== null
  ){

    c.national =
      Math.min(
        18,
        national * 2.25
      );
  }

  const local =
    safeNumber(
      racer.local?.winRate
    );

  if(
    local !== null
  ){

    c.local =
      Math.min(
        10,
        local * 1.25
      );
  }

  const avgST =
    safeNumber(
      racer.avgST
    );

  if(
    avgST !== null
  ){

    if(avgST <= .12){
      c.st = 8;
    }
    else if(avgST <= .14){
      c.st = 7;
    }
    else if(avgST <= .16){
      c.st = 5;
    }
    else if(avgST <= .18){
      c.st = 3;
    }
    else{
      c.st = 1;
    }
  }

  const motor =
    safeNumber(
      racer.motor?.secondRate
    );

  if(
    motor !== null
  ){

    c.motor =
      Math.min(
        10,
        motor / 5
      );
  }

  const times =
    allRacers
      .map(
        r =>
          safeNumber(
            r.before?.exhibitionTime
          )
      )
      .filter(
        n =>
          n !== null
      );

  const exhibition =
    safeNumber(
      racer.before?.exhibitionTime
    );

  if(
    exhibition !== null &&
    times.length
  ){

    const fastest =
      Math.min(...times);

    const diff =
      exhibition-fastest;

    if(diff <= .01){
      c.exhibition = 8;
    }
    else if(diff <= .03){
      c.exhibition = 7;
    }
    else if(diff <= .05){
      c.exhibition = 5;
    }
    else if(diff <= .08){
      c.exhibition = 3;
    }
    else{
      c.exhibition = 1;
    }
  }

  const exhibitionST =
    safeNumber(
      racer.before?.exhibitionST
    );

  if(
    exhibitionST !== null
  ){

    if(exhibitionST <= .05){
      c.exhibitionST = 4;
    }
    else if(exhibitionST <= .10){
      c.exhibitionST = 3;
    }
    else if(exhibitionST <= .15){
      c.exhibitionST = 2;
    }
    else{
      c.exhibitionST = 1;
    }
  }

  const course =
    safeNumber(
      racer.before?.course
    );

  if(course === 1){
    c.course = 2;
  }
  else if(
    course !== null &&
    course <= 3
  ){
    c.course = 1;
  }

  return c;
}

/* =========================
   項目別学習
========================= */

const COMPONENT_NAMES = {

  lane:"枠・コース基本力",
  class:"級別",
  national:"全国勝率",
  local:"当地勝率",
  st:"平均ST",
  motor:"モーター",
  exhibition:"展示タイム",
  exhibitionST:"展示ST",
  course:"展示コース"
};

function getTrainableHistory(){

  return getHistory()
    .filter(
      item =>

        item.result?.finished &&

        Array.isArray(
          item.racersDetailed
        ) &&

        item.racersDetailed.length === 6 &&

        Array.isArray(
          item.result.winningLanes
        ) &&

        item.result.winningLanes.length >= 3
    );
}

function calculateLearnedWeights(){

  const history =
    getTrainableHistory();

  const base = {};

  for(
    const key of
    Object.keys(
      COMPONENT_NAMES
    )
  ){

    base[key] = 1;
  }

  if(
    history.length < 10
  ){

    return {
      active:false,
      races:history.length,
      weights:base
    };
  }

  const signals = {};

  for(
    const key of
    Object.keys(
      COMPONENT_NAMES
    )
  ){

    signals[key] = [];
  }

  for(
    const item of history
  ){

    const winners =
      new Set(
        item.result
          .winningLanes
          .slice(0,3)
          .map(Number)
      );

    for(
      const key of
      Object.keys(
        COMPONENT_NAMES
      )
    ){

      const allValues =
        item.racersDetailed.map(
          r =>
            Number(
              r.components?.[key] || 0
            )
        );

      const winnerValues =
        item.racersDetailed
          .filter(
            r =>
              winners.has(
                Number(r.lane)
              )
          )
          .map(
            r =>
              Number(
                r.components?.[key] || 0
              )
          );

      if(
        !winnerValues.length
      ){

        continue;
      }

      const allAvg =
        allValues.reduce(
          (a,b)=>a+b,
          0
        ) /
        allValues.length;

      const winnerAvg =
        winnerValues.reduce(
          (a,b)=>a+b,
          0
        ) /
        winnerValues.length;

      if(
        allAvg > 0
      ){

        signals[key].push(
          (
            winnerAvg -
            allAvg
          ) /
          allAvg
        );
      }
    }
  }

  const weights = {};

  for(
    const key of
    Object.keys(
      COMPONENT_NAMES
    )
  ){

    const arr =
      signals[key];

    if(
      !arr.length
    ){

      weights[key] = 1;

      continue;
    }

    const avg =
      arr.reduce(
        (a,b)=>a+b,
        0
      ) /
      arr.length;

    const adjustment =
      clamp(
        avg * .35,
        -.15,
        .15
      );

    weights[key] =
      Math.round(
        (
          1 +
          adjustment
        ) *
        1000
      ) /
      1000;
  }

  return {
    active:true,
    races:history.length,
    weights
  };
}

function scoreWithLearning(
  components,
  learned
){

  let baseScore = 0;
  let learnedScore = 0;

  for(
    const key of
    Object.keys(
      COMPONENT_NAMES
    )
  ){

    const value =
      Number(
        components[key] || 0
      );

    baseScore +=
      value;

    learnedScore +=
      value *
      Number(
        learned.weights[key] || 1
      );
  }

  return {

    baseScore:
      Math.round(
        baseScore*10
      )/10,

    learnedScore:
      Math.round(
        learnedScore*10
      )/10
  };
}

/* =========================
   確率
========================= */

function strength(score){

  return Math.exp(
    score / 18
  );
}

function trifectaProbability(
  first,
  second,
  third,
  scored
){

  const racers =
    scored.map(
      r=>({

        lane:r.lane,

        strength:
          strength(
            r.score
          )
      })
    );

  const total1 =
    racers.reduce(
      (sum,r)=>
        sum +
        r.strength,
      0
    );

  const r1 =
    racers.find(
      r =>
        r.lane === first
    );

  const r2 =
    racers.find(
      r =>
        r.lane === second
    );

  const r3 =
    racers.find(
      r =>
        r.lane === third
    );

  if(
    !r1 ||
    !r2 ||
    !r3
  ){

    return 0;
  }

  const p1 =
    r1.strength /
    total1;

  const total2 =
    total1 -
    r1.strength;

  const p2 =
    r2.strength /
    total2;

  const total3 =
    total2 -
    r2.strength;

  const p3 =
    r3.strength /
    total3;

  return (
    p1 *
    p2 *
    p3
  );
}

function getMarks(
  sorted
){

  const marks = {};

  if(sorted[0]){
    marks[sorted[0].lane] = "◎";
  }

  if(sorted[1]){
    marks[sorted[1].lane] = "○";
  }

  if(sorted[2]){
    marks[sorted[2].lane] = "▲";
  }

  return marks;
}

function getConfidence(
  sorted
){

  if(
    sorted.length < 3
  ){

    return "B";
  }

  const top =
    sorted[0].score;

  const gap2 =
    sorted[0].score -
    sorted[1].score;

  const gap3 =
    sorted[0].score -
    sorted[2].score;

  if(
    top >= 82 &&
    gap2 >= 8 &&
    gap3 >= 14
  ){

    return "S";
  }

  if(
    top >= 68 &&
    gap2 >= 4
  ){

    return "A";
  }

  return "B";
}

function makeCandidates(
  scored
){

  const top =
    scored
      .slice(0,4)
      .map(
        r =>
          r.lane
      );

  const list = [];

  for(
    const a of top
  ){

    for(
      const b of top
    ){

      if(
        a === b
      ){
        continue;
      }

      for(
        const c of top
      ){

        if(
          c === a ||
          c === b
        ){
          continue;
        }

        list.push(
          `${a}-${b}-${c}`
        );
      }
    }
  }

  return list;
}

function makeOddsMap(
  oddsData
){

  const map = {};

  for(
    const item of
    oddsData?.odds || []
  ){

    map[
      item.combination
    ] =
      Number(
        item.odds
      );
  }

  return map;
}

/* =========================
   V6.6.1
   総合買い目評価
========================= */

function evaluateBets(
  scored,
  oddsData
){

  const oddsMap =
    makeOddsMap(
      oddsData
    );

  const candidates = [];

  const highestScore =
    Math.max(
      ...scored.map(
        r=>r.score
      ),
      1
    );

  for(
    const combo of
    makeCandidates(scored)
  ){

    const parts =
      combo
        .split("-")
        .map(Number);

    const first =
      parts[0];

    const probability =
      trifectaProbability(
        parts[0],
        parts[1],
        parts[2],
        scored
      );

    const odds =
      safeNumber(
        oddsMap[combo]
      );

    if(
      odds === null
    ){
      continue;
    }

    const firstRacer =
      scored.find(
        r =>
          r.lane === first
      );

    const firstStrength =
      firstRacer
        ? firstRacer.score /
          highestScore
        : 0;

    const ev =
      probability *
      odds;

    candidates.push({

      combination:
        combo,

      firstLane:
        first,

      firstScore:
        firstRacer?.score || 0,

      firstStrength,

      probability,

      odds,

      ev
    });
  }

  if(
    !candidates.length
  ){

    return [];
  }

  const maxProbability =
    Math.max(
      ...candidates.map(
        x =>
          x.probability
      ),
      .000001
    );

  const maxEV =
    Math.max(
      ...candidates.map(
        x =>
          x.ev
      ),
      .000001
    );

  for(
    const item of candidates
  ){

    /*
      1着候補の強さ 40%
      推定確率       35%
      EV             25%
    */

    const firstNorm =
      clamp(
        item.firstStrength,
        0,
        1
      );

    const probabilityNorm =
      clamp(
        item.probability /
        maxProbability,
        0,
        1
      );

    const evNorm =
      clamp(
        item.ev /
        maxEV,
        0,
        1
      );

    item.firstStrengthIndex =
      firstNorm * 100;

    item.probabilityIndex =
      probabilityNorm * 100;

    item.evIndex =
      evNorm * 100;

    item.totalScore =
      (
        firstNorm * .40 +
        probabilityNorm * .35 +
        evNorm * .25
      ) * 100;
  }

  return candidates
    .sort(
      (a,b)=>
        b.totalScore -
        a.totalScore
    )
    .slice(0,6);
}

   予想生成
========================= */

function buildPrediction(
  racers,
  oddsData,
  context
){

  const learned =
    calculateLearnedWeights();

  const detailed =
    racers.map(
      racer=>{

        const components =
          scoreComponents(
            racer,
            racers
          );

        const scores =
          scoreWithLearning(
            components,
            learned
          );

        return {

          ...racer,

          components,

          baseScore:
            scores.baseScore,

          score:
            scores.learnedScore
        };
      }
    );

  const scored =
    detailed
      .slice()
      .sort(
        (a,b)=>
          b.score -
          a.score
      );

  const marks =
    getMarks(
      scored
    );

  const confidence =
    getConfidence(
      scored
    );

  const bets =
    evaluateBets(
      scored,
      oddsData
    );

  const snapshot = {

    id:
      `${context.date}-${context.jcd}-${context.rno}-${Date.now()}-${Math.random().toString(36).slice(2,7)}`,

    version:
      "6.6.1",

    createdAt:
      new Date()
        .toISOString(),

    date:
      context.date,

    jcd:
      context.jcd,

    venue:
      context.venue,

    rno:
      Number(
        context.rno
      ),

    confidence,

    model:{
      firstStrengthWeight:.40,
      probabilityWeight:.35,
      evWeight:.25
    },

    learnedWeights:
      learned.weights,

    learningRaces:
      learned.races,

    racersDetailed:
      detailed.map(
        r=>({

          lane:r.lane,

          name:r.name,

          class:r.class,

          components:{
            ...r.components
          },

          baseScore:
            r.baseScore,

          learnedScore:
            r.score
        })
      ),

    scored:
      scored.map(
        r=>({

          lane:r.lane,

          name:r.name,

          class:r.class,

          baseScore:
            r.baseScore,

          score:
            r.score
        })
      ),

    bets:
      bets.map(
        b=>({

          combination:
            b.combination,

          firstLane:
            b.firstLane,

          firstScore:
            b.firstScore,

          firstStrengthIndex:
            b.firstStrengthIndex,

          probability:
            b.probability,

          odds:
            b.odds,

          ev:
            b.ev,

          totalScore:
            b.totalScore
        })
      )
  };

  return {
    learned,
    scored,
    marks,
    confidence,
    bets,
    snapshot
  };
}

function makeSavedItem(
  snapshot,
  unit,
  mode
){

  const item =
    JSON.parse(
      JSON.stringify(
        snapshot
      )
    );

  item.betUnit =
    unit;

  item.totalStake =
    unit *
    item.bets.length;

  item.top3Stake =
    unit *
    Math.min(
      3,
      item.bets.length
    );

  item.result =
    null;

  item.saveMode =
    mode;

  return item;
}

function saveCurrentPrediction(){

  if(
    !currentSnapshot
  ){

    saveStatus.textContent =
      "先にレースを選択してください";

    return;
  }

  if(
    alreadySaved(
      currentSnapshot.date,
      currentSnapshot.jcd,
      currentSnapshot.rno
    )
  ){

    saveStatus.textContent =
      "このレースはすでに保存済みです";

    return;
  }

  const unit =
    Number(
      $("betUnit").value
    );

  if(
    !Number.isFinite(unit) ||
    unit < 100
  ){

    saveStatus.textContent =
      "1点100円以上で入力してください";

    return;
  }

  if(
    !currentSnapshot.bets.length
  ){

    saveStatus.textContent =
      "買い目がありません";

    return;
  }

  const item =
    makeSavedItem(
      currentSnapshot,
      unit,
      "manual"
    );

  const history =
    getHistory();

  history.push(
    item
  );

  saveHistory(
    history
  );

  saveStatus.textContent =
    `${item.venue} ${item.rno}Rを${item.bets.length}点保存しました`;

  renderHistory();
}

   自動保存
========================= */

async function getRacePredictionData(
  date,
  jcd,
  rno,
  venueName
){

  /*
    終了済みを学習用新規予想として
    保存しない
  */

  try{

    const resultData =
      await getJSON(
        `/api/result?hd=${date}&jcd=${jcd}&rno=${rno}`
      );

    if(
      resultData.finished
    ){

      return {
        skipped:true,
        reason:"finished"
      };
    }

  }catch{}

  const raceData =
    await getJSON(
      `/api/race?hd=${date}&jcd=${jcd}&rno=${rno}`
    );

  if(
    !raceData.racers?.length
  ){

    return {
      skipped:true,
      reason:"no-racers"
    };
  }

  let beforeData = {
    racers:[]
  };

  let oddsData = {
    odds:[],
    count:0
  };

  try{

    beforeData =
      await getJSON(
        `/api/before?hd=${date}&jcd=${jcd}&rno=${rno}`
      );

  }catch{}

  try{

    oddsData =
      await getJSON(
        `/api/odds?hd=${date}&jcd=${jcd}&rno=${rno}`
      );

  }catch{}

  if(
    !oddsData.odds?.length
  ){

    return {
      skipped:true,
      reason:"no-odds"
    };
  }

  const merged =
    mergeBefore(
      raceData.racers,
      beforeData
    );

  const prediction =
    buildPrediction(
      merged,
      oddsData,
      {
        date,
        jcd,
        venue:
          venueName ||
          raceData.venue ||
          jcd,
        rno
      }
    );

  return {
    skipped:false,
    prediction
  };
}

async function autoSaveVenue(){

  const jcd =
    venueSelect.value;

  if(
    !jcd
  ){

    autoSaveStatus.textContent =
      "開催場を選択してください";

    return;
  }

  if(
    !currentVenueRaces.length
  ){

    autoSaveStatus.textContent =
      "先にレース一覧を取得してください";

    return;
  }

  const unit =
    Number(
      $("autoBetUnit").value
    );

  if(
    !Number.isFinite(unit) ||
    unit < 100
  ){

    autoSaveStatus.textContent =
      "1点100円以上で入力してください";

    return;
  }

  const button =
    $("autoSaveVenue");

  button.disabled =
    true;

  const date =
    apiDate();

  const venueName =
    venueSelect.options[
      venueSelect.selectedIndex
    ]?.textContent
      ?.split("（")[0] ||
    jcd;

  let savedCount = 0;
  let duplicateCount = 0;
  let finishedCount = 0;
  let unavailableCount = 0;

  for(
    let i=0;
    i<currentVenueRaces.length;
    i++
  ){

    const rno =
      Number(
        currentVenueRaces[i].rno
      );

    autoSaveStatus.textContent =
      `${rno}Rを確認中 ${i+1}/${currentVenueRaces.length}`;

    if(
      alreadySaved(
        date,
        jcd,
        rno
      )
    ){

      duplicateCount++;

      continue;
    }

    try{

      const data =
        await getRacePredictionData(
          date,
          jcd,
          rno,
          venueName
        );

      if(
        data.skipped
      ){

        if(
          data.reason ===
          "finished"
        ){

          finishedCount++;

        }else{

          unavailableCount++;
        }

        continue;
      }

      const snapshot =
        data.prediction.snapshot;

      if(
        !snapshot.bets?.length
      ){

        unavailableCount++;

        continue;
      }

      const item =
        makeSavedItem(
          snapshot,
          unit,
          "auto"
        );

      const history =
        getHistory();

      history.push(
        item
      );

      saveHistory(
        history
      );

      savedCount++;

    }catch(error){

      console.log(
        rno,
        error
      );

      unavailableCount++;
    }
  }

  button.disabled =
    false;

  autoSaveStatus.innerHTML = `
    自動保存完了<br>
    保存：${savedCount}R<br>
    保存済み：${duplicateCount}R<br>
    終了済み：${finishedCount}R<br>
    データ未取得：${unavailableCount}R
  `;

  renderHistory();
}

async function checkResult(
  item
){

  const data =
    await getJSON(
      `/api/result?hd=${item.date}&jcd=${item.jcd}&rno=${item.rno}`
    );

  if(
    !data.finished
  ){

    return {
      finished:false
    };
  }

  const winning =
    data.combination;

  const bets =
    item.bets || [];

  const top3 =
    bets.slice(0,3);

  const hitTop3 =
    top3.some(
      b =>
        b.combination ===
        winning
    );

  const hitAll =
    bets.some(
      b =>
        b.combination ===
        winning
    );

  const unit =
    Number(
      item.betUnit || 0
    );

  const stake3 =
    unit *
    Math.min(
      3,
      bets.length
    );

  const stakeAll =
    unit *
    bets.length;

  const return3 =
    hitTop3
      ? Math.round(
          data.payout *
          (
            unit /
            100
          )
        )
      : 0;

  const returnAll =
    hitAll
      ? Math.round(
          data.payout *
          (
            unit /
            100
          )
        )
      : 0;

  const profit3 =
    return3 -
    stake3;

  const profitAll =
    returnAll -
    stakeAll;

  const roi3 =
    stake3 > 0
      ? (
          return3 /
          stake3
        ) * 100
      : 0;

  const roiAll =
    stakeAll > 0
      ? (
          returnAll /
          stakeAll
        ) * 100
      : 0;

  const winningLanes =
    Array.isArray(
      data.winningLanes
    ) &&
    data.winningLanes.length >= 3

      ? data.winningLanes
          .slice(0,3)
          .map(Number)

      : String(
          data.combination
        )
          .split("-")
          .map(Number);

  return {

    finished:true,

    checkedAt:
      new Date()
        .toISOString(),

    combination:
      data.combination,

    winningLanes,

    payoutPer100:
      data.payout,

    method:
      data.method,

    /*
      互換用
      全表示買い目を実購入扱い
    */

    hit:
      hitAll,

    returnAmount:
      returnAll,

    totalStake:
      stakeAll,

    profit:
      profitAll,

    roi:
      roiAll,

    comparison:{

      top3:{
        hit:
          hitTop3,

        stake:
          stake3,

        returnAmount:
          return3,

        profit:
          profit3,

        roi:
          roi3
      },

      all:{
        hit:
          hitAll,

        stake:
          stakeAll,

        returnAmount:
          returnAll,

        profit:
          profitAll,

        roi:
          roiAll
      }
    }
  };
}

){

    getHistory();

  const targets =
    history
      .map(
        (item,index)=>({
          item,
          index
        })

      .filter(
        x =>

      );

    !targets.length

      automatic
    ){

      autoCheckStatus.textContent =

      "結果を確認中...";

  let updated = 0;

  ){

      automatic

      autoCheckStatus.textContent =
        `自動照合中 ${i+1}/${targets.length}`;

    !automatic
  ){

    button.disabled =
      false;

    button.textContent =
      "結果を一括チェック";

  }else{

    autoCheckStatus.textContent =
      updated
        ? `${updated}Rの結果を更新しました`
        : "新しい確定結果はありません";
  }
}

  ){

    const c =
      item.result.comparison;

    stake3 +=
      Number(
        c.top3.stake || 0
      );

    return3 +=
      Number(
        c.top3.returnAmount || 0
      );

    if(
      c.top3.hit
    ){
      hits3++;
    }

    stakeAll +=
      Number(
        c.all.stake || 0
      );

    returnAll +=
      Number(
        c.all.returnAmount || 0
      );

    if(
      c.all.hit
    ){
      hitsAll++;
    }
  }

  const profit3 =
    return3 -
    stake3;

  const profitAll =
    returnAll -
    stakeAll;

  const roi3 =
    stake3
      ? return3/stake3*100
      : 0;

  const roiAll =
    stakeAll
      ? returnAll/stakeAll*100
      : 0;

  comparisonBox.innerHTML = `

    <div class="compare-box">

      <strong>
        上位3点
      </strong>

      <br>

      ${finished.length}R中
      ${hits3}R的中

      <br>

      的中率：
      ${
        finished.length
          ? (
              hits3 /
              finished.length *
              100
            ).toFixed(1)
          : "0.0"
      }%

      <br>

      購入：
      ${yen(stake3)}

      <br>

      払戻：
      ${yen(return3)}

      <br>

      収支：
      ${profit3 >= 0 ? "+" : ""}
      ${yen(profit3)}

      <br>

      回収率：
      ${roi3.toFixed(1)}%

    </div>

    <div class="compare-box">

      <strong>
        表示6点
      </strong>

      <br>

      ${finished.length}R中
      ${hitsAll}R的中

      <br>

      的中率：
      ${
        finished.length
          ? (
              hitsAll /
              finished.length *
              100
            ).toFixed(1)
          : "0.0"
      }%

      <br>

      購入：
      ${yen(stakeAll)}

      <br>

      払戻：
      ${yen(returnAll)}

      <br>

      収支：
      ${profitAll >= 0 ? "+" : ""}
      ${yen(profitAll)}

      <br>

      回収率：
      ${roiAll.toFixed(1)}%

    </div>
  `;
}

/* =========================
   学習表示
========================= */

function renderWeights(){

  const learned =
    calculateLearnedWeights();

  if(
    !learned.active
  ){

    weightStatus.textContent =
      `詳細学習データ ${learned.races}/10R`;

    weightsBox.innerHTML = `
      <div class="adjust">

        🧠 項目別学習はまだOFF
        <br>

        あと
        ${Math.max(
          0,
          10-learned.races
        )}R

      </div>
    `;

    return;
  }

  weightStatus.textContent =
    `${learned.races}Rを使って項目別学習中`;

  weightsBox.innerHTML =
    Object.entries(
      learned.weights
    )
      .map(
        ([key,value])=>{

          const percent =
            (
              value-1
            ) * 100;

          return `
            <div class="learn-row">

              <div class="learn-head">

                <span>
                  ${COMPONENT_NAMES[key]}
                </span>

                <span>
                  ×${value.toFixed(3)}
                </span>

              </div>

              <div class="learn-detail">

                基準比：
                ${percent >= 0 ? "+" : ""}
                ${percent.toFixed(1)}%

              </div>

            </div>
          `;
        }
      )
      .join("");
}

/* =========================
   分析
========================= */

function aggregate(
  items,
  keyFn
){

  const map = {};

  for(
    const item of items
  ){

    const key =
      keyFn(item);

    if(
      !map[key]
    ){

      map[key] = {
        key,
        races:0,
        hits:0,
        stake:0,
        returns:0
      };
    }

    const row =
      map[key];

    row.races++;

    if(
      item.result?.hit
    ){
      row.hits++;
    }

    row.stake +=
      Number(
        item.result?.totalStake || 0
      );

    row.returns +=
      Number(
        item.result?.returnAmount || 0
      );
  }

  return Object.values(
    map
  )
    .map(
      row=>({

        ...row,

        hitRate:
          row.races
            ? row.hits /
              row.races *
              100
            : 0,

        profit:
          row.returns -
          row.stake,

        roi:
          row.stake
            ? row.returns /
              row.stake *
              100
            : 0
      })
    );
}

function renderLearningRows(
  title,
  rows
){

  if(
    !rows.length
  ){

    return "";
  }

  rows.sort(
    (a,b)=>
      b.roi -
      a.roi
  );

  return `
    <div style="margin-bottom:15px">

      <div style="
        font-weight:900;
        margin-bottom:7px;
      ">
        ${title}
      </div>

      ${rows.map(row=>`
        <div class="learn-row">

          <div class="learn-head">

            <span>
              ${row.key}
            </span>

            <span>
              ${row.roi.toFixed(1)}%
            </span>

          </div>

          <div class="learn-detail">

            ${row.races}R /
            的中 ${row.hits}R /
            的中率
            ${row.hitRate.toFixed(1)}%

            <br>

            収支
            ${row.profit >= 0 ? "+" : ""}
            ${yen(row.profit)}

          </div>

        </div>
      `).join("")}

    </div>
  `;
}

function renderLearning(){

  const finished =
    getHistory()
      .filter(
        item =>
          item.result?.finished
      );

  if(
    !finished.length
  ){

    learningStatus.textContent =
      "結果照合済みデータがありません";

    learningBox.innerHTML =
      "";

    return;
  }

  learningStatus.textContent =
    `${finished.length}Rを集計`;

  learningBox.innerHTML =

    renderLearningRows(
      "会場別",
      aggregate(
        finished,
        item =>
          item.venue ||
          item.jcd
      )
    ) +

    renderLearningRows(
      "レース番号別",
      aggregate(
        finished,
        item =>
          `${item.rno}R`
      )
    ) +

    renderLearningRows(
      "勝負度別",
      aggregate(
        finished,
        item =>
          `勝負度 ${item.confidence || "不明"}`
      )
    );
}

/* =========================
   総合収支
========================= */

function renderSummary(){

  const finished =
    getHistory()
      .filter(
        item =>
          item.result?.finished
      );

  const stake =
    finished.reduce(
      (sum,item)=>
        sum +
        Number(
          item.result.totalStake || 0
        ),
      0
    );

  const returns =
    finished.reduce(
      (sum,item)=>
        sum +
        Number(
          item.result.returnAmount || 0
        ),
      0
    );

  const hits =
    finished.filter(
      item =>
        item.result.hit
    ).length;

  const profit =
    returns -
    stake;

  const roi =
    stake
      ? returns/stake*100
      : 0;

  summaryBox.innerHTML = `

    <div class="summary-item">
      判定済み
      <strong>
        ${finished.length}R
      </strong>
    </div>

    <div class="summary-item">
      的中
      <strong>
        ${hits}R
      </strong>
    </div>

    <div class="summary-item">
      購入額
      <strong>
        ${yen(stake)}
      </strong>
    </div>

    <div class="summary-item">
      払戻
      <strong>
        ${yen(returns)}
      </strong>
    </div>

    <div class="summary-item">
      収支
      <strong>
        ${profit >= 0 ? "+" : ""}
        ${yen(profit)}
      </strong>
    </div>

    <div class="summary-item">
      回収率
      <strong>
        ${roi.toFixed(1)}%
      </strong>
    </div>
  `;
}

/* =========================
   履歴表示
========================= */

function renderHistory(){

  const history =
    getHistory();

  if(
    !history.length
  ){

    historyBox.innerHTML =
      '<div class="status">保存履歴はまだありません</div>';

    renderSummary();
    renderComparison();
    renderWeights();
    renderLearning();

    return;
  }

  historyBox.innerHTML =
    history
      .slice()
      .reverse()
      .map(
        item=>{

          let resultHtml = `
            <div class="result">

              結果未確認
              <br><br>

              <button
                onclick="checkOne('${item.id}')"
              >
                このレースの結果を確認
              </button>

            </div>
          `;

          if(
            item.result?.finished === false
          ){

            resultHtml = `
              <div class="result">

                まだ結果が確定していません
                <br><br>

                <button
                  onclick="checkOne('${item.id}')"
                >
                  もう一度確認
                </button>

              </div>
            `;
          }

          if(
            item.result?.finished
          ){

            const r =
              item.result;

            const c =
              r.comparison;

            resultHtml = `
              <div class="result">

                <div class="hit">

                  ${
                    r.hit
                      ? "🎯 6点内的中"
                      : "6点内不的中"
                  }

                </div>

                結果：
                ${r.combination}

                <br>

                100円払戻：
                ${yen(
                  r.payoutPer100
                )}

                ${
                  c
                    ? `
                      <hr style="
                        border:0;
                        border-top:1px solid #475569;
                        margin:9px 0;
                      ">

                      上位3点：
                      ${
                        c.top3.hit
                          ? "🎯 的中"
                          : "不的中"
                      }

                      <br>

                      3点収支：
                      ${c.top3.profit >= 0 ? "+" : ""}
                      ${yen(c.top3.profit)}

                      /
                      回収率
                      ${c.top3.roi.toFixed(1)}%

                      <br><br>

                      表示${item.bets?.length || 0}点：
                      ${
                        c.all.hit
                          ? "🎯 的中"
                          : "不的中"
                      }

                      <br>

                      全点収支：
                      ${c.all.profit >= 0 ? "+" : ""}
                      ${yen(c.all.profit)}

                      /
                      回収率
                      ${c.all.roi.toFixed(1)}%
                    `
                    : ""
                }

              </div>
            `;
          }

          return `
            <div class="history">

              <div class="history-title">

                ${item.date}
                ${item.venue || item.jcd}
                ${item.rno}R

              </div>

              <div class="history-meta">

                バージョン：
                ${item.version || "旧版"}

                <br>

                勝負度：
                ${item.confidence || "-"}

                <br>

                保存方式：
                ${
                  item.saveMode === "auto"
                    ? "自動"
                    : "手動"
                }

                <br>

                保存点数：
                ${item.bets?.length || 0}点

                <br>

                買い目：

                ${
                  item.bets
                    ?.map(
                      (b,index)=>
                        `${index+1}. ${b.combination}${
                          b.totalScore !== undefined
                            ? `（総合 ${Number(b.totalScore).toFixed(1)}）`
                            : ""
                        }`
                    )
                    .join(" / ")
                  ||
                  "なし"
                }

              </div>

              ${resultHtml}

            </div>
          `;
        }
      )
      .join("");

  renderSummary();
  renderComparison();
  renderWeights();
  renderLearning();
}

/* =========================
   レース画面
========================= */

function clearRaceArea(){

  raceGrid.innerHTML =
    "";

  racersBox.innerHTML =
    "";

  predictionBox.innerHTML =
    "";

  currentSnapshot =
    null;

  currentVenueRaces =
    [];

  raceTitle.textContent =
    "選手データ";

  racerStatus.textContent =
    "レースを選択してください";

  predictionStatus.textContent =
    "レースを選択すると予想します";
}

async function loadVenues(){

  venueStatus.textContent =
    "開催場を取得中...";

  venueSelect.innerHTML =
    '<option value="">開催場を選択</option>';

  clearRaceArea();

  try{

    const data =
      await getJSON(
        `/api/venues?hd=${apiDate()}`
      );

    for(
      const venue of
      data.venues
    ){

      const option =
        document.createElement(
          "option"
        );

      option.value =
        venue.jcd;

      option.textContent =
        `${venue.name}（${venue.jcd}）`;

      venueSelect.appendChild(
        option
      );
    }

    venueStatus.textContent =
      `${data.venues.length}会場を取得しました`;

  }catch(error){

    venueStatus.textContent =
      `取得失敗：${error.message}`;
  }
}

async function loadRaces(){

  const jcd =
    venueSelect.value;

  if(
    !jcd
  ){

    raceStatus.textContent =
      "開催場を選択してください";

    return;
  }

  raceStatus.textContent =
    "レースを取得中...";

  raceGrid.innerHTML =
    "";

  racersBox.innerHTML =
    "";

  predictionBox.innerHTML =
    "";

  currentSnapshot =
    null;

  currentVenueRaces =
    [];

  try{

    const data =
      await getJSON(
        `/api/venue?hd=${apiDate()}&jcd=${jcd}`
      );

    currentVenueRaces =
      data.races || [];

    raceStatus.textContent =
      `${data.venue || ""} ${data.races.length}レースを取得しました`;

    for(
      const race of
      data.races
    ){

      const button =
        document.createElement(
          "button"
        );

      button.className =
        "race-btn";

      button.textContent =
        `${race.rno}R`;

      button.addEventListener(
        "click",
        ()=>loadRace(
          race.rno,
          button,
          data.venue
        )
      );

      raceGrid.appendChild(
        button
      );
    }

  }catch(error){

    raceStatus.textContent =
      `取得失敗：${error.message}`;
  }
}

async function loadRace(
  rno,
  button,
  venueName
){

  const jcd =
    venueSelect.value;

  document
    .querySelectorAll(
      ".race-btn"
    )
    .forEach(
      btn =>
        btn.classList.remove(
          "active"
        )
    );

  button.classList.add(
    "active"
  );

  raceTitle.textContent =
    `${rno}R 選手データ`;

  racersBox.innerHTML =
    "";

  predictionBox.innerHTML =
    "";

  currentSnapshot =
    null;

  racerStatus.textContent =
    "選手データ取得中...";

  predictionStatus.textContent =
    "AI総合評価計算中...";

  try{

    const raceData =
      await getJSON(
        `/api/race?hd=${apiDate()}&jcd=${jcd}&rno=${rno}`
      );

    if(
      !raceData.racers?.length
    ){

      racerStatus.textContent =
        "選手データを取得できませんでした";

      return;
    }

    let beforeData = {
      racers:[]
    };

    let oddsData = {
      odds:[],
      count:0
    };

    try{

      beforeData =
        await getJSON(
          `/api/before?hd=${apiDate()}&jcd=${jcd}&rno=${rno}`
        );

    }catch{}

    try{

      oddsData =
        await getJSON(
          `/api/odds?hd=${apiDate()}&jcd=${jcd}&rno=${rno}`
        );

    }catch{}

    const merged =
      mergeBefore(
        raceData.racers,
        beforeData
      );

    racerStatus.textContent =
      `${merged.length}艇を取得しました`;

    const prediction =
      renderPrediction(
        merged,
        oddsData,
        {
          date:
            apiDate(),

          jcd,

          venue:
            venueName ||
            raceData.venue ||
            jcd,

          rno
        }
      );

    renderRacers(
      merged,
      prediction.scored,
      prediction.marks
    );

  }catch(error){

    racerStatus.textContent =
      `取得失敗：${error.message}`;

    predictionStatus.textContent =
      "予想失敗";
  }
}

/* =========================
   起動
========================= */

dateInput.value =
  todayLocal();

$("loadVenues")
  .addEventListener(
    "click",
    loadVenues
  );

$("loadRaces")
  .addEventListener(
    "click",
    loadRaces
  );

$("savePrediction")
  .addEventListener(
    "click",
    saveCurrentPrediction
  );

$("autoSaveVenue")
  .addEventListener(
    "click",
    autoSaveVenue
  );

$("checkAllResults")
  .addEventListener(
    "click",
    ()=>checkAllResults(false)
  );

$("clearHistory")
  .addEventListener(
    "click",
    ()=>{

      if(
        confirm(
          "保存履歴をすべて削除しますか？"
        )
      ){

        localStorage.removeItem(
          "boat_ai_predictions"
        );

        renderHistory();

        saveStatus.textContent =
          "保存履歴を削除しました";
      }
    }
  );

renderHistory();

setTimeout(
  ()=>{
    checkAllResults(true);
  },
  1000
);

</script>
